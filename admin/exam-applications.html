<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학학력평가 신청 관리 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; display:flex; flex-direction:column; gap:18px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 4px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:22px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input {
    width:100%; font-size:14.5px; padding:9px 11px; border-radius:10px; border:1px solid var(--gray-200);
    font-family:inherit; background:#fff;
  }
  select:focus, input:focus { outline:none; border-color: var(--navy-900); }
  .filter-row { display:flex; gap:8px; margin-bottom:0; }
  .filter-row button {
    flex:1; padding:9px; border-radius:9px; border:1px solid var(--gray-200); background:#fff;
    font-weight:700; font-size:12.5px; cursor:pointer; color: var(--muted);
  }
  .filter-row button.active { background: var(--navy-900); color:#fff; border-color: var(--navy-900); }
  .app-list { margin-top:4px; }
  .app-row { padding:14px 2px; border-top:1px solid var(--gray-200); font-size:13.5px; }
  .app-row:first-child { border-top:none; }
  .app-row .head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .app-row .name { font-weight:800; font-size:14.5px; }
  .app-row .meta { color: var(--muted); font-size:12px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; }
  .badge.hme { background:#DBEAFE; color:#1D4ED8; }
  .badge.kma { background:#FCE7F3; color:#BE185D; }
  .scores { margin-top:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; }
  .scores .label { color: var(--muted); font-weight:700; margin-right:4px; }
  .actions { display:flex; align-items:center; gap:10px; }
  .actions button { background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; padding:4px; }
  .actions .del-btn:hover { color:#DC2626; }
  .actions .edit-btn:hover { color:var(--navy-900); }
  .edit-panel { margin-top:10px; padding:14px; background: var(--gray-50); border-radius:12px; display:grid; grid-template-columns: 1fr 1fr; gap:10px; align-items:end; }
  .edit-panel label { font-size:11px; }
  .edit-actions { grid-column: 1 / -1; display:flex; gap:8px; margin-top:2px; }
  .edit-actions button { flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .edit-actions .save-btn { border:none; background:var(--navy-900); color:#fff; }
  .edit-actions .cancel-btn { border:1px solid var(--gray-200); background:#fff; color:var(--ink); }
  .empty, .loading { color: var(--muted); font-size:13px; padding:16px 4px; text-align:center; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">수학학력평가 신청 관리</span>
</header>

<main>
  <div>
    <h1>KMA · HME 신청 현황</h1>
    <p class="sub">초등부 학생들의 수학학력평가 신청 목록이에요. 성적이 나오면 예상점수/최종점수를 입력해주세요.</p>
  </div>

  <div class="panel">
    <div class="filter-row">
      <button type="button" class="filter-btn active" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="HME">HME</button>
      <button type="button" class="filter-btn" data-filter="KMA">KMA</button>
    </div>
    <div class="app-list" id="app-list"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  const appListEl = document.getElementById('app-list');
  let currentApps = [];
  let editingId = null;
  let currentFilter = 'all';

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      editingId = null;
      renderApps(currentApps);
    });
  });

  function dateLabel(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];
    return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})`;
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  async function loadApps() {
    appListEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await sb.rpc('rpc_admin_list_exam_applications', {
      p_password: getAdminPassword(),
    });
    if (error) {
      appListEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>';
      return;
    }
    currentApps = data || [];
    renderApps(currentApps);
  }
  loadApps();

  function renderApps(items) {
    const filtered = items.filter((it) => currentFilter === 'all' || it.exam_type === currentFilter);

    if (filtered.length === 0) {
      appListEl.innerHTML = '<div class="empty">신청 내역이 없습니다.</div>';
      return;
    }

    appListEl.innerHTML = filtered.map((it) => {
      const isEditing = it.id === editingId;
      const editPanel = isEditing ? `
        <div class="edit-panel">
          <div>
            <label>예상점수</label>
            <input type="number" step="0.1" class="e-predicted" data-id="${it.id}" value="${it.predicted_score ?? ''}">
          </div>
          <div>
            <label>최종점수</label>
            <input type="number" step="0.1" class="e-final" data-id="${it.id}" value="${it.final_score ?? ''}">
          </div>
          <div class="edit-actions">
            <button type="button" class="save-btn" data-id="${it.id}">저장</button>
            <button type="button" class="cancel-btn">취소</button>
          </div>
        </div>
      ` : '';

      return `
      <div class="app-row">
        <div class="head">
          <div>
            <span class="badge ${it.exam_type === 'HME' ? 'hme' : 'kma'}">${it.exam_type}</span>
            <span class="name">${it.student_name || ''}</span>
          </div>
          <div class="actions">
            <button type="button" class="edit-btn" data-id="${it.id}"><i class="fa-solid fa-pen"></i></button>
            <button type="button" class="del-btn" data-id="${it.id}"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div class="meta">
          <span>${it.school || ''} ${it.grade || ''}</span>
          <span>${it.parent_phone || ''}</span>
          <span>생년월일 ${it.birth_date || '-'}</span>
          <span>시험일 ${dateLabel(it.exam_date)}</span>
          <span>신청일 ${fmtDateTime(it.applied_at)}</span>
        </div>
        <div class="scores">
          <span><span class="label">예상점수</span>${it.predicted_score ?? '-'}</span>
          <span><span class="label">최종점수</span>${it.final_score ?? '-'}</span>
        </div>
        ${editPanel}
      </div>
    `;
    }).join('');

    appListEl.querySelectorAll('.edit-btn').forEach((btn) => {
      btn.addEventListener('click', () => { editingId = btn.dataset.id; renderApps(currentApps); });
    });
    appListEl.querySelectorAll('.cancel-btn').forEach((btn) => {
      btn.addEventListener('click', () => { editingId = null; renderApps(currentApps); });
    });
    appListEl.querySelectorAll('.save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const predictedRaw = appListEl.querySelector(`.e-predicted[data-id="${id}"]`).value.trim();
        const finalRaw = appListEl.querySelector(`.e-final[data-id="${id}"]`).value.trim();
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_update_exam_scores', {
          p_password: getAdminPassword(),
          p_id: id,
          p_predicted_score: predictedRaw === '' ? null : Number(predictedRaw),
          p_final_score: finalRaw === '' ? null : Number(finalRaw),
        });
        btn.disabled = false;
        if (error) { alert('저장 실패: ' + error.message); return; }
        editingId = null;
        loadApps();
      });
    });
    appListEl.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 신청 내역을 삭제할까요?')) return;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_delete_exam_application', {
          p_password: getAdminPassword(), p_id: btn.dataset.id,
        });
        btn.disabled = false;
        if (error) { alert('삭제 실패: ' + error.message); return; }
        loadApps();
      });
    });
  }
</script>

</body>
</html>
