<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 출퇴근 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; --green:#16A34A; --red:#C0392B; --amber:#B45309; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 6px; }
  h2 { font-size: 15px; font-weight: 900; margin: 0 0 10px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:20px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom:18px; }
  input, select { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:10px; border:1px solid var(--gray-200); background:#fff; }
  input:focus, select:focus { outline:none; border-color: var(--navy-900); }
  button.btn { padding:10px 16px; border-radius:10px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:13.5px; cursor:pointer; font-family:inherit; }
  button.btn:disabled { opacity:.5; cursor:not-allowed; }
  button.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--gray-200); }
  button.mini { padding:5px 10px; font-size:12px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; cursor:pointer; font-family:inherit; font-weight:700; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding: 9px 6px; font-size: 13px; border-top: 1px solid var(--gray-200); vertical-align: middle; }
  th { color: var(--muted); font-weight:700; font-size:12px; border-top:none; }
  .scroll { overflow-x:auto; }
  .muted { color: var(--muted); }
  .off { color:#98A1B3; text-decoration: line-through; }
  .miss { color: var(--red); font-weight:800; }
  .loading, .empty { color: var(--muted); font-size: 13px; padding: 22px 6px; text-align:center; }
  .chip { font-size:12.5px; font-weight:800; padding:5px 11px; border-radius:999px; background:var(--gray-50); border:1px solid var(--gray-200); }
  .banner { background:#FFF7ED; border:1px solid #FED7AA; color:#9A3412; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.6; margin-bottom:18px; display:none; }
  .msg { font-size:13px; margin-top:8px; min-height:18px; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
  tr.edit td { background:#F8FAFC; }
  .mini.tab.on { background:var(--navy-900); color:#fff; border-color:var(--navy-900); }
  .overlay { display:none; position:fixed; inset:0; background:rgba(11,18,32,.45); z-index:50; align-items:center; justify-content:center; padding:16px; }
  .overlay.show { display:flex; }
  .modal { background:#fff; border-radius:16px; padding:22px; width:100%; max-width:420px; max-height:92vh; overflow:auto; }
  .modal label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 4px; }
  .modal input, .modal select, .modal textarea { width:100%; font-family:inherit; font-size:14px; padding:9px 11px; border-radius:10px; border:1px solid var(--gray-200); }
  .code { font-family: Consolas, monospace; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">선생님 출퇴근</span>
</header>
<main>
  <h1>선생님 출퇴근</h1>
  <p class="sub">선생님이 학원 키오스크에서 휴대폰 뒷 4자리로 찍은 출근·퇴근 기록이에요. 하루에 여러 번 찍으면 첫 출근과 마지막 퇴근을 보여줘요. 못 찍은 날은 아래에서 시간을 직접 넣거나 고칠 수 있고, 고친 내용은 변경 이력에 남아요.</p>
  <div class="banner" id="sql-banner">선생님 출퇴근 기능이 DB에 아직 없습니다. 안내드린 SQL(71번)을 Supabase에서 먼저 실행해 주세요.</div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row"><h2 style="margin:0">선생님 명단</h2>
        <button class="mini tab on" data-tab="active">재직</button>
        <button class="mini tab" data-tab="resigned">퇴사</button></div>
      <button class="btn" id="f-new">+ 선생님 추가</button>
    </div>
    <div class="msg" id="staff-msg"></div>
    <div class="scroll"><table id="staff-table"></table></div>
  </div>

  <div class="overlay" id="ov"><div class="modal" id="ov-body"></div></div>

  <div class="panel">
    <div class="row" style="margin-bottom:12px">
      <button class="mini" id="m-prev">◀</button>
      <strong id="m-label"></strong>
      <button class="mini" id="m-next">▶</button>
      <select id="m-staff"></select>
      <span class="chip" id="m-total"></span>
    </div>
    <div class="msg" id="rec-msg"></div>
    <div class="scroll" id="rec-wrap"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  requireDirector();
  const esc = (v) => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const $ = (id) => document.getElementById(id);
  const seoulToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
  const WD = ['일','월','화','수','목','금','토'];
  let staff = [], checks = [], ym = seoulToday().slice(0, 7), editKey = null;

  function missingFn(error) { return error && (error.code === 'PGRST202' || /Could not find the function|relation .* does not exist/i.test(error.message || '')); }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }); }
  function fmtPhone(p) { return String(p || '').replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3'); }
  function monthRange() {
    const [y, m] = ym.split('-').map(Number);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return { from: `${ym}-01`, to: `${ym}-${String(last).padStart(2, '0')}`, last };
  }

  // ---------- 명단 ----------
  const CLASSROOM_OPTS = ['1강의실', '2강의실', '4강의실', '5강의실', '원장님'];
  let tab = 'active';
  async function loadStaff() {
    const { data, error } = await sb.rpc('rpc_admin_list_staff', { p_password: getAdminPassword() });
    if (error) {
      if (missingFn(error)) { $('sql-banner').style.display = 'block'; $('rec-wrap').innerHTML = ''; return false; }
      $('staff-msg').className = 'msg err'; $('staff-msg').textContent = '불러오지 못했어요: ' + error.message; return false;
    }
    staff = data || [];
    renderStaff();
    const cur = $('m-staff').value;
    $('m-staff').innerHTML = '<option value="">전체</option>' + staff.map((s) => `<option value="${esc(s.staff_code)}">${esc(s.name)}${s.active ? '' : ' (퇴사)'}</option>`).join('');
    $('m-staff').value = cur;
    return true;
  }
  function renderStaff() {
    const list = staff.filter((s) => (tab === 'active') === !!s.active);
    if (!list.length) { $('staff-table').innerHTML = `<tr><td class="empty">${tab === 'active' ? '재직 중인 선생님이 없어요. 오른쪽 위에서 추가해 주세요.' : '퇴사한 선생님이 없어요.'}</td></tr>`; return; }
    $('staff-table').innerHTML = '<tr><th>코드</th><th>이름</th><th>휴대폰</th><th>구분</th><th>강의실</th><th>' + (tab === 'active' ? '입사일' : '퇴사일') + '</th><th></th></tr>' + list.map((s) => `
      <tr>
        <td class="code">${esc(s.staff_code)}</td>
        <td><b>${esc(s.name)}</b></td>
        <td>${esc(fmtPhone(s.phone))}</td><td>${esc(s.role)}</td><td>${esc(s.classroom || '-')}</td>
        <td>${esc((tab === 'active' ? s.hire_date : s.resign_date) || '-')}</td>
        <td style="text-align:right;white-space:nowrap"><button class="mini" data-edit="${esc(s.staff_code)}">수정</button>
        <button class="mini" data-${s.active ? 'resign' : 'back'}="${esc(s.staff_code)}">${s.active ? '퇴사 처리' : '복직'}</button></td>
      </tr>`).join('');
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
    renderStaff();
  }));

  function openModal(html) { $('ov-body').innerHTML = html; $('ov').classList.add('show'); }
  function closeModal() { $('ov').classList.remove('show'); }
  function showFormMsg(t) { const m = $('mm'); if (m) { m.className = 'msg err'; m.textContent = t; } }

  function openEdit(code) {
    const s = code ? staff.find((x) => x.staff_code === code) : { name: '', phone: '', role: '강사', classroom: '', hire_date: '', memo: '' };
    openModal(`<h2>${code ? esc(s.staff_code) + ' 수정' : '선생님 추가'}</h2>
      <label>이름</label><input id="m-name" value="${esc(s.name)}">
      <label>휴대폰 번호 (키오스크에서 뒷 4자리로 찾아요)</label><input id="m-phone" inputmode="tel" value="${esc(fmtPhone(s.phone))}">
      <label>구분</label><select id="m-role">${['강사', '원장'].map((r) => `<option ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <label>담당 강의실</label><select id="m-room"><option value="">(없음)</option>${CLASSROOM_OPTS.map((r) => `<option ${r === s.classroom ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <label>입사일</label><input type="date" id="m-hire" value="${esc(s.hire_date || '')}">
      <label>메모</label><textarea id="m-memo" rows="2">${esc(s.memo || '')}</textarea>
      <div class="msg" id="mm"></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="m-save" data-code="${esc(code || '')}">저장</button><button class="btn ghost" id="m-close">취소</button></div>`);
  }
  function openResign(code) {
    const s = staff.find((x) => x.staff_code === code);
    openModal(`<h2>${esc(s.name)} 선생님 퇴사 처리</h2>
      <p class="sub" style="margin:6px 0 0">퇴사 처리하면 키오스크에서 더 이상 나오지 않아요. 지난 출퇴근 기록은 그대로 남고, 언제든 복직시킬 수 있어요.</p>
      <label>퇴사일</label><input type="date" id="r-date" value="${seoulToday()}">
      <label>메모 (선택)</label><input id="r-note" placeholder="예: 개인 사정">
      <div class="msg" id="mm"></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="r-ok" data-code="${esc(code)}">퇴사 처리</button><button class="btn ghost" id="m-close">취소</button></div>`);
  }
  $('f-new').addEventListener('click', () => openEdit(null));
  $('ov').addEventListener('click', async (e) => {
    if (e.target === $('ov') || e.target.id === 'm-close') { closeModal(); return; }
    if (e.target.id === 'm-save') {
      const code = e.target.dataset.code || null;
      e.target.disabled = true;
      const { error } = await sb.rpc('rpc_admin_save_staff', {
        p_password: getAdminPassword(), p_staff_code: code, p_name: $('m-name').value, p_phone: $('m-phone').value,
        p_role: $('m-role').value, p_classroom: $('m-room').value, p_hire_date: $('m-hire').value || null, p_memo: $('m-memo').value,
      });
      if (error) { showFormMsg(error.message); e.target.disabled = false; return; }
      closeModal(); $('staff-msg').className = 'msg ok'; $('staff-msg').textContent = '저장했어요.'; await loadStaff();
    }
    if (e.target.id === 'r-ok') {
      e.target.disabled = true;
      const { error } = await sb.rpc('rpc_admin_resign_staff', { p_password: getAdminPassword(), p_staff_code: e.target.dataset.code, p_resign_date: $('r-date').value || null, p_note: $('r-note').value });
      if (error) { showFormMsg(error.message); e.target.disabled = false; return; }
      closeModal(); $('staff-msg').className = 'msg ok'; $('staff-msg').textContent = '퇴사 처리했어요.'; await loadStaff();
    }
  });
  $('staff-table').addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.edit) openEdit(t.dataset.edit);
    else if (t.dataset.resign) openResign(t.dataset.resign);
    else if (t.dataset.back) {
      const { error } = await sb.rpc('rpc_admin_reinstate_staff', { p_password: getAdminPassword(), p_staff_code: t.dataset.back });
      if (error) { $('staff-msg').className = 'msg err'; $('staff-msg').textContent = error.message; return; }
      $('staff-msg').className = 'msg ok'; $('staff-msg').textContent = '복직 처리했어요.'; await loadStaff();
    }
  });

  // ---------- 월별 기록 ----------
  async function loadRecords() {
    const { from, to } = monthRange();
    $('m-label').textContent = `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;
    $('rec-wrap').innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await sb.rpc('rpc_admin_list_staff_checks', { p_password: getAdminPassword(), p_from: from, p_to: to });
    if (error) { $('rec-wrap').innerHTML = ''; $('rec-msg').className = 'msg err'; $('rec-msg').textContent = '기록을 불러오지 못했어요: ' + error.message; return; }
    checks = data || [];
    renderRecords();
  }
  function dayMap() {
    // key staffId|date -> {in, out}
    const m = {};
    checks.forEach((c) => {
      const k = c.staff_code + '|' + c.check_date;
      const o = m[k] || (m[k] = { in: null, out: null });
      if (c.check_type === '출근') { if (!o.in || c.checked_at < o.in) o.in = c.checked_at; }
      else if (!o.out || c.checked_at > o.out) o.out = c.checked_at;
    });
    return m;
  }
  function renderRecords() {
    const { last } = monthRange();
    const sel = $('m-staff').value;
    const list = staff.filter((s) => (sel ? s.staff_code === sel : (s.active || checks.some((c) => c.staff_code === s.staff_code))));
    const m = dayMap();
    const today = seoulToday();
    let rows = '', totalMin = 0, days = 0;
    for (let d = 1; d <= last; d++) {
      const date = `${ym}-${String(d).padStart(2, '0')}`;
      const wd = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5) - 1, d)).getUTCDay();
      list.forEach((s) => {
        const o = m[s.staff_code + '|' + date];
        const key = s.staff_code + '|' + date;
        if (!o && !(sel && date <= today && wd !== 0 && wd !== 6) && editKey !== key) return; // 개인 선택 시 평일 빈 날도 표시
        let work = '';
        if (o && o.in && o.out && o.out > o.in) { const mn = Math.round((new Date(o.out) - new Date(o.in)) / 60000); totalMin += mn; days++; work = `${Math.floor(mn / 60)}시간 ${mn % 60}분`; }
        else if (o && (o.in || o.out)) work = '<span class="miss">기록 누락</span>';
        rows += `<tr><td>${d}일 (${WD[wd]})</td><td><b>${esc(s.name)}</b>${s.active ? '' : ' <span class="muted">(퇴사)</span>'}</td>
          <td>${o && o.in ? hhmm(o.in) : '<span class="muted">-</span>'}</td>
          <td>${o && o.out ? hhmm(o.out) : '<span class="muted">-</span>'}</td><td>${work}</td>
          <td style="text-align:right"><button class="mini" data-day="${key}">${o ? '수정' : '입력'}</button></td></tr>`;
        if (editKey === key) {
          rows += `<tr class="edit"><td colspan="6"><div class="row">
            출근 <input type="time" id="e-in" value="${o && o.in ? hhmm(o.in) : ''}">
            퇴근 <input type="time" id="e-out" value="${o && o.out ? hhmm(o.out) : ''}">
            <button class="btn" id="e-save">저장</button><button class="btn ghost" id="e-cancel">취소</button>
            <span class="muted" style="font-size:12px">시간을 비우면 그 기록이 삭제돼요.</span></div></td></tr>`;
        }
      });
    }
    $('m-total').textContent = `근무 ${days}일 · 합계 ${Math.floor(totalMin / 60)}시간 ${totalMin % 60}분`;
    $('rec-wrap').innerHTML = rows
      ? `<table><tr><th>날짜</th><th>선생님</th><th>출근</th><th>퇴근</th><th>근무시간</th><th></th></tr>${rows}</table>`
      : '<div class="empty">이 달 기록이 없어요.</div>';
  }
  $('rec-wrap').addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.day) { editKey = t.dataset.day; renderRecords(); return; }
    if (t.id === 'e-cancel') { editKey = null; renderRecords(); return; }
    if (t.id === 'e-save') {
      const [sid, date] = editKey.split('|');
      t.disabled = true;
      const { error } = await sb.rpc('rpc_admin_set_staff_day', { p_password: getAdminPassword(), p_staff_code: sid, p_date: date, p_in: $('e-in').value, p_out: $('e-out').value });
      if (error) { $('rec-msg').className = 'msg err'; $('rec-msg').textContent = error.message; t.disabled = false; return; }
      $('rec-msg').className = 'msg ok'; $('rec-msg').textContent = '저장했어요.';
      editKey = null;
      await loadRecords();
    }
  });
  $('m-staff').addEventListener('change', renderRecords);
  function shiftMonth(n) { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); ym = d.toISOString().slice(0, 7); editKey = null; loadRecords(); }
  $('m-prev').addEventListener('click', () => shiftMonth(-1));
  $('m-next').addEventListener('click', () => shiftMonth(1));

  (async () => { if (await loadStaff()) await loadRecords(); })();
</script>
</body>
</html>
