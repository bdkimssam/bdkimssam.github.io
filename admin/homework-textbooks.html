<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제인증 교재/범위 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; display:flex; flex-direction:column; gap:18px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 8px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 4px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:18px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  .panel h2 { font-size:14px; font-weight:800; margin:0 0 12px; }
  .add-row { display:flex; gap:6px; margin-bottom:14px; }
  .add-row input { flex:1; padding:10px 12px; border-radius:9px; border:1px solid var(--gray-200); font-size:13.5px; font-family:inherit; }
  .add-row button { padding:10px 14px; border-radius:9px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap; }
  .add-row button:disabled { opacity:0.5; cursor:not-allowed; }
  .textbook-item { padding:11px 10px; border-radius:10px; font-size:13.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .textbook-item:hover { background: var(--gray-50); }
  .textbook-item.active { background: var(--navy-900); color:#fff; }
  .textbook-item .name-btn { flex:1; background:none; border:none; padding:0; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .textbook-item .right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .textbook-item .count { font-size:11px; font-weight:700; color: var(--muted); }
  .textbook-item.active .count { color: rgba(255,255,255,0.7); }
  .textbook-item .edit-btn, .textbook-item .delete-btn { background:none; border:none; cursor:pointer; color:inherit; opacity:0.6; font-size:12px; padding:2px; }
  .textbook-item .edit-btn:hover, .textbook-item .delete-btn:hover { opacity:1; }
  .textbook-item .delete-btn:hover { color:#DC2626; }
  .textbook-rename-row { display:flex; gap:6px; padding:6px 2px; }
  .textbook-rename-row input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--gray-200); font-size:13px; font-family:inherit; }
  .textbook-rename-row button { padding:8px 10px; border-radius:8px; border:none; background:var(--navy-900); color:#fff; font-weight:700; font-size:12px; cursor:pointer; }
  .range-row { display:flex; align-items:center; gap:8px; padding:9px 4px; border-top:1px solid var(--gray-200); font-size:13px; }
  .range-row:first-child { border-top:none; }
  .range-row .order-badge { width:26px; height:26px; border-radius:50%; background:var(--gray-50); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; color:var(--muted); flex-shrink:0; }
  .empty, .loading { color: var(--muted); font-size:13px; padding:16px 4px; text-align:center; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">숙제인증 교재/범위</span>
</header>

<main>
  <h1>교재 / 범위 관리</h1>
  <p class="sub">교재를 먼저 만들고, 그 밑에 범위(1~20번, 21~40번...)를 순서대로 전체 등록해두시면 됩니다.</p>

  <div class="panel">
    <h2>교재 목록</h2>
    <div class="add-row">
      <input type="text" id="new-textbook-input" placeholder="새 교재명 (예: 마플교과서 중3-2)">
      <button type="button" id="add-textbook-btn">추가</button>
    </div>
    <div id="textbook-list"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="panel">
    <h2 id="range-panel-title">범위 목록</h2>
    <div id="range-add-row" class="add-row" style="display:none;">
      <input type="text" id="new-range-input" placeholder="범위 (예: 1~20번)">
      <button type="button" id="add-range-btn">추가</button>
    </div>
    <div id="range-list"><div class="empty">왼쪽에서 교재를 먼저 선택하세요.</div></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  let allTextbooks = [];
  let selectedTextbookId = null;

  async function loadTextbooks() {
    const listEl = document.getElementById('textbook-list');
    const { data, error } = await sb.rpc('rpc_admin_list_homework_textbooks', { p_password: getAdminPassword() });
    if (error) { listEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>'; return; }
    allTextbooks = data || [];
    renderTextbooks();
  }

  let renamingTextbookId = null;

  function renderTextbooks() {
    const listEl = document.getElementById('textbook-list');
    if (allTextbooks.length === 0) { listEl.innerHTML = '<div class="empty">등록된 교재가 없습니다.</div>'; return; }
    listEl.innerHTML = allTextbooks.map((t) => {
      if (t.id === renamingTextbookId) {
        return `
          <div class="textbook-rename-row">
            <input type="text" class="rename-input" data-id="${t.id}" value="${t.textbook_name}">
            <button type="button" class="rename-save-btn" data-id="${t.id}">저장</button>
            <button type="button" class="rename-cancel-btn" style="background:#fff; color:var(--ink); border:1px solid var(--gray-200);">취소</button>
          </div>
        `;
      }
      return `
        <div class="textbook-item ${t.id === selectedTextbookId ? 'active' : ''}" data-id="${t.id}" data-name="${t.textbook_name}">
          <button type="button" class="name-btn" data-id="${t.id}" data-name="${t.textbook_name}">${t.textbook_name}</button>
          <span class="right">
            <span class="count">${t.range_count}개</span>
            <button type="button" class="edit-btn" data-id="${t.id}"><i class="fa-solid fa-pen"></i></button>
            <button type="button" class="delete-btn" data-id="${t.id}" data-name="${t.textbook_name}"><i class="fa-solid fa-trash"></i></button>
          </span>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.name-btn').forEach((el) => {
      el.addEventListener('click', () => selectTextbook(el.dataset.id, el.dataset.name));
    });
    listEl.querySelectorAll('.edit-btn').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        renamingTextbookId = el.dataset.id;
        renderTextbooks();
      });
    });
    listEl.querySelectorAll('.rename-cancel-btn').forEach((el) => {
      el.addEventListener('click', () => { renamingTextbookId = null; renderTextbooks(); });
    });
    listEl.querySelectorAll('.delete-btn').forEach((el) => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`"${el.dataset.name}" 교재를 삭제할까요?\n제출된 인증 기록이 있으면 삭제되지 않습니다.`)) return;
        el.disabled = true;
        const { error } = await sb.rpc('rpc_admin_delete_homework_textbook', {
          p_password: getAdminPassword(), p_textbook_id: el.dataset.id,
        });
        el.disabled = false;
        if (error) { alert('삭제 실패: ' + error.message); return; }
        if (el.dataset.id === selectedTextbookId) {
          selectedTextbookId = null;
          document.getElementById('range-panel-title').textContent = '범위 목록';
          document.getElementById('range-add-row').style.display = 'none';
          document.getElementById('range-list').innerHTML = '<div class="empty">왼쪽에서 교재를 먼저 선택하세요.</div>';
        }
        loadTextbooks();
      });
    });
    listEl.querySelectorAll('.rename-save-btn').forEach((el) => {
      el.addEventListener('click', async () => {
        const input = listEl.querySelector(`.rename-input[data-id="${el.dataset.id}"]`);
        const newName = input.value.trim();
        if (!newName) return;
        el.disabled = true;
        const { error } = await sb.rpc('rpc_admin_rename_homework_textbook', {
          p_password: getAdminPassword(), p_textbook_id: el.dataset.id, p_textbook_name: newName,
        });
        el.disabled = false;
        if (error) { alert('수정 실패: ' + error.message); return; }
        renamingTextbookId = null;
        if (document.getElementById('range-panel-title').textContent.includes('—') && el.dataset.id === selectedTextbookId) {
          document.getElementById('range-panel-title').textContent = `범위 목록 — ${newName}`;
        }
        loadTextbooks();
      });
    });
  }

  document.getElementById('add-textbook-btn').addEventListener('click', async () => {
    const input = document.getElementById('new-textbook-input');
    const name = input.value.trim();
    if (!name) return;
    const btn = document.getElementById('add-textbook-btn');
    btn.disabled = true;
    const { error } = await sb.rpc('rpc_admin_add_homework_textbook', { p_password: getAdminPassword(), p_textbook_name: name });
    btn.disabled = false;
    if (error) { alert('추가 실패: ' + error.message); return; }
    input.value = '';
    loadTextbooks();
  });

  function selectTextbook(id, name) {
    selectedTextbookId = id;
    document.getElementById('range-panel-title').textContent = `범위 목록 — ${name}`;
    document.getElementById('range-add-row').style.display = 'flex';
    renderTextbooks();
    loadRanges();
  }

  let allRanges = [];
  let renamingRangeId = null;

  async function loadRanges() {
    const listEl = document.getElementById('range-list');
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await sb.rpc('rpc_admin_list_homework_textbook_ranges', {
      p_password: getAdminPassword(), p_textbook_id: selectedTextbookId,
    });
    if (error) { listEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>'; return; }
    allRanges = data || [];
    renderRanges();
  }

  function renderRanges() {
    const listEl = document.getElementById('range-list');
    if (allRanges.length === 0) { listEl.innerHTML = '<div class="empty">등록된 범위가 없습니다.</div>'; return; }
    listEl.innerHTML = allRanges.map((r) => {
      if (r.id === renamingRangeId) {
        return `
          <div class="range-row">
            <span class="order-badge">${r.range_order}</span>
            <input type="text" class="range-rename-input" data-id="${r.id}" value="${r.range_text}" style="flex:1; padding:7px 9px; border-radius:8px; border:1px solid var(--gray-200); font-size:12.5px; font-family:inherit;">
            <button type="button" class="range-save-btn" data-id="${r.id}" style="padding:7px 10px; border-radius:8px; border:none; background:var(--navy-900); color:#fff; font-weight:700; font-size:12px; cursor:pointer;">저장</button>
            <button type="button" class="range-cancel-btn" style="padding:7px 10px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; color:var(--ink); font-weight:700; font-size:12px; cursor:pointer;">취소</button>
          </div>
        `;
      }
      return `
        <div class="range-row">
          <span class="order-badge">${r.range_order}</span>
          <span style="flex:1;">${r.range_text}</span>
          <button type="button" class="range-edit-btn" data-id="${r.id}" style="background:none; border:none; cursor:pointer; color:var(--muted); font-size:12px; padding:2px;"><i class="fa-solid fa-pen"></i></button>
          <button type="button" class="range-delete-btn" data-id="${r.id}" data-text="${r.range_text}" style="background:none; border:none; cursor:pointer; color:var(--muted); font-size:12px; padding:2px;"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.range-edit-btn').forEach((el) => {
      el.addEventListener('click', () => { renamingRangeId = el.dataset.id; renderRanges(); });
    });
    listEl.querySelectorAll('.range-cancel-btn').forEach((el) => {
      el.addEventListener('click', () => { renamingRangeId = null; renderRanges(); });
    });
    listEl.querySelectorAll('.range-delete-btn').forEach((el) => {
      el.addEventListener('click', async () => {
        if (!confirm(`"${el.dataset.text}" 범위를 삭제할까요?\n제출된 인증 기록이 있으면 삭제되지 않습니다.`)) return;
        el.disabled = true;
        const { error } = await sb.rpc('rpc_admin_delete_homework_textbook_range', {
          p_password: getAdminPassword(), p_range_id: el.dataset.id,
        });
        el.disabled = false;
        if (error) { alert('삭제 실패: ' + error.message); return; }
        loadRanges();
        loadTextbooks();
      });
    });
    listEl.querySelectorAll('.range-save-btn').forEach((el) => {
      el.addEventListener('click', async () => {
        const input = listEl.querySelector(`.range-rename-input[data-id="${el.dataset.id}"]`);
        const newText = input.value.trim();
        if (!newText) return;
        el.disabled = true;
        const { error } = await sb.rpc('rpc_admin_update_homework_textbook_range', {
          p_password: getAdminPassword(), p_range_id: el.dataset.id, p_range_text: newText,
        });
        el.disabled = false;
        if (error) { alert('수정 실패: ' + error.message); return; }
        renamingRangeId = null;
        loadRanges();
      });
    });
  }

  document.getElementById('add-range-btn').addEventListener('click', async () => {
    if (!selectedTextbookId) return;
    const input = document.getElementById('new-range-input');
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('add-range-btn');
    btn.disabled = true;
    const { error } = await sb.rpc('rpc_admin_add_homework_textbook_range', {
      p_password: getAdminPassword(), p_textbook_id: selectedTextbookId, p_range_text: text,
    });
    btn.disabled = false;
    if (error) { alert('추가 실패: ' + error.message); return; }
    input.value = '';
    loadRanges();
    loadTextbooks();
  });

  document.getElementById('new-range-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('add-range-btn').click();
  });
  document.getElementById('new-textbook-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('add-textbook-btn').click();
  });

  loadTextbooks();
</script>

</body>
</html>
