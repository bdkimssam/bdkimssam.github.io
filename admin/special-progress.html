<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특강 진도·출결 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; --green:#16A34A; --red:#C0392B; --teal:#0F766E; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 6px; }
  h2 { font-size: 15px; font-weight: 900; margin: 0 0 10px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:16px 20px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom:18px; }
  select, input[type=date], input[type=text], textarea { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:10px; border:1px solid var(--gray-200); background:#fff; }
  textarea { width:100%; min-height:90px; line-height:1.6; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button.btn { padding:10px 16px; border-radius:10px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  button.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--gray-200); }
  button.mini { padding:5px 9px; font-size:12px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; cursor:pointer; font-family:inherit; font-weight:700; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { padding:9px 16px; border-radius:999px; border:1px solid var(--gray-200); background:#fff; font-weight:800; font-size:13.5px; cursor:pointer; font-family:inherit; color:var(--muted); }
  .tab.on { background:var(--navy-900); color:#fff; border-color:var(--navy-900); }
  .loading, .empty { color: var(--muted); font-size: 13px; padding: 24px 6px; text-align:center; }
  .msg { font-size:13px; min-height:18px; margin-bottom:8px; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
  .banner { background:#FFF7ED; border:1px solid #FED7AA; color:#9A3412; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.6; margin-bottom:18px; display:none; }
  .progress { height:12px; background:var(--gray-200); border-radius:999px; overflow:hidden; margin:6px 0 4px; }
  .progress > i { display:block; height:100%; background:var(--teal); border-radius:999px; }
  .book-block { border:1px solid var(--gray-200); border-radius:12px; padding:12px; margin-top:10px; }
  .book-title { font-weight:800; font-size:13.5px; margin-bottom:8px; }
  .hist-item { padding:12px 0; border-top:1px solid var(--gray-200); }
  .hist-item:first-of-type { border-top:none; }
  .pl { font-size:13.5px; margin-top:8px; line-height:1.5; }
  .unit { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--gray-200); }
  .unit:first-of-type { border-top:none; }
  .unit input[type=checkbox] { width:22px; height:22px; accent-color:var(--teal); cursor:pointer; flex:none; }
  .unit .t { flex:1; font-size:14.5px; font-weight:700; min-width:0; word-break:break-all; }
  .unit.done .t { color:var(--muted); text-decoration:line-through; }
  .unit .d { font-size:12px; color:var(--muted); white-space:nowrap; }
  .att { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--gray-200); flex-wrap:wrap; }
  .att:first-of-type { border-top:none; }
  .att .n { font-weight:800; min-width:90px; }
  .att .g { font-size:12.5px; color:var(--muted); min-width:56px; }
  .st { padding:6px 12px; border-radius:999px; border:1px solid var(--gray-200); background:#fff; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; color:var(--muted); }
  .st.on-출석 { background:#DCFCE7; border-color:#86EFAC; color:#15803D; }
  .st.on-지각 { background:#FEF3C7; border-color:#FCD34D; color:#B45309; }
  .st.on-결석 { background:#FEE2E2; border-color:#FCA5A5; color:#B91C1C; }
  .tag { font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; background:#E0F2FE; color:#0369A1; }
  .scroll { overflow-x:auto; }
  table { border-collapse: collapse; min-width:100%; }
  th, td { text-align:center; padding:7px 8px; font-size:13px; border-top:1px solid var(--gray-200); white-space:nowrap; }
  th { color:var(--muted); font-weight:700; font-size:12px; border-top:none; }
  th.l, td.l { text-align:left; font-weight:700; }
  .c-출석 { color:#15803D; font-weight:800; } .c-지각 { color:#B45309; font-weight:800; } .c-결석 { color:#B91C1C; font-weight:800; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">특강 진도·출결</span>
</header>
<main>
  <h1>특강 진도 · 출결</h1>
  <p class="sub">특강을 고른 뒤, <b>진도</b>에서는 수업한 날 나간 중단원을 기록해요. <b>출결</b>에서는 수강 확정된 학생의 출석·지각·결석을 입력해요.</p>
  <div class="banner" id="sql-banner">특강 진도·출결 기능이 DB에 아직 없습니다. 안내드린 SQL(77, 78번)을 Supabase에서 먼저 실행해 주세요.</div>

  <div class="panel">
    <div class="row"><select id="f-lec"></select></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" data-tab="progress">진도</button>
    <button type="button" class="tab" data-tab="att">출결</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="view"><div class="loading">불러오는 중...</div></div>
</main>

<script src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  requireDirector();
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const todayKST = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
  const md = (d) => { if (!d) return ''; const [, m, dd] = String(d).slice(0, 10).split('-'); return `${+m}/${+dd}`; };
  function missingFn(e) { return e && (e.code === 'PGRST202' || /Could not find the function|does not exist/i.test(e.message || '')); }
  function setMsg(t, cls) { $('msg').className = 'msg ' + (cls || ''); $('msg').textContent = t || ''; }
  const pw = () => getAdminPassword();

  let lectures = [], tab = 'progress', lecId = null;
  let progressMissing = false, progress = [], roster = [], attRows = [], attDate = todayKST();

  async function loadLectures() {
    const { data, error } = await sb.rpc('rpc_admin_list_special_lectures', { p_password: pw(), p_include_archived: false });
    if (error) { $('view').innerHTML = ''; setMsg('특강을 불러오지 못했어요: ' + error.message, 'err'); return; }
    lectures = data || [];
    if (!lectures.length) { $('f-lec').innerHTML = ''; $('view').innerHTML = '<div class="empty">등록된 특강이 없어요. 방학특강 관리에서 먼저 특강을 등록해 주세요.</div>'; return; }
    $('f-lec').innerHTML = lectures.map((l) => `<option value="${esc(l.id)}">${esc(l.title)}${l.start_date ? ` (${md(l.start_date)}~${md(l.end_date)})` : ''}</option>`).join('');
    lecId = lectures[0].id;
    await loadCurrent();
  }
  async function loadCurrent() {
    setMsg('');
    $('view').innerHTML = '<div class="loading">불러오는 중...</div>';
    bookUnits = []; changingBook = false;
    const [u, r, a, tb] = await Promise.all([
      sb.rpc('rpc_admin_list_special_progress', { p_password: pw(), p_lecture_id: lecId }),
      sb.rpc('rpc_admin_list_special_roster', { p_password: pw(), p_lecture_id: lecId }),
      sb.rpc('rpc_admin_list_special_attendance', { p_password: pw(), p_lecture_id: lecId }),
      sb.rpc('rpc_admin_get_special_textbook', { p_password: pw(), p_lecture_id: lecId }),
    ]);
    // 진도(80번)가 아직 없어도 출결(77·78번)은 쓸 수 있게 따로 처리
    progressMissing = !!((u.error && missingFn(u.error)) || (tb.error && missingFn(tb.error)));
    const err = (u.error && !progressMissing ? u.error : null) || (tb.error && !progressMissing ? tb.error : null) || r.error || a.error;
    if (err) {
      if (missingFn(err)) { $('sql-banner').style.display = 'block'; $('view').innerHTML = ''; return; }
      $('view').innerHTML = ''; setMsg('불러오지 못했어요: ' + err.message, 'err'); return;
    }
    $('sql-banner').style.display = 'none';
    progress = progressMissing ? [] : (u.data || []); lectBook = !progressMissing && tb.data && tb.data.length ? tb.data[0] : null; roster = r.data || []; attRows = a.data || [];
    render();
  }

  function render() { tab === 'progress' ? renderProgress() : renderAtt(); }

  // ---- 진도 (특강 교재 1개 지정 → 회차별로 나간 중단원 체크, 나눠서 하면 번호, 직접 입력) ----
  let lectBook = null;      // {textbook_code, label}
  let bookUnits = [];       // 특강 교재의 커리큘럼 단원
  let changingBook = false;
  let books = null, groups = {};
  const unitTitle = (u) => (u.minor_unit ? `[${u.major_unit}] ${u.minor_unit}` : `[${u.major_unit}]`);
  const progressBar = (p) => (p == null ? '' : `<div class="progress"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div><div style="font-size:12px;color:var(--muted);">진도율 ${Math.round(p)}%</div>`);

  async function ensureBooks() {
    if (books !== null) return true;
    const { data, error } = await sb.rpc('rpc_admin_list_textbooks', { p_password: pw() });
    if (error) { setMsg('교재 목록을 불러오지 못했어요: ' + error.message, 'err'); return false; }
    books = data || []; groups = {};
    books.forEach((t) => { const k = t.grade + (t.semester ? '-' + t.semester : ''); (groups[k] = groups[k] || []).push(t); });
    return true;
  }
  async function loadBookUnits() {
    bookUnits = [];
    if (!lectBook) return;
    const { data, error } = await sb.rpc('rpc_admin_list_curriculum_units', { p_password: pw(), p_textbook_code: lectBook.textbook_code });
    if (error) { setMsg('단원을 불러오지 못했어요: ' + error.message, 'err'); return; }
    bookUnits = (data || []).slice().sort((a, b) => a.unit_order - b.unit_order);
  }

  async function renderProgress() {
    if (progressMissing) { $('view').innerHTML = '<div class="empty">진도 기능 SQL(80번)이 아직 DB에 없어요. 안내드린 SQL을 먼저 실행해 주세요.</div>'; return; }
    if (!lectBook || changingBook) { renderBookPicker(); return; }
    if (!bookUnits.length) await loadBookUnits();
    const used = {};   // order -> [날짜 md]
    progress.slice().reverse().forEach((r) => (r.units || []).forEach((u) => { (used[u.order] = used[u.order] || []).push(md(r.recorded_date)); }));
    const hist = progress.length ? progress.map((r, i) => `
      <div class="hist-item" data-id="${esc(r.id)}">
        <div class="row" style="justify-content:space-between;">
          <b>${esc(String(r.recorded_date).slice(0, 10))}${i === 0 ? ' <span class="tag">최근</span>' : ''}</b>
          <button type="button" class="mini p-del">삭제</button>
        </div>
        ${(r.units || []).map((u) => `<div class="pl">${esc(u.title)}${u.part ? ' ' + esc(u.part) : ''}</div>`).join('')}
        ${r.note ? `<div class="pl">📝 ${esc(r.note)}</div>` : ''}
        ${progressBar(r.percent)}
      </div>`).join('') : '<div class="empty">아직 진도 기록이 없어요.</div>';
    const rows = bookUnits.length ? bookUnits.map((u) => `
      <div class="unit" data-order="${u.unit_order}">
        <input type="checkbox" class="u-chk">
        <span class="t">${esc(unitTitle(u))}</span>
        ${used[u.unit_order] ? `<span class="d">${esc(used[u.unit_order].join(', '))} 나감</span>` : ''}
        <select class="u-part" disabled title="나눠서 할 때만 번호를 골라요"><option value="">번호 없음</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
      </div>`).join('') : '<div class="empty">이 교재에는 입력된 단원이 없어요.</div>';
    $('view').innerHTML = `
      <div class="panel">
        <div class="row" style="justify-content:space-between;"><div><span style="font-size:12.5px;color:var(--muted);font-weight:700;">특강 교재</span><div style="font-weight:800;">${esc(lectBook.label)}</div></div><button type="button" class="mini" id="b-change">교재 변경</button></div>
      </div>
      <div class="panel">
        <h2>진도 기록</h2>
        <p class="sub" style="margin-bottom:10px;">수업한 날짜를 고르고, 그날 나간 중단원을 체크해요. 하루에 여러 개도 가능해요. 한 중단원을 나눠서 하면 번호(1, 2…)를 골라요. 같은 날짜로 다시 저장하면 그날 기록이 수정돼요.</p>
        <div class="row" style="margin-bottom:6px;"><label style="font-weight:800;font-size:13px;">수업 날짜</label><input type="date" id="p-date" value="${todayKST()}"><span id="p-exists" class="tag" style="display:none;">이 날짜 기록이 있어요 · 저장하면 수정돼요</span></div>
        <div id="u-box">${rows}</div>
        <div style="margin-top:10px;"><label style="font-weight:800;font-size:13px;">직접 입력 (선택)</label>
          <input type="text" id="p-note" maxlength="300" placeholder="예) 테스트, 생기부 특강, 복습" style="width:100%;margin-top:6px;"></div>
        <div style="margin-top:12px;"><button type="button" class="btn" id="p-save">진도 기록 저장</button></div>
      </div>
      <div class="panel">${hist}</div>`;
    const box = $('u-box');
    box.querySelectorAll('.unit').forEach((row) => {
      const chk = row.querySelector('.u-chk'), part = row.querySelector('.u-part');
      chk.onchange = () => { part.disabled = !chk.checked; if (!chk.checked) part.value = ''; };
    });
    const fill = () => {
      const rec = progress.find((r) => String(r.recorded_date).slice(0, 10) === $('p-date').value);
      $('p-exists').style.display = rec ? '' : 'none';
      box.querySelectorAll('.unit').forEach((row) => {
        const u = rec && (rec.units || []).find((x) => String(x.order) === row.dataset.order);
        const chk = row.querySelector('.u-chk'), part = row.querySelector('.u-part');
        chk.checked = !!u; part.disabled = !u; part.value = u && u.part ? String(u.part) : '';
      });
      $('p-note').value = rec && rec.note ? rec.note : '';
    };
    $('p-date').onchange = fill; fill();
    $('b-change').onclick = () => { changingBook = true; renderProgress(); };
    $('p-save').onclick = saveProgress;
    $('view').querySelectorAll('.hist-item').forEach((row) => {
      row.querySelector('.p-del').onclick = async () => {
        if (!confirm('이 진도 기록을 삭제할까요?')) return;
        const { error } = await sb.rpc('rpc_admin_delete_special_progress', { p_password: pw(), p_id: row.dataset.id });
        if (error) { setMsg('삭제 실패: ' + error.message, 'err'); return; }
        await loadCurrent(); setMsg('삭제했어요.', 'ok');
      };
    });
  }

  async function renderBookPicker() {
    $('view').innerHTML = `
      <div class="panel">
        <h2>특강 교재 정하기</h2>
        <p class="sub" style="margin-bottom:10px;">이 특강에서 쓰는 교재를 한 번만 정해 주세요. 이후 진도 기록에는 이 교재의 단원만 나와요.${lectBook && progress.length ? ' <b>교재를 바꾸면 이미 저장된 기록은 그대로 남지만, 단원 표시가 이전 교재 기준이라 헷갈릴 수 있어요.</b>' : ''}</p>
        <div class="row"><select id="bk-gs"><option value="">학년학기 선택</option></select><select id="bk-name" disabled><option value="">학년학기 먼저 선택</option></select></div>
        <div style="margin-top:12px;" class="row"><button type="button" class="btn" id="bk-save">교재 저장</button>${lectBook ? '<button type="button" class="btn ghost" id="bk-cancel">취소</button>' : ''}</div>
      </div>`;
    if (!(await ensureBooks())) return;
    const gs = $('bk-gs'), nm = $('bk-name');
    gs.innerHTML = '<option value="">학년학기 선택</option>' + sortGradeSemesterKeys(Object.keys(groups)).map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
    gs.onchange = () => {
      if (!gs.value) { nm.innerHTML = '<option value="">학년학기 먼저 선택</option>'; nm.disabled = true; return; }
      nm.innerHTML = '<option value="">교재명 선택</option>' + (groups[gs.value] || []).map((t) => `<option value="${esc(t.textbook_code)}" data-name="${esc(t.textbook_name)}">[${esc(t.category || '-')}] ${esc(t.textbook_name)}</option>`).join('');
      nm.disabled = false;
    };
    if ($('bk-cancel')) $('bk-cancel').onclick = () => { changingBook = false; renderProgress(); };
    $('bk-save').onclick = async () => {
      if (!gs.value || !nm.value) { setMsg('학년학기와 교재를 골라 주세요.', 'err'); return; }
      const label = `[${gs.value}] ${nm.selectedOptions[0].dataset.name}`;
      $('bk-save').disabled = true;
      const { error } = await sb.rpc('rpc_admin_set_special_textbook', { p_password: pw(), p_lecture_id: lecId, p_code: nm.value, p_label: label });
      if (error) { $('bk-save').disabled = false; setMsg('저장 실패: ' + error.message, 'err'); return; }
      changingBook = false; await loadCurrent(); setMsg('특강 교재를 저장했어요.', 'ok');
    };
  }

  async function saveProgress() {
    const date = $('p-date').value;
    if (!date) { setMsg('수업 날짜를 선택해 주세요.', 'err'); return; }
    const picked = [...$('u-box').querySelectorAll('.unit')].filter((r) => r.querySelector('.u-chk').checked).map((r) => {
      const order = parseInt(r.dataset.order, 10), u = bookUnits.find((x) => x.unit_order === order), part = r.querySelector('.u-part').value;
      return { order, title: unitTitle(u), part: part ? parseInt(part, 10) : null };
    });
    const note = $('p-note').value.trim();
    if (!picked.length && !note) { setMsg('나간 중단원을 체크하거나 직접 입력해 주세요.', 'err'); return; }
    const percent = picked.length && bookUnits.length ? Math.round(Math.max(...picked.map((x) => x.order)) / bookUnits.length * 100) : null;
    $('p-save').disabled = true;
    const { error } = await sb.rpc('rpc_admin_save_special_progress', { p_password: pw(), p_lecture_id: lecId, p_date: date, p_units: picked, p_note: note, p_percent: percent });
    if (error) { $('p-save').disabled = false; setMsg('저장 실패: ' + error.message, 'err'); return; }
    await loadCurrent(); setMsg('진도를 저장했어요.', 'ok');
  }

  // ---- 출결 ----
  function renderAtt() {
    const byApp = {};
    attRows.forEach((r) => { (byApp[r.application_id] = byApp[r.application_id] || {})[String(r.attend_date).slice(0, 10)] = r; });
    const dates = [...new Set(attRows.map((r) => String(r.attend_date).slice(0, 10)))].sort();
    const dayRows = roster.length ? roster.map((s) => {
      const cur = (byApp[s.application_id] || {})[attDate];
      const st = cur ? cur.status : null;
      return `<div class="att" data-app="${esc(s.application_id)}">
        <span class="n">${esc(s.student_name)}${s.applicant_type === 'outsider' ? ' <span class="tag">외부</span>' : ''}</span>
        <span class="g">${esc(s.grade || '')}</span>
        ${['출석', '지각', '결석'].map((v) => `<button type="button" class="st ${st === v ? 'on-' + v : ''}" data-v="${v}">${v}</button>`).join('')}
        ${cur && cur.source === 'kiosk' ? '<span class="tag">키오스크</span>' : ''}
        ${st === '지각' || st === '결석' ? `<input type="text" class="memo" maxlength="200" placeholder="${st} 사유 (입력 후 엔터)" value="${esc(cur.memo || '')}" style="flex:1 1 100%;${cur.memo ? '' : 'border-color:#FCD34D;'}">` : ''}
      </div>`;
    }).join('') : '<div class="empty">수강 확정된 학생이 없어요.</div>';
    const matrix = roster.length && dates.length ? `
      <div class="panel scroll">
        <h2>출결 한눈에 보기</h2>
        <table><thead><tr><th class="l">이름</th>${dates.map((d) => `<th>${esc(md(d))}</th>`).join('')}<th>출석</th><th>지각</th><th>결석</th></tr></thead><tbody>
        ${roster.map((s) => {
          const m = byApp[s.application_id] || {};
          const cnt = { 출석: 0, 지각: 0, 결석: 0 };
          const cells = dates.map((d) => { const r = m[d]; if (!r) return '<td>-</td>'; cnt[r.status]++; return `<td class="c-${r.status}" ${r.memo ? `title="${esc(r.memo)}"` : ''}>${r.status === '출석' ? '○' : r.status === '지각' ? '△' : '×'}</td>`; }).join('');
          return `<tr><td class="l">${esc(s.student_name)}</td>${cells}<td>${cnt.출석}</td><td>${cnt.지각}</td><td>${cnt.결석}</td></tr>`;
        }).join('')}
        </tbody></table>
      </div>` : '';
    $('view').innerHTML = `
      <div class="panel">
        <div class="row" style="margin-bottom:8px;"><h2 style="margin:0;">날짜</h2><input type="date" id="att-date" value="${esc(attDate)}"><span style="font-size:12.5px;color:var(--muted);">버튼을 다시 누르면 그날 기록이 지워져요.</span></div>
        ${dayRows}
      </div>${matrix}`;
    const reasons = attRows.filter((r) => r.memo).map((r) => {
      const st = roster.find((x) => x.application_id === r.application_id);
      return { d: String(r.attend_date).slice(0, 10), n: st ? st.student_name : '', s: r.status, m: r.memo };
    }).sort((a, b) => a.d.localeCompare(b.d) || a.n.localeCompare(b.n, 'ko'));
    if (reasons.length) {
      $('view').insertAdjacentHTML('beforeend', `<div class="panel"><h2>지각·결석 사유</h2>${reasons.map((x) => `<div class="att"><span class="g" style="min-width:48px;">${esc(md(x.d))}</span><span class="n">${esc(x.n)}</span><span class="c-${x.s}" style="font-weight:800;">${x.s}</span><span style="font-size:13.5px;">${esc(x.m)}</span></div>`).join('')}</div>`);
    }
    $('view').querySelectorAll('.att .memo').forEach((inp) => {
      const row = inp.closest('.att');
      const save = async () => {
        const appId = row.dataset.app, cur = (byApp[appId] || {})[attDate];
        if ((cur && cur.memo || '') === inp.value.trim()) return;
        const { error } = await sb.rpc('rpc_admin_set_special_attendance_memo', { p_password: pw(), p_application_id: appId, p_date: attDate, p_memo: inp.value });
        if (error) { setMsg(missingFn(error) ? '사유 메모 SQL(78번)이 DB에 아직 없어요. 안내드린 SQL을 먼저 실행해 주세요.' : '저장 실패: ' + error.message, 'err'); return; }
        const a = await sb.rpc('rpc_admin_list_special_attendance', { p_password: pw(), p_lecture_id: lecId });
        if (!a.error) attRows = a.data || [];
        renderAtt(); setMsg('사유를 저장했어요.', 'ok');
      };
      inp.addEventListener('change', save);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    });
    $('att-date').onchange = (e) => { if (e.target.value) { attDate = e.target.value; renderAtt(); } };
    $('view').querySelectorAll('.att').forEach((row) => {
      row.querySelectorAll('.st').forEach((btn) => {
        btn.onclick = async () => {
          const appId = row.dataset.app, cur = (byApp[appId] || {})[attDate];
          const next = cur && cur.status === btn.dataset.v ? null : btn.dataset.v;
          row.querySelectorAll('.st').forEach((b) => { b.disabled = true; });
          const { error } = await sb.rpc('rpc_admin_set_special_attendance', { p_password: pw(), p_application_id: appId, p_date: attDate, p_status: next });
          if (error) { setMsg('저장 실패: ' + error.message, 'err'); }
          const a = await sb.rpc('rpc_admin_list_special_attendance', { p_password: pw(), p_lecture_id: lecId });
          if (!a.error) attRows = a.data || [];
          renderAtt();
        };
      });
    });
  }

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
    setMsg(''); if (lecId) render();
  }));
  $('f-lec').addEventListener('change', () => { lecId = $('f-lec').value; loadCurrent(); });

  loadLectures();
</script>
</body>
</html>
