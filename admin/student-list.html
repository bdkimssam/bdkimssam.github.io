<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 목록 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 8px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; line-height:1.6; }
  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .toolbar label { font-size:13px; font-weight:700; color: var(--muted); }
  select.grade-filter {
    flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--gray-200); background:#fff;
    font-size:14px; font-family:inherit; color: var(--ink);
  }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding: 6px 20px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding: 11px 6px; font-size: 13.5px; border-top: 1px solid var(--gray-200); }
  th { color: var(--muted); font-weight:700; font-size:12px; border-top:none; }
  tr:first-child td { border-top:none; }
  td.name { font-weight:700; }
  td.code { color: var(--muted); font-family: 'SFMono-Regular', Consolas, monospace; font-size:12.5px; }
  select.classroom-select {
    padding:7px 10px; border-radius:8px; border:1px solid var(--gray-200); background:#fff;
    font-size:13px; font-family:inherit; color: var(--ink); cursor:pointer;
  }
  select.classroom-select.saving, input.attend-date.saving { opacity:0.5; }
  input.attend-date {
    padding:6px 8px; border-radius:8px; border:1px solid var(--gray-200); background:#fff;
    font-size:12.5px; font-family:inherit; color: var(--ink); width:128px;
  }
  .loading, .empty { color: var(--muted); font-size: 13px; padding: 30px 6px; text-align:center; }
  .sg { display:inline-block; font-size:11px; font-weight:800; padding:3px 7px; border-radius:999px; }
  .sg.ok { background:#DCFCE7; color:#15803D; }
  .sg.no { background:#F3F4F6; color:#9CA3AF; }
  .count-badge { font-size:12px; color: var(--muted); font-weight:700; }
  .issue-panel {
    background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding: 18px 20px;
    box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .issue-panel .label { font-weight:800; font-size:13.5px; margin-right:4px; }
  select.level-select {
    padding:10px 12px; border-radius:10px; border:1px solid var(--gray-200); background:#fff;
    font-size:14px; font-family:inherit; color: var(--ink);
  }
  button.issue-btn {
    padding:10px 16px; border-radius:10px; border:none; background:var(--navy-900); color:#fff;
    font-weight:800; font-size:13.5px; cursor:pointer;
  }
  button.issue-btn:hover { background:#000; }
  button.issue-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .issued-code {
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:900;
    background: var(--gray-50); border:1px solid var(--gray-200); border-radius:10px; padding:9px 14px;
  }
  .issued-code button {
    border:none; background:transparent; color: var(--navy-900); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .withdrawn-toggle { display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--muted); font-weight:700; margin-left:auto; cursor:pointer; }
  tr.withdrawn-row { opacity:0.5; }
  button.withdraw-btn {
    padding:6px 10px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; color:#C0392B;
    font-size:12px; font-weight:700; cursor:pointer;
  }
  button.withdraw-btn.is-restore { color: var(--navy-900); }
  button.withdraw-btn:hover { background: var(--gray-50); }
  button.edit-btn {
    padding:6px 10px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; color: var(--ink);
    font-size:12px; font-weight:700; cursor:pointer; margin-right:6px;
  }
  button.edit-btn:hover { background: var(--gray-50); }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(7,12,22,0.55); z-index:50;
    align-items:flex-start; justify-content:center; padding: 40px 16px; overflow-y:auto;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:#fff; border-radius:16px; padding:26px 24px; width:100%; max-width:440px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .modal-box h2 { font-size:17px; font-weight:900; margin:0 0 18px; }
  .modal-box .field { margin-bottom:13px; }
  .modal-box label { display:block; font-size:12px; font-weight:700; color: var(--muted); margin-bottom:5px; }
  .modal-box input[type="text"], .modal-box input[type="email"], .modal-box input[type="tel"], .modal-box select {
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--gray-200);
    font-size:13.5px; font-family:inherit; color: var(--ink); background:#fff;
  }
  .modal-box .consent-row { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  .modal-box .btn-row { display:flex; gap:8px; margin-top:20px; }
  .modal-box .btn-row button {
    flex:1; padding:11px; border-radius:10px; border:none; font-weight:800; font-size:14px; cursor:pointer;
  }
  .modal-box .save-btn { background: var(--navy-900); color:#fff; }
  .modal-box .save-btn:hover { background:#000; }
  .modal-box .cancel-btn { background: var(--gray-50); color: var(--ink); border:1px solid var(--gray-200) !important; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">학생 목록</span>
</header>

<main>
  <h1>학생 목록</h1>
  <p class="sub">학년별로 학생을 확인하고, 강의실이 잘못 지정된 경우 바로 고칠 수 있습니다.</p>

  <div class="issue-panel">
    <span class="label">신규 학생코드 발급</span>
    <select class="level-select" id="level-select">
      <option value="초">초등</option>
      <option value="중">중등</option>
      <option value="고">고등</option>
    </select>
    <button type="button" class="issue-btn" id="issue-btn">코드 받기</button>
    <span id="issued-area"></span>
  </div>

  <div class="toolbar">
    <label for="grade-filter">학년</label>
    <select class="grade-filter" id="grade-filter">
      <option value="">전체</option>
      <option value="초1">초1</option>
      <option value="초2">초2</option>
      <option value="초3">초3</option>
      <option value="초4">초4</option>
      <option value="초5">초5</option>
      <option value="초6">초6</option>
      <option value="중1">중1</option>
      <option value="중2">중2</option>
      <option value="중3">중3</option>
      <option value="고1">고1</option>
      <option value="고2">고2</option>
      <option value="고3">고3</option>
      <option value="졸업">졸업</option>
      <option value="미지정">미지정</option>
    </select>
    <label for="signup-filter">가입</label>
    <select class="grade-filter" id="signup-filter">
      <option value="">전체</option>
      <option value="noreg">등록서 미제출</option>
      <option value="nologin">카카오 로그인 기록 없음</option>
    </select>
    <span class="count-badge" id="count-badge"></span>
    <label class="withdrawn-toggle"><input type="checkbox" id="withdrawn-toggle"> 퇴원생도 보기</label>
  </div>

  <div class="panel">
    <table id="student-table" style="display:none;">
      <thead>
        <tr><th>강의실</th><th>이름</th><th>학생코드</th><th>학년</th><th>첫 등원일</th><th>가입</th><th></th></tr>
      </thead>
      <tbody id="student-tbody"></tbody>
    </table>
    <div class="loading" id="status-area">불러오는 중...</div>
  </div>
</main>

<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <h2>학생 정보 수정 — <span id="edit-modal-code"></span></h2>
    <input type="hidden" id="edit-student-code">
    <div class="field"><label>이름</label><input type="text" id="edit-name"></div>
    <div class="field"><label>학년</label>
      <select id="edit-grade">
        <option value="">선택 안 함</option>
        <option value="초1">초1</option><option value="초2">초2</option><option value="초3">초3</option>
        <option value="초4">초4</option><option value="초5">초5</option><option value="초6">초6</option>
        <option value="중1">중1</option><option value="중2">중2</option><option value="중3">중3</option>
        <option value="고1">고1</option><option value="고2">고2</option><option value="고3">고3</option>
        <option value="졸업">졸업</option>
      </select>
    </div>
    <div class="field"><label>학교</label><input type="text" id="edit-school"></div>
    <div class="field"><label>학생 연락처</label><input type="tel" id="edit-student-phone"></div>
    <div class="field"><label>부모 연락처</label><input type="tel" id="edit-parent-phone"></div>
    <div class="field"><label>출석용 학부모 전화번호 (출석체크 키오스크 조회용 · 가입 여부와 무관)</label><input type="tel" id="edit-attendance-phone" placeholder="예: 010-1234-5678"></div>
    <div class="field"><label>추가 번호 (선택 · 엄마/아빠 두 분 다 쓸 때)</label><input type="tel" id="edit-attendance-phone2" placeholder="예: 010-9876-5432"></div>
    <div class="field"><label>부모 이메일 (카카오 로그인용)</label><input type="email" id="edit-parent-email"></div>
    <div class="field"><label>학생 생년월일 (예: 20150321)</label><input type="text" id="edit-birth-date"></div>
    <div class="field"><label>주소</label><input type="text" id="edit-address"></div>
    <div class="field consent-row"><input type="checkbox" id="edit-privacy-consent"> <label style="margin:0;" for="edit-privacy-consent">개인정보보호 동의</label></div>
    <div class="btn-row">
      <button type="button" class="cancel-btn" id="edit-cancel-btn">취소</button>
      <button type="button" class="save-btn" id="edit-save-btn">저장</button>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  requireDirector();

  const TEACHER_CLASSROOMS = CLASSROOMS.filter((c) => c !== DIRECTOR_LABEL);
  let allStudents = [];
  let attendancePhones = {};      // student_code -> { p1: 기본 번호, p2: 추가 번호 } (숫자만)
  let attendancePhoneReady = false; // 출석용 번호 기능(SQL)이 DB에 있는지

  loadStudents();

  document.getElementById('grade-filter').addEventListener('change', render);
  document.getElementById('signup-filter').addEventListener('change', render);
  document.getElementById('withdrawn-toggle').addEventListener('change', loadStudents);

  document.getElementById('issue-btn').addEventListener('click', async () => {
    const btn = document.getElementById('issue-btn');
    const issuedArea = document.getElementById('issued-area');
    const level = document.getElementById('level-select').value;
    btn.disabled = true;
    btn.textContent = '발급 중...';
    const { data, error } = await sb.rpc('rpc_admin_issue_student_code', {
      p_password: getAdminPassword(),
      p_level: level,
    });
    btn.disabled = false;
    btn.textContent = '코드 받기';
    if (error) {
      alert('코드 발급 실패: ' + error.message);
      return;
    }
    issuedArea.innerHTML = `
      <span class="issued-code">
        ${data}
        <button type="button" id="copy-code-btn">복사</button>
      </span>
    `;
    document.getElementById('copy-code-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(data);
    });
    loadStudents();
  });

  async function loadStudents() {
    const statusArea = document.getElementById('status-area');
    const includeWithdrawn = document.getElementById('withdrawn-toggle').checked;
    const { data, error } = await sb.rpc('rpc_admin_list_all_students', {
      p_password: getAdminPassword(),
      p_include_withdrawn: includeWithdrawn,
    });
    if (error) {
      statusArea.textContent = '학생 목록을 불러오지 못했습니다: ' + error.message;
      return;
    }
    allStudents = data || [];

    // 홈페이지 가입 현황 (등록서 제출 / 카카오 로그인)
    const sRes = await sb.rpc('rpc_admin_list_signup_status', { p_password: getAdminPassword() });
    signupMap = {};
    signupReady = !sRes.error;
    if (!sRes.error) (sRes.data || []).forEach((r) => { signupMap[r.student_code] = r; });
    render();

    // 출석용 전화번호도 함께 불러옴 (수정창에서 사용)
    const phoneRes = await sb.rpc('rpc_admin_list_attendance_phones', { p_password: getAdminPassword() });
    attendancePhones = {};
    attendancePhoneReady = !phoneRes.error;
    if (!phoneRes.error) (phoneRes.data || []).forEach((r) => { attendancePhones[r.student_code] = { p1: r.attendance_phone || '', p2: r.attendance_phone2 || '' }; });
  }

  let signupMap = {};
  let signupReady = false;
  function fmtShort(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }
  function signupCell(code) {
    if (!signupReady) return '<span style="color:#B0B6C3;" title="가입 현황 SQL(47)을 실행하면 표시돼요">-</span>';
    const r = signupMap[code] || {};
    const reg = r.registered
      ? `<span class="sg ok" title="등록서 제출 ${r.registered_at ? fmtShort(r.registered_at) : ''}">등록서 ✓</span>`
      : '<span class="sg no">등록서 ✗</span>';
    const login = r.last_login_at
      ? `<span class="sg ok" title="마지막 로그인 ${fmtShort(r.last_login_at)}">로그인 ✓</span>`
      : '<span class="sg no">로그인 ✗</span>';
    return reg + ' ' + login;
  }

  function render() {
    const grade = document.getElementById('grade-filter').value;
    const sf = document.getElementById('signup-filter').value;
    const byGrade = (
      grade === '미지정' ? allStudents.filter((s) => !s.grade) :
      grade ? allStudents.filter((s) => s.grade === grade) :
      allStudents.slice()
    );
    const filtered = (
      !signupReady || !sf ? byGrade :
      sf === 'noreg' ? byGrade.filter((s) => !(signupMap[s.student_code] || {}).registered) :
      byGrade.filter((s) => !(signupMap[s.student_code] || {}).last_login_at)
    )
      .sort((a, b) => {
        const ca = a.classroom || '￿'; // 미지정은 맨 뒤로
        const cb = b.classroom || '￿';
        if (ca !== cb) return ca.localeCompare(cb, 'ko');
        return (a.student_name || '').localeCompare(b.student_name || '', 'ko');
      });

    const table = document.getElementById('student-table');
    const tbody = document.getElementById('student-tbody');
    const statusArea = document.getElementById('status-area');
    document.getElementById('count-badge').textContent = filtered.length ? `${filtered.length}명` : '';

    if (filtered.length === 0) {
      table.style.display = 'none';
      statusArea.style.display = 'block';
      statusArea.textContent = '해당하는 학생이 없습니다.';
      return;
    }

    table.style.display = 'table';
    statusArea.style.display = 'none';

    tbody.innerHTML = filtered.map((s) => `
      <tr class="${s.withdrawn ? 'withdrawn-row' : ''}">
        <td>
          <select class="classroom-select" data-code="${s.student_code}" data-name="${s.student_name || ''}" ${s.withdrawn ? 'disabled' : ''}>
            <option value="">미지정</option>
            ${TEACHER_CLASSROOMS.map((c) => `<option value="${c}" ${s.classroom === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </td>
        <td class="name">${s.student_name || ''}</td>
        <td class="code">${s.student_code || ''}</td>
        <td>${s.grade || '-'}</td>
        <td>
          <input type="date" class="attend-date" data-code="${s.student_code}" value="${s.first_attend_date || ''}" ${s.withdrawn ? 'disabled' : ''}>
        </td>
        <td style="white-space:nowrap;">${signupCell(s.student_code)}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="edit-btn" data-code="${s.student_code}">수정</button>
          <button type="button" class="withdraw-btn ${s.withdrawn ? 'is-restore' : ''}" data-code="${s.student_code}" data-withdrawn="${s.withdrawn ? 'true' : 'false'}">
            ${s.withdrawn ? '복귀' : '퇴원'}
          </button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.attend-date').forEach((inp) => {
      inp.addEventListener('change', async () => {
        inp.classList.add('saving');
        inp.disabled = true;
        const { error } = await sb.rpc('rpc_admin_set_first_attend_date', {
          p_password: getAdminPassword(),
          p_student_code: inp.dataset.code,
          p_date: inp.value || null,
        });
        inp.disabled = false;
        inp.classList.remove('saving');
        if (error) {
          alert('첫 등원일 저장 실패: ' + error.message);
          return;
        }
        const target = allStudents.find((s) => s.student_code === inp.dataset.code);
        if (target) target.first_attend_date = inp.value || null;
      });
    });

    tbody.querySelectorAll('.withdraw-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const code = btn.dataset.code;
        const willWithdraw = btn.dataset.withdrawn !== 'true';
        if (willWithdraw && !confirm(`${code} 학생을 퇴원 처리할까요? (기록은 남고, 목록에서만 숨겨져요)`)) return;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_set_student_withdrawn', {
          p_password: getAdminPassword(),
          p_student_code: code,
          p_withdrawn: willWithdraw,
        });
        btn.disabled = false;
        if (error) {
          alert('처리 실패: ' + error.message);
          return;
        }
        loadStudents();
      });
    });

    tbody.querySelectorAll('.edit-btn').forEach((btn) => {
      btn.addEventListener('click', () => openEditModal(btn.dataset.code));
    });

    tbody.querySelectorAll('.classroom-select').forEach((sel) => {
      sel.addEventListener('change', async () => {
        sel.classList.add('saving');
        sel.disabled = true;
        const { error } = await sb.rpc('rpc_admin_update_student_classroom', {
          p_password: getAdminPassword(),
          p_student_code: sel.dataset.code,
          p_student_name: sel.dataset.name,
          p_classroom: sel.value || null,
        });
        sel.disabled = false;
        sel.classList.remove('saving');
        if (error) {
          alert('강의실 수정 실패: ' + error.message);
          return;
        }
        const target = allStudents.find((s) => s.student_code === sel.dataset.code);
        if (target) target.classroom = sel.value || null;
      });
    });
  }

  // ---- 학생 정보 수정 모달 ----
  const editModal = document.getElementById('edit-modal');

  async function openEditModal(code) {
    document.getElementById('edit-modal-code').textContent = code;
    document.getElementById('edit-student-code').value = code;

    // 학생 목록에 이미 있는 값으로 우선 채워두고(이름/학년), 나머지는 비워둔 채 열기
    const listed = allStudents.find((s) => s.student_code === code) || {};
    document.getElementById('edit-name').value = listed.student_name || '';
    document.getElementById('edit-grade').value = listed.grade || '';
    ['edit-school', 'edit-student-phone', 'edit-parent-phone', 'edit-parent-email', 'edit-birth-date', 'edit-address'].forEach((id) => {
      document.getElementById(id).value = '';
    });
    document.getElementById('edit-privacy-consent').checked = false;
    const phoneInput = document.getElementById('edit-attendance-phone');
    const phoneInput2 = document.getElementById('edit-attendance-phone2');
    const curPhones = attendancePhones[code] || { p1: '', p2: '' };
    phoneInput.value = formatPhone(curPhones.p1);
    phoneInput2.value = formatPhone(curPhones.p2);
    phoneInput.disabled = phoneInput2.disabled = !attendancePhoneReady;
    phoneInput.placeholder = attendancePhoneReady ? '예: 010-1234-5678' : '출석용 전화번호 SQL을 실행한 뒤 사용할 수 있어요';
    phoneInput2.placeholder = attendancePhoneReady ? '예: 010-9876-5432' : '';
    editModal.classList.add('open');

    const { data, error } = await sb.rpc('rpc_admin_get_student_detail', {
      p_password: getAdminPassword(),
      p_student_code: code,
    });
    if (error) {
      alert('학생 정보를 불러오지 못했습니다: ' + error.message);
      return;
    }
    const detail = (data && data[0]) || {};
    // students 테이블에 값이 있으면 그걸로 덮어쓰고, 없으면(= 아직 등록 전) 목록에서 가져온 값 유지
    document.getElementById('edit-name').value = detail.student_name || listed.student_name || '';
    document.getElementById('edit-grade').value = detail.grade || listed.grade || '';
    document.getElementById('edit-school').value = detail.school || '';
    document.getElementById('edit-student-phone').value = detail.student_phone || '';
    document.getElementById('edit-parent-phone').value = detail.parent_phone || '';
    document.getElementById('edit-parent-email').value = detail.parent_email || '';
    document.getElementById('edit-birth-date').value = detail.birth_date || '';
    document.getElementById('edit-address').value = detail.address || '';
    document.getElementById('edit-privacy-consent').checked = !!detail.privacy_consent;
  }

  function formatPhone(d) {
    d = String(d || '');
    if (d.length === 11) return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
    return d;
  }

  function closeEditModal() {
    editModal.classList.remove('open');
  }

  document.getElementById('edit-cancel-btn').addEventListener('click', closeEditModal);
  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });

  document.getElementById('edit-save-btn').addEventListener('click', async () => {
    const saveBtn = document.getElementById('edit-save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중...';

    const code = document.getElementById('edit-student-code').value;

    // 출석용 전화번호는 휴대폰 형식만 허용 (저장 전에 미리 확인)
    const MOBILE_RE = /^01[016789]\d{7,8}$/;
    const chk1 = document.getElementById('edit-attendance-phone').value.replace(/\D/g, '').replace(/^82/, '0');
    const chk2 = document.getElementById('edit-attendance-phone2').value.replace(/\D/g, '').replace(/^82/, '0');
    if ((chk1 && !MOBILE_RE.test(chk1)) || (chk2 && !MOBILE_RE.test(chk2))) {
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
      alert('출석용 전화번호는 휴대폰 번호로 입력해 주세요 (예: 010-1234-5678)');
      return;
    }
    const { error } = await sb.rpc('rpc_admin_update_student_detail', {
      p_password: getAdminPassword(),
      p_student_code: code,
      p_student_name: document.getElementById('edit-name').value || null,
      p_grade: document.getElementById('edit-grade').value || null,
      p_school: document.getElementById('edit-school').value || null,
      p_student_phone: document.getElementById('edit-student-phone').value || null,
      p_parent_phone: document.getElementById('edit-parent-phone').value || null,
      p_parent_email: document.getElementById('edit-parent-email').value || null,
      p_birth_date: document.getElementById('edit-birth-date').value || null,
      p_address: document.getElementById('edit-address').value || null,
      p_privacy_consent: document.getElementById('edit-privacy-consent').checked,
    });

    if (error) {
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
      alert('저장 실패: ' + error.message);
      return;
    }

    // 출석용 전화번호: 값이 바뀐 경우에만 저장 (숫자만 비교)
    const phoneInput = document.getElementById('edit-attendance-phone');
    const phoneInput2 = document.getElementById('edit-attendance-phone2');
    const new1 = phoneInput.value.replace(/\D/g, '');
    const new2 = phoneInput2.value.replace(/\D/g, '');
    const cur = attendancePhones[code] || { p1: '', p2: '' };
    let phoneError = null;
    if (!phoneInput.disabled && (new1 !== (cur.p1 || '') || new2 !== (cur.p2 || ''))) {
      const phoneRes = await sb.rpc('rpc_admin_set_attendance_phone', {
        p_password: getAdminPassword(),
        p_student_code: code,
        p_phone: new1,
        p_phone2: new2,
      });
      phoneError = phoneRes.error;
      if (phoneError && (phoneError.code === 'PGRST202' || /Could not find the function/i.test(phoneError.message || ''))) {
        phoneError = { message: '번호 2개 기능 SQL(43)이 DB에 아직 없어요. 안내드린 SQL을 먼저 실행해 주세요.' };
      }
    }

    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
    if (phoneError) {
      alert('학생 정보는 저장됐지만 출석용 전화번호는 저장하지 못했어요: ' + phoneError.message);
      loadStudents();
      return;
    }
    closeEditModal();
    loadStudents();
  });
</script>

</body>
