<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 가능 시간 설정 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; display:flex; flex-direction:column; gap:18px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 4px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:22px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input {
    width:100%; font-size:14.5px; padding:11px 13px; border-radius:10px; border:1px solid var(--gray-200);
    margin-bottom:0; font-family:inherit; background:#fff;
  }
  select:focus, input:focus { outline:none; border-color: var(--navy-900); }
  .row-add { display:grid; grid-template-columns: 1.3fr 1fr auto; gap:8px; align-items:end; }
  .row-add label { margin-bottom:4px; }
  .time-select-row { display:flex; gap:6px; }
  .time-select-row select { flex:1; min-width:0; }
  button.add-btn {
    padding:11px 16px; border-radius:10px; border:none; background:var(--navy-900); color:#fff;
    font-weight:800; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  button.add-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .slot-list { margin-top:18px; }
  .slot-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px; border-top:1px solid var(--gray-200); font-size:14px; }
  .slot-row:first-child { border-top:none; }
  .slot-row .info { font-weight:700; }
  .slot-row .actions { display:flex; align-items:center; gap:10px; }
  .slot-row .actions button { background:none; border:none; cursor:pointer; color:var(--muted); font-size:12px; padding:4px; }
  .slot-row .del-btn:hover { color:#DC2626; }
  .slot-row .edit-btn:hover { color:var(--navy-900); }
  .slot-edit-row { padding:12px 2px; border-top:1px solid var(--gray-200); display:grid; grid-template-columns: 1.3fr 1fr; gap:8px; align-items:end; }
  .slot-edit-row:first-child { border-top:none; }
  .slot-edit-row label { margin-bottom:4px; font-size:11px; }
  .slot-edit-row select, .slot-edit-row input { padding:8px 10px; font-size:13px; }
  .slot-edit-actions { grid-column: 1 / -1; display:flex; gap:8px; margin-top:4px; }
  .slot-edit-actions button { flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .slot-edit-actions .save-btn { border:none; background:var(--navy-900); color:#fff; }
  .slot-edit-actions .cancel-btn { border:1px solid var(--gray-200); background:#fff; color:var(--ink); }
  .empty, .loading { color: var(--muted); font-size:13px; padding:16px 4px; text-align:center; }
  @media (max-width: 480px) {
    .row-add { grid-template-columns: 1fr 1fr; }
    .row-add .add-btn { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="consultations.html"><i class="fa-solid fa-arrow-left"></i> 상담 관리</a>
  <span class="brand">상담 가능 시간 설정</span>
</header>

<main>
  <h1>상담 가능한 날짜·시간</h1>
  <p class="sub">가능한 날짜와 시간을 직접 추가해주세요. 학부모님이 목록에서 하나를 고르면 그 시간은 바로 목록에서 사라져요(중복 예약 방지). 필요 없어지면 언제든 수정하거나 삭제하세요.</p>

  <div class="panel">
    <div class="row-add">
      <div>
        <label for="add-date">날짜</label>
        <input type="date" id="add-date">
      </div>
      <div>
        <label for="add-hour">시간</label>
        <div class="time-select-row">
          <select id="add-hour"></select>
          <select id="add-minute"><option value="00">00</option><option value="30">30</option></select>
        </div>
      </div>
      <button type="button" class="add-btn" id="add-slot-btn">추가</button>
    </div>

    <div class="slot-list" id="slot-list"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js?v=20261009a"></script>
<script>
  requireDirector();

  const DOW_LABEL = ['일', '월', '화', '수', '목', '금', '토'];

  const addDateInput = document.getElementById('add-date');
  const addHourSelect = document.getElementById('add-hour');
  const addMinuteSelect = document.getElementById('add-minute');
  const addSlotBtn = document.getElementById('add-slot-btn');
  const slotListEl = document.getElementById('slot-list');

  function hourOptions(selectedHour) {
    let html = '';
    for (let h = 9; h <= 22; h++) {
      const hh = String(h).padStart(2, '0');
      html += `<option value="${hh}" ${hh === selectedHour ? 'selected' : ''}>${hh}시</option>`;
    }
    return html;
  }
  addHourSelect.innerHTML = hourOptions('09');

  function dateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW_LABEL[d.getDay()]})`;
  }
  function timeLabel(t) {
    return (t || '').slice(0, 5);
  }

  let currentSlots = [];
  let editingSlotId = null;

  async function loadSlots() {
    slotListEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await sb.rpc('rpc_admin_list_open_consultation_slots', {
      p_password: getAdminPassword(),
    });
    if (error) {
      slotListEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>';
      return;
    }
    currentSlots = data || [];
    renderSlots();
  }
  loadSlots();

  function renderSlots() {
    if (currentSlots.length === 0) {
      slotListEl.innerHTML = '<div class="empty">아직 추가된 상담 가능 시간이 없습니다. 위에서 추가해주세요.</div>';
      return;
    }

    slotListEl.innerHTML = currentSlots.map((s) => {
      if (s.id === editingSlotId) {
        return `
          <div class="slot-edit-row">
            <div>
              <label>날짜</label>
              <input type="date" class="e-date" data-id="${s.id}" value="${s.slot_date}">
            </div>
            <div>
              <label>시간</label>
              <div class="time-select-row">
                <select class="e-hour" data-id="${s.id}">${hourOptions(s.slot_time.slice(0, 2))}</select>
                <select class="e-minute" data-id="${s.id}">
                  <option value="00" ${s.slot_time.slice(3, 5) === '00' ? 'selected' : ''}>00</option>
                  <option value="30" ${s.slot_time.slice(3, 5) === '30' ? 'selected' : ''}>30</option>
                </select>
              </div>
            </div>
            <div class="slot-edit-actions">
              <button type="button" class="save-btn" data-id="${s.id}">저장</button>
              <button type="button" class="cancel-btn">취소</button>
            </div>
          </div>
        `;
      }
      return `
      <div class="slot-row">
        <div class="info">${dateLabel(s.slot_date)} ${timeLabel(s.slot_time)}</div>
        <div class="actions">
          <button type="button" class="edit-btn" data-id="${s.id}"><i class="fa-solid fa-pen"></i></button>
          <button type="button" class="del-btn" data-id="${s.id}"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `;
    }).join('');

    slotListEl.querySelectorAll('.edit-btn').forEach((btn) => {
      btn.addEventListener('click', () => { editingSlotId = btn.dataset.id; renderSlots(); });
    });
    slotListEl.querySelectorAll('.cancel-btn').forEach((btn) => {
      btn.addEventListener('click', () => { editingSlotId = null; renderSlots(); });
    });
    slotListEl.querySelectorAll('.save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const date = slotListEl.querySelector(`.e-date[data-id="${id}"]`).value;
        const hour = slotListEl.querySelector(`.e-hour[data-id="${id}"]`).value;
        const minute = slotListEl.querySelector(`.e-minute[data-id="${id}"]`).value;
        const time = `${hour}:${minute}`;
        if (!date) { alert('날짜를 입력해주세요.'); return; }
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_update_open_consultation_slot', {
          p_password: getAdminPassword(), p_id: id, p_slot_date: date, p_slot_time: time,
        });
        btn.disabled = false;
        if (error) { alert('수정 실패: ' + error.message); return; }
        editingSlotId = null;
        loadSlots();
      });
    });
    slotListEl.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 시간을 삭제할까요?')) return;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_delete_open_consultation_slot', {
          p_password: getAdminPassword(), p_id: btn.dataset.id,
        });
        btn.disabled = false;
        if (error) { alert('삭제 실패: ' + error.message); return; }
        loadSlots();
      });
    });
  }

  addSlotBtn.addEventListener('click', async () => {
    const date = addDateInput.value;
    const time = `${addHourSelect.value}:${addMinuteSelect.value}`;
    if (!date) { alert('날짜를 입력해주세요.'); return; }

    addSlotBtn.disabled = true;
    addSlotBtn.textContent = '저장 중...';

    const { error } = await sb.rpc('rpc_admin_add_open_consultation_slot', {
      p_password: getAdminPassword(),
      p_slot_date: date,
      p_slot_time: time,
    });

    addSlotBtn.disabled = false;
    addSlotBtn.textContent = '추가';

    if (error) { alert('저장 실패: ' + error.message); return; }
    loadSlots();
  });
</script>

</body>
</html>
