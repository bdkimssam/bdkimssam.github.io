<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제인증 확인 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 18px; }
  .date-bar { display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .date-bar button { appearance:none; border:1px solid var(--gray-200); background:#fff; border-radius:10px; height:38px; min-width:38px; padding:0 12px; cursor:pointer; color:var(--ink); font-size:13px; font-weight:700; font-family:inherit; }
  .date-bar button:hover:not(:disabled) { background:var(--gray-50); }
  .date-bar button:disabled { opacity:0.4; cursor:not-allowed; }
  .date-bar button.active { background:var(--navy-900); border-color:var(--navy-900); color:#fff; }
  .date-bar input[type="date"] { height:38px; font-size:13.5px; font-weight:700; padding:0 10px; border-radius:10px; border:1px solid var(--gray-200); font-family:inherit; }
  .search-row { margin-bottom:14px; }
  .search-row input { width:100%; font-size:13.5px; padding:9px 12px; border-radius:10px; border:1px solid var(--gray-200); font-family:inherit; }
  .notice { background:#FFF7E6; border:1px solid #FFD591; color:#8A5A00; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.5; }
  .list-summary { font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:12px; }
  .pager { display:flex; align-items:center; justify-content:center; gap:12px; margin:16px 0; }
  .pager button { appearance:none; border:1px solid var(--gray-200); background:#fff; border-radius:10px; height:38px; padding:0 16px; cursor:pointer; font-weight:800; font-size:13px; font-family:inherit; color:var(--ink); }
  .pager button:disabled { opacity:0.4; cursor:not-allowed; }
  .pager .pg { font-size:13px; font-weight:800; }
  .filter-tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-tabs button {
    border:1px solid var(--gray-200); background:#fff; border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .filter-tabs button.active { background: var(--navy-900); color:#fff; border-color: var(--navy-900); }
  .item { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  .item .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
  .item .name { font-weight:800; font-size:14.5px; }
  .item .meta { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .item .book { font-size:12.5px; color:var(--ink); margin-top:6px; }
  .item .book b { font-weight:700; }
  .status-badge { font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .status-badge.pending { background:#FFF3E0; color:#B5651D; }
  .status-badge.approved { background:#E8F5E9; color:#2E7D32; }
  .status-badge.redo { background:#FDE8E8; color:#C0392B; }
  .photo-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin:12px 0; }
  .photo-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--gray-50); cursor:pointer; }
  .review-row { display:flex; gap:6px; margin-top:10px; }
  .review-row button { flex:1; border:1px solid var(--gray-200); border-radius:10px; padding:9px; font-size:12.5px; font-weight:800; cursor:pointer; background:#fff; color:var(--ink); }
  .review-row button.approve-btn.active { background:#E8F5E9; color:#2E7D32; border-color:#C8E6C9; }
  .review-row button.redo-btn.active { background:#FDE8E8; color:#C0392B; border-color:#F5C6C6; }
  .feedback-row { display:flex; gap:6px; margin-top:8px; }
  .feedback-row input { flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--gray-200); font-size:12.5px; font-family:inherit; }
  .feedback-row button {
    padding:9px 14px; border-radius:9px; border:1px solid var(--gray-200); background:#fff; color:var(--ink);
    font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .feedback-row button:hover { background:var(--gray-50); }
  .loading { color: var(--muted); font-size: 13px; }
  .lightbox-overlay { display:none; position:fixed; inset:0; background:rgba(7,12,22,0.85); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .lightbox-overlay.open { display:flex; }
  .lightbox-overlay img { max-width:100%; max-height:100%; border-radius:12px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">숙제인증 확인</span>
</header>

<main>
  <h1>숙제인증 제출 확인</h1>
  <div class="date-bar">
    <button type="button" id="date-prev" title="전날"><i class="fa-solid fa-chevron-left"></i></button>
    <input type="date" id="date-input">
    <button type="button" id="date-next" title="다음날"><i class="fa-solid fa-chevron-right"></i></button>
    <button type="button" id="date-today">오늘</button>
    <button type="button" id="date-all">전체 날짜</button>
  </div>
  <div class="search-row"><input type="text" id="search-box" placeholder="학생 이름으로 찾기"></div>
  <div id="notice"></div>
  <div class="filter-tabs">
    <button type="button" class="active" data-filter="all">전체</button>
    <button type="button" data-filter="pending">대기중</button>
    <button type="button" data-filter="approved">확인완료</button>
    <button type="button" data-filter="redo">미흡</button>
  </div>
  <div class="list-summary" id="list-summary"></div>
  <div id="list"><div class="loading">불러오는 중...</div></div>
  <div class="pager" id="pager"></div>
</main>

<div class="lightbox-overlay" id="lightbox">
  <img id="lightbox-img" src="" alt="숙제 사진 크게보기">
</div>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  let allItems = [];      // 지금 화면에 보이는 (한 페이지) 목록
  let currentFilter = 'all';
  const PAGE_SIZE = 10;
  let page = 0;           // 0부터 시작
  let total = 0;          // 조건에 맞는 전체 건수
  let dateStr = '';       // 'YYYY-MM-DD' (한국 날짜), 빈 값이면 전체 날짜
  let searchText = '';
  let pagingReady = true; // 페이지 나누기 SQL(49)이 DB에 있는지
  let loadSeq = 0;        // 늦게 도착한 응답이 최신 화면을 덮어쓰지 않게
  const STATUS_LABEL = { pending: '대기중', approved: '확인완료', redo: '미흡' };

  function seoulToday() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
  }
  function shiftDate(ymd, n) {
    const [y, m, d] = ymd.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  function seoulDateOf(iso) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date(iso));
  }
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 한 페이지 분량을 가져옴 → { items, total }
  async function fetchPage() {
    if (pagingReady) {
      const { data, error } = await sb.rpc('rpc_admin_list_homework_page', {
        p_password: getAdminPassword(),
        p_status: currentFilter,
        p_search: searchText,
        p_date: dateStr || null,
        p_limit: PAGE_SIZE,
        p_offset: page * PAGE_SIZE,
      });
      if (!error) {
        const rows = data || [];
        return { items: rows, total: rows.length ? Number(rows[0].total_count) : 0 };
      }
      if (!(error.code === 'PGRST202' || /Could not find the function/i.test(error.message || ''))) throw error;
      pagingReady = false; // SQL(49)이 아직 없음 → 예전 방식으로 대신 처리
    }
    // 예전 방식: 전부 받아서 화면에서 거름 (SQL 49를 실행하면 자동으로 새 방식 사용)
    const { data, error } = await sb.rpc('rpc_admin_list_homework_verifications', { p_password: getAdminPassword() });
    if (error) throw error;
    const q = searchText.trim();
    const filtered = (data || []).filter((it) =>
      (currentFilter === 'all' || it.review_status === currentFilter) &&
      (!q || (it.student_name || '').includes(q)) &&
      (!dateStr || (it.submitted_at && seoulDateOf(it.submitted_at) === dateStr)));
    return { items: filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE), total: filtered.length };
  }

  async function load() {
    const listEl = document.getElementById('list');
    const seq = ++loadSeq;
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const res = await fetchPage();
      if (seq !== loadSeq) return;
      // 마지막 쪽에서 항목이 줄어 빈 페이지가 되면 한 쪽 앞으로
      if (res.items.length === 0 && res.total > 0 && page > 0) {
        page = Math.max(0, Math.ceil(res.total / PAGE_SIZE) - 1);
        return load();
      }
      allItems = res.items;
      total = res.total;
    } catch (error) {
      if (seq !== loadSeq) return;
      console.error(error);
      listEl.innerHTML = '<div class="loading">목록을 불러오지 못했습니다.</div>';
      return;
    }
    document.getElementById('notice').innerHTML = pagingReady ? '' :
      '<div class="notice">페이지 나누기 SQL(49)을 실행하면 훨씬 빨라져요. 지금은 예전 방식으로 전체를 받아 화면에서 나누고 있어요.</div>';
    render();
  }

  function syncDateUi() {
    document.getElementById('date-input').value = dateStr;
    document.getElementById('date-all').classList.toggle('active', !dateStr);
    document.getElementById('date-today').classList.toggle('active', dateStr === seoulToday());
    document.getElementById('date-prev').disabled = !dateStr;
    document.getElementById('date-next').disabled = !dateStr;
  }

  function renderPager() {
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const el = document.getElementById('pager');
    if (total <= PAGE_SIZE) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <button type="button" id="pg-prev" ${page <= 0 ? 'disabled' : ''}>이전</button>
      <span class="pg">${page + 1} / ${pages}</span>
      <button type="button" id="pg-next" ${page >= pages - 1 ? 'disabled' : ''}>다음</button>`;
    document.getElementById('pg-prev').addEventListener('click', () => { page--; load(); window.scrollTo(0, 0); });
    document.getElementById('pg-next').addEventListener('click', () => { page++; load(); window.scrollTo(0, 0); });
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    const listEl = document.getElementById('list');
    const items = allItems;
    syncDateUi();
    const dayLabel = dateStr ? dateStr.replace(/^\d+-0?(\d+)-0?(\d+)$/, '$1월 $2일') : '전체 날짜';
    document.getElementById('list-summary').textContent = `${dayLabel} · 총 ${total}건` + (total > PAGE_SIZE ? ` (${page * PAGE_SIZE + 1}~${page * PAGE_SIZE + items.length}번째)` : '');
    renderPager();

    if (items.length === 0) {
      listEl.innerHTML = '<div class="loading">해당하는 제출 내역이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = items.map((it) => `
      <div class="item">
        <div class="top">
          <div>
            <div class="name">${it.student_name || '이름 미상'} <span style="font-weight:600; color:var(--muted); font-size:12px;">(${it.grade || '-'})</span></div>
            <div class="meta">${it.student_code} · ${fmtDateTime(it.submitted_at)}</div>
            <div class="book"><b>${it.textbook_name || ''}</b> ${it.range_text || ''}</div>
          </div>
          <span class="status-badge ${it.review_status}">${STATUS_LABEL[it.review_status] || '대기중'}</span>
        </div>
        <div class="photo-grid">
          ${(it.image_urls || []).map((url) => `<img src="${esc(url)}" alt="숙제 사진" data-full="${esc(url)}" loading="lazy">`).join('')}
        </div>
        <div class="review-row">
          <button type="button" class="approve-btn ${it.review_status === 'approved' ? 'active' : ''}" data-id="${it.id}" data-status="approved">확인완료</button>
          <button type="button" class="redo-btn ${it.review_status === 'redo' ? 'active' : ''}" data-id="${it.id}" data-status="redo">미흡 (다시 해야함)</button>
        </div>
        <div class="feedback-row">
          <input type="text" class="feedback-input" data-id="${it.id}" placeholder="원장님 코멘트 (예: 오늘은 좀 덜했어요)" value="${(it.feedback || '').replace(/"/g, '&quot;')}">
          <button type="button" class="feedback-save-btn" data-id="${it.id}">저장</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('.photo-grid img').forEach((img) => {
      img.addEventListener('click', () => {
        document.getElementById('lightbox-img').src = img.dataset.full;
        document.getElementById('lightbox').classList.add('open');
      });
    });

    listEl.querySelectorAll('.review-row button').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const item = allItems.find((x) => x.id === btn.dataset.id);
        const nextStatus = item.review_status === btn.dataset.status ? 'pending' : btn.dataset.status;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_set_homework_review', {
          p_password: getAdminPassword(), p_verification_id: btn.dataset.id,
          p_status: nextStatus, p_feedback: item.feedback || '',
        });
        btn.disabled = false;
        if (error) { alert('처리 실패: ' + error.message); return; }
        item.review_status = nextStatus;
        if (currentFilter === 'all') render(); else load();
      });
    });

    listEl.querySelectorAll('.feedback-save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const input = listEl.querySelector(`.feedback-input[data-id="${btn.dataset.id}"]`);
        const item = allItems.find((x) => x.id === btn.dataset.id);
        btn.disabled = true;
        btn.textContent = '저장 중...';
        const { error } = await sb.rpc('rpc_admin_set_homework_review', {
          p_password: getAdminPassword(), p_verification_id: btn.dataset.id,
          p_status: item.review_status || 'pending', p_feedback: input.value.trim(),
        });
        btn.disabled = false;
        btn.textContent = '저장';
        if (error) { alert('저장 실패: ' + error.message); return; }
        item.feedback = input.value.trim();
      });
    });
  }

  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  document.querySelectorAll('.filter-tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tabs button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      page = 0;
      load();
    });
  });

  document.getElementById('date-input').addEventListener('change', (e) => { dateStr = e.target.value || ''; page = 0; load(); });
  document.getElementById('date-prev').addEventListener('click', () => { if (dateStr) { dateStr = shiftDate(dateStr, -1); page = 0; load(); } });
  document.getElementById('date-next').addEventListener('click', () => { if (dateStr) { dateStr = shiftDate(dateStr, 1); page = 0; load(); } });
  document.getElementById('date-today').addEventListener('click', () => { dateStr = seoulToday(); page = 0; load(); });
  document.getElementById('date-all').addEventListener('click', () => { dateStr = ''; page = 0; load(); });
  let searchTimer = null;
  document.getElementById('search-box').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchText = e.target.value; page = 0; load(); }, 300);
  });

  dateStr = seoulToday(); // 처음에는 오늘 제출분부터
  load();
</script>

</body>
</html>
