<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제인증 확인 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 18px; }
  .filter-tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-tabs button {
    border:1px solid var(--gray-200); background:#fff; border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .filter-tabs button.active { background: var(--navy-900); color:#fff; border-color: var(--navy-900); }
  .item { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  .item .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
  .item .name { font-weight:800; font-size:14.5px; }
  .item .meta { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .item .book { font-size:12.5px; color:var(--ink); margin-top:6px; }
  .item .book b { font-weight:700; }
  .status-badge { font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .status-badge.pending { background:#FFF3E0; color:#B5651D; }
  .status-badge.approved { background:#E8F5E9; color:#2E7D32; }
  .status-badge.redo { background:#FDE8E8; color:#C0392B; }
  .photo-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin:12px 0; }
  .photo-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--gray-50); cursor:pointer; }
  .review-row { display:flex; gap:6px; margin-top:10px; }
  .review-row button { flex:1; border:1px solid var(--gray-200); border-radius:10px; padding:9px; font-size:12.5px; font-weight:800; cursor:pointer; background:#fff; color:var(--ink); }
  .review-row button.approve-btn.active { background:#E8F5E9; color:#2E7D32; border-color:#C8E6C9; }
  .review-row button.redo-btn.active { background:#FDE8E8; color:#C0392B; border-color:#F5C6C6; }
  .feedback-row { display:flex; gap:6px; margin-top:8px; }
  .feedback-row input { flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--gray-200); font-size:12.5px; font-family:inherit; }
  .feedback-row button {
    padding:9px 14px; border-radius:9px; border:1px solid var(--gray-200); background:#fff; color:var(--ink);
    font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .feedback-row button:hover { background:var(--gray-50); }
  .loading { color: var(--muted); font-size: 13px; }
  .lightbox-overlay { display:none; position:fixed; inset:0; background:rgba(7,12,22,0.85); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .lightbox-overlay.open { display:flex; }
  .lightbox-overlay img { max-width:100%; max-height:100%; border-radius:12px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">숙제인증 확인</span>
</header>

<main>
  <h1>숙제인증 제출 확인</h1>
  <div class="filter-tabs">
    <button type="button" class="active" data-filter="all">전체</button>
    <button type="button" data-filter="pending">대기중</button>
    <button type="button" data-filter="approved">확인완료</button>
    <button type="button" data-filter="redo">미흡</button>
  </div>
  <div id="list"><div class="loading">불러오는 중...</div></div>
</main>

<div class="lightbox-overlay" id="lightbox">
  <img id="lightbox-img" src="" alt="숙제 사진 크게보기">
</div>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  let allItems = [];
  let currentFilter = 'all';
  const STATUS_LABEL = { pending: '대기중', approved: '확인완료', redo: '미흡' };

  async function load() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';

    const { data, error } = await sb.rpc('rpc_admin_list_homework_verifications', { p_password: getAdminPassword() });
    if (error) {
      console.error(error);
      listEl.innerHTML = '<div class="loading">목록을 불러오지 못했습니다.</div>';
      return;
    }
    allItems = data || [];
    render();
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    const listEl = document.getElementById('list');
    const items = allItems.filter((it) => currentFilter === 'all' || it.review_status === currentFilter);

    if (items.length === 0) {
      listEl.innerHTML = '<div class="loading">해당하는 제출 내역이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = items.map((it) => `
      <div class="item">
        <div class="top">
          <div>
            <div class="name">${it.student_name || '이름 미상'} <span style="font-weight:600; color:var(--muted); font-size:12px;">(${it.grade || '-'})</span></div>
            <div class="meta">${it.student_code} · ${fmtDateTime(it.submitted_at)}</div>
            <div class="book"><b>${it.textbook_name || ''}</b> ${it.range_text || ''}</div>
          </div>
          <span class="status-badge ${it.review_status}">${STATUS_LABEL[it.review_status] || '대기중'}</span>
        </div>
        <div class="photo-grid">
          ${(it.image_urls || []).map((url) => `<img src="${url}" alt="숙제 사진" data-full="${url}">`).join('')}
        </div>
        <div class="review-row">
          <button type="button" class="approve-btn ${it.review_status === 'approved' ? 'active' : ''}" data-id="${it.id}" data-status="approved">확인완료</button>
          <button type="button" class="redo-btn ${it.review_status === 'redo' ? 'active' : ''}" data-id="${it.id}" data-status="redo">미흡 (다시 해야함)</button>
        </div>
        <div class="feedback-row">
          <input type="text" class="feedback-input" data-id="${it.id}" placeholder="원장님 코멘트 (예: 오늘은 좀 덜했어요)" value="${(it.feedback || '').replace(/"/g, '&quot;')}">
          <button type="button" class="feedback-save-btn" data-id="${it.id}">저장</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('.photo-grid img').forEach((img) => {
      img.addEventListener('click', () => {
        document.getElementById('lightbox-img').src = img.dataset.full;
        document.getElementById('lightbox').classList.add('open');
      });
    });

    listEl.querySelectorAll('.review-row button').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const item = allItems.find((x) => x.id === btn.dataset.id);
        const nextStatus = item.review_status === btn.dataset.status ? 'pending' : btn.dataset.status;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_set_homework_review', {
          p_password: getAdminPassword(), p_verification_id: btn.dataset.id,
          p_status: nextStatus, p_feedback: item.feedback || '',
        });
        btn.disabled = false;
        if (error) { alert('처리 실패: ' + error.message); return; }
        item.review_status = nextStatus;
        render();
      });
    });

    listEl.querySelectorAll('.feedback-save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const input = listEl.querySelector(`.feedback-input[data-id="${btn.dataset.id}"]`);
        const item = allItems.find((x) => x.id === btn.dataset.id);
        btn.disabled = true;
        btn.textContent = '저장 중...';
        const { error } = await sb.rpc('rpc_admin_set_homework_review', {
          p_password: getAdminPassword(), p_verification_id: btn.dataset.id,
          p_status: item.review_status || 'pending', p_feedback: input.value.trim(),
        });
        btn.disabled = false;
        btn.textContent = '저장';
        if (error) { alert('저장 실패: ' + error.message); return; }
        item.feedback = input.value.trim();
      });
    });
  }

  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  document.querySelectorAll('.filter-tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tabs button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  load();
</script>

</body>
</html>
