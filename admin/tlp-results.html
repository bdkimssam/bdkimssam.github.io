<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLP 학습심리검사 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 20px; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:24px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom: 28px; }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input, textarea {
    width:100%; font-size:14.5px; padding:11px 13px; border-radius:10px; border:1px solid var(--gray-200);
    margin-bottom:16px; font-family:inherit; background:#fff;
  }
  textarea { resize: vertical; min-height: 90px; }
  select:focus, input:focus, textarea:focus { outline:none; border-color: var(--navy-900); }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.submit { width:100%; padding:12px; border-radius:10px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; }
  button.submit:hover { background:#000; }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-row { padding: 14px 0; border-top: 1px solid var(--gray-200); }
  .result-row:first-child { border-top:none; }
  .result-row .t { font-weight:800; font-size:14px; }
  .result-row .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .grade-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .grade-chips span { font-size:11px; font-weight:700; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:999px; padding:3px 9px; color:var(--ink); }
  .result-row .comment { font-size:12.5px; color:var(--muted); margin-top:8px; white-space:pre-line; }
  .loading { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">TLP 학습심리검사</span>
</header>

<main>
  <div class="panel">
    <h1>학습심리검사 결과 입력</h1>

    <div class="row2">
      <div>
        <label for="grade-select">학년</label>
        <select id="grade-select"><option value="">학년을 먼저 선택하세요</option></select>
      </div>
      <div>
        <label for="student-select">학생</label>
        <select id="student-select" disabled><option value="">학년 먼저 선택</option></select>
      </div>
    </div>

    <form id="tlp-form">
      <input type="hidden" id="selected-code">
      <input type="hidden" id="selected-name">

      <label for="test-date">검사일</label>
      <input type="date" id="test-date" required>

      <div class="row2">
        <div><label for="self-efficacy">자기효능감</label><select id="self-efficacy"></select></div>
        <div><label for="self-regulation">자기조절지수</label><select id="self-regulation"></select></div>
      </div>
      <div class="row2">
        <div><label for="learning-interest">학습흥미</label><select id="learning-interest"></select></div>
        <div><label for="learning-habit">학습습관</label><select id="learning-habit"></select></div>
      </div>
      <div class="row2">
        <div><label for="cognitive-strategy">인지학습전략</label><select id="cognitive-strategy"></select></div>
        <div><label for="test-anxiety">시험불안</label><select id="test-anxiety"></select></div>
      </div>
      <div class="row2">
        <div><label for="parent-child-comm">부모자녀 의사소통</label><select id="parent-child-comm"></select></div>
        <div><label for="hagwon-dependency">학원의존도</label><select id="hagwon-dependency"></select></div>
      </div>

      <label for="comment">원장님 코멘트</label>
      <textarea id="comment" placeholder="학부모님께 보여드릴 분석 코멘트를 입력하세요"></textarea>

      <button type="submit" class="submit" id="submit-btn" disabled>학생을 먼저 선택하세요</button>
    </form>
  </div>

  <div class="panel">
    <div style="font-size:14px; font-weight:800; margin-bottom:12px;">등록된 결과</div>
    <div id="tlp-list"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  const GRADE_OPTIONS = ['최상', '높음', '높은편', '보통', '낮은편', '낮음'];
  const gradeFields = ['self-efficacy', 'self-regulation', 'learning-interest', 'learning-habit', 'cognitive-strategy', 'test-anxiety', 'parent-child-comm', 'hagwon-dependency'];
  gradeFields.forEach((id) => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">선택</option>' + GRADE_OPTIONS.map((g) => `<option value="${g}">${g}</option>`).join('');
  });

  document.getElementById('test-date').valueAsDate = new Date();

  let allStudents = [];
  let studentsByGrade = {};
  const gradeSelect = document.getElementById('grade-select');
  const studentSelect = document.getElementById('student-select');
  const submitBtn = document.getElementById('submit-btn');

  async function loadStudents() {
    const { data, error } = await sb.rpc('rpc_admin_list_students', { p_password: getAdminPassword(), p_classroom: getAdminClassroom() });
    if (error) { console.error(error); return; }
    allStudents = data || [];
    studentsByGrade = {};
    allStudents.forEach((s) => {
      const g = s.grade || '학년 미지정';
      if (!studentsByGrade[g]) studentsByGrade[g] = [];
      studentsByGrade[g].push(s);
    });
    const grades = Object.keys(studentsByGrade).sort((a, b) => compareGrades(a === '학년 미지정' ? '' : a, b === '학년 미지정' ? '' : b));
    gradeSelect.innerHTML = '<option value="">학년 선택</option>' +
      grades.map((g) => `<option value="${g}">${g}</option>`).join('');
  }
  loadStudents();

  gradeSelect.addEventListener('change', () => {
    const g = gradeSelect.value;
    if (!g) {
      studentSelect.innerHTML = '<option value="">학년 먼저 선택</option>';
      studentSelect.disabled = true;
    } else {
      const students = (studentsByGrade[g] || []).slice().sort((a, b) => (a.student_name || '').localeCompare(b.student_name || '', 'ko'));
      studentSelect.innerHTML = '<option value="">학생 선택</option>' +
        students.map((s) => `<option value="${s.student_code}" data-name="${s.student_name}">${s.student_name} (${s.student_code})</option>`).join('');
      studentSelect.disabled = false;
    }
    document.getElementById('selected-code').value = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '학생을 먼저 선택하세요';
  });

  studentSelect.addEventListener('change', () => {
    const code = studentSelect.value;
    if (!code) {
      document.getElementById('selected-code').value = '';
      submitBtn.disabled = true;
      submitBtn.textContent = '학생을 먼저 선택하세요';
      return;
    }
    const opt = studentSelect.selectedOptions[0];
    document.getElementById('selected-code').value = code;
    document.getElementById('selected-name').value = opt.dataset.name;
    submitBtn.disabled = false;
    submitBtn.textContent = '결과 저장';
  });

  async function loadList() {
    const listEl = document.getElementById('tlp-list');
    const { data, error } = await sb.rpc('rpc_admin_list_tlp_results', { p_password: getAdminPassword() });
    if (error) { console.error(error); listEl.innerHTML = '<div class="loading">목록을 불러오지 못했습니다.</div>'; return; }
    if (!data || data.length === 0) { listEl.innerHTML = '<div class="loading">등록된 결과가 없습니다.</div>'; return; }

    const labelMap = {
      self_efficacy: '자기효능감', self_regulation: '자기조절지수', learning_interest: '학습흥미',
      learning_habit: '학습습관', cognitive_strategy: '인지학습전략', test_anxiety: '시험불안',
      parent_child_comm: '부모자녀 의사소통', hagwon_dependency: '학원의존도',
    };

    listEl.innerHTML = data.map((r) => {
      const chips = Object.keys(labelMap)
        .filter((k) => r[k])
        .map((k) => `<span>${labelMap[k]} ${r[k]}</span>`)
        .join('');
      return `
        <div class="result-row">
          <div class="t">${r.student_name || ''}</div>
          <div class="meta">${r.student_code} · ${r.test_date || ''}</div>
          <div class="grade-chips">${chips}</div>
          ${r.comment ? `<div class="comment">${r.comment}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  document.getElementById('tlp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('selected-code').value;
    if (!code) { alert('학생을 먼저 검색해서 선택해 주세요.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    const { error } = await sb.rpc('rpc_admin_add_tlp_result', {
      p_password: getAdminPassword(),
      p_student_code: code,
      p_student_name: document.getElementById('selected-name').value,
      p_test_date: document.getElementById('test-date').value,
      p_self_efficacy: document.getElementById('self-efficacy').value,
      p_self_regulation: document.getElementById('self-regulation').value,
      p_learning_interest: document.getElementById('learning-interest').value,
      p_learning_habit: document.getElementById('learning-habit').value,
      p_cognitive_strategy: document.getElementById('cognitive-strategy').value,
      p_test_anxiety: document.getElementById('test-anxiety').value,
      p_parent_child_comm: document.getElementById('parent-child-comm').value,
      p_hagwon_dependency: document.getElementById('hagwon-dependency').value,
      p_comment: document.getElementById('comment').value.trim(),
    });

    if (error) {
      alert('저장 실패: ' + error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = '결과 저장';
      return;
    }

    gradeSelect.value = '';
    studentSelect.innerHTML = '<option value="">학년 먼저 선택</option>';
    studentSelect.disabled = true;
    document.getElementById('selected-code').value = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '학생을 먼저 선택하세요';
    gradeFields.forEach((id) => { document.getElementById(id).value = ''; });
    document.getElementById('comment').value = '';
    loadList();
  });

  loadList();
</script>

</body>
</html>
