<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 관리 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; display:flex; flex-direction:column; gap:18px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 4px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:22px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input {
    width:100%; font-size:14.5px; padding:9px 11px; border-radius:10px; border:1px solid var(--gray-200);
    font-family:inherit; background:#fff;
  }
  select:focus, input:focus { outline:none; border-color: var(--navy-900); }

  /* 월 이동 */
  .month-nav { display:flex; align-items:center; justify-content:center; gap:16px; }
  .month-nav button { background:none; border:1px solid var(--gray-200); border-radius:999px; width:34px; height:34px; cursor:pointer; color:var(--ink); font-size:14px; }
  .month-nav button:hover { border-color: var(--navy-900); }
  .month-nav .month-label { font-size:16px; font-weight:800; min-width:110px; text-align:center; }

  /* 통계 */
  .stats-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .stat-box { background: var(--gray-50); border-radius:12px; padding:14px; text-align:center; }
  .stat-box .num { font-size:19px; font-weight:900; }
  .stat-box .lbl { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .stat-box.unpaid .num { color:#DC2626; }
  .stat-box.paid .num { color:#16A34A; }

  /* 요금표 */
  .rate-toggle { text-align:center; margin-top:2px; }
  .rate-toggle button { background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; }
  .rate-grid { margin-top:12px; display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .rate-grid .rate-item label { font-size:11px; }
  .rate-save-btn { margin-top:12px; width:100%; padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; border:none; background:var(--navy-900); color:#fff; }

  /* 학생 목록 */
  .search-row { position:relative; }
  .search-row input { padding-left:34px; }
  .search-row i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; }
  .filter-row { display:flex; gap:8px; }
  .filter-row button {
    flex:1; padding:9px; border-radius:9px; border:1px solid var(--gray-200); background:#fff;
    font-weight:700; font-size:12.5px; cursor:pointer; color: var(--muted);
  }
  .filter-row button.active { background: var(--navy-900); color:#fff; border-color: var(--navy-900); }
  .select-all-row { display:flex; align-items:center; justify-content:space-between; }
  .select-all-row button { background:none; border:none; color: var(--navy-900); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; padding:4px 0; }
  .select-all-row .sel-count { font-size:12px; color:var(--muted); }

  /* 일괄 저장 바 */
  .bulk-bar {
    position: sticky; top: 0; z-index: 5; margin: -22px -22px 14px; padding: 14px 22px;
    background: var(--navy-950); color:#fff; border-radius: 16px 16px 0 0;
    display:flex; flex-wrap:wrap; align-items:end; gap:10px;
  }
  .bulk-bar .bulk-field { flex: 1 1 110px; }
  .bulk-bar label { color: rgba(255,255,255,0.7); margin-bottom:4px; }
  .bulk-bar select, .bulk-bar input { background:#fff; }
  .bulk-bar .bulk-count { font-size:12.5px; color: rgba(255,255,255,0.85); flex: 1 1 100%; }
  .bulk-bar .bulk-actions { display:flex; gap:8px; flex: 1 1 100%; }
  .bulk-bar .bulk-save-btn { flex:1; padding:10px; border-radius:9px; border:none; background:#fff; color:var(--navy-950); font-weight:800; font-size:13px; cursor:pointer; }
  .bulk-bar .bulk-clear-btn { padding:10px 14px; border-radius:9px; border:1px solid rgba(255,255,255,0.3); background:none; color:#fff; font-weight:700; font-size:12.5px; cursor:pointer; }

  .pay-list { margin-top:4px; }
  .pay-row { padding:14px 2px; border-top:1px solid var(--gray-200); font-size:13.5px; }
  .pay-row:first-child { border-top:none; }
  .pay-row .head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .pay-row .head .left { display:flex; align-items:center; gap:10px; }
  .pay-row .row-check { width:18px; height:18px; flex:none; accent-color: var(--navy-900); cursor:pointer; }
  .pay-row .name { font-weight:800; font-size:14.5px; }
  .pay-row .meta { color: var(--muted); font-size:12px; margin-top:3px; }
  .badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; }
  .badge.paid { background:#DCFCE7; color:#15803D; }
  .badge.unpaid { background:#FEE2E2; color:#B91C1C; }
  .pay-row .right { display:flex; align-items:center; gap:10px; }
  .pay-row .amount-text { font-weight:800; font-size:13.5px; }
  .pay-row button.action-btn { padding:7px 12px; border-radius:9px; border:1px solid var(--gray-200); background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); }
  .pay-row button.action-btn:hover { border-color: var(--navy-900); }
  .pay-form { margin-top:10px; padding:14px; background: var(--gray-50); border-radius:12px; display:grid; grid-template-columns: 1fr 1fr; gap:10px; align-items:end; }
  .pay-form label { font-size:11px; }
  .pay-form .full { grid-column: 1 / -1; }
  .pay-form .form-actions { grid-column: 1 / -1; display:flex; gap:8px; margin-top:2px; }
  .pay-form .form-actions button { flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .pay-form .save-btn { border:none; background:var(--navy-900); color:#fff; }
  .pay-form .del-btn { border:1px solid #FCA5A5; background:#fff; color:#DC2626; }
  .pay-form .cancel-btn { border:1px solid var(--gray-200); background:#fff; color:var(--ink); }
  .pay-row .memo-line { margin-top:6px; font-size:12px; color:var(--muted); }
  .level-row { display:flex; gap:8px; margin-bottom:10px; }
  .level-row .level-btn { flex:1; padding:11px 6px; border-radius:11px; border:2px solid var(--gray-200); background:#fff; font-weight:800; font-size:14px; cursor:pointer; color:var(--ink); }
  .level-row .level-btn.active { background:var(--navy-900); border-color:var(--navy-900); color:#fff; }
  .level-row .level-btn .lv-n { display:block; margin-top:2px; font-size:11px; font-weight:700; opacity:.75; }
  .level-row .level-btn .lv-n.has-unpaid { color:#B91C1C; opacity:1; }
  .level-row .level-btn.active .lv-n.has-unpaid { color:#FCA5A5; }
  .level-row.searching .level-btn { opacity:.45; }
  .level-note { font-size:11.5px; color:var(--muted); margin:-4px 0 8px; }
  label.wd-toggle { display:flex; align-items:center; gap:6px; margin:0 0 10px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  label.wd-toggle input { width:auto; margin:0; accent-color: var(--navy-900); }
  label.wd-toggle span { font-weight:500; font-size:11.5px; color:var(--muted); }
  .tag.wd { background:#E5E7EB; color:#374151; }
  .grp { border-top:1px solid var(--gray-200); }
  .grp:first-child { border-top:none; }
  .grp-head { display:flex; align-items:center; justify-content:space-between; padding:12px 2px; cursor:pointer; font-weight:800; font-size:14px; user-select:none; }
  .grp-head i { width:14px; font-size:11px; color:var(--muted); }
  .grp-count { font-weight:600; font-size:12px; color:var(--muted); margin-left:4px; }
  .grp-unpaid { font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px; background:#FEE2E2; color:#B91C1C; }
  .grp-unpaid.done { background:#DCFCE7; color:#15803D; }
  .grp-body { padding-left:4px; }
  .tag { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:800; background:#EEF2FF; color:#4338CA; }
  .tag.disc { background:#FEF3C7; color:#92400E; }
  .prepay-box { padding:10px 12px; border:1px dashed var(--gray-200); border-radius:10px; background:#fff; }
  .prepay-box .ts-help { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .tuition-set { grid-column: 1 / -1; padding-top:10px; margin-top:2px; border-top:1px dashed var(--gray-200); display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items:end; }
  .deduct-set { grid-column: 1 / -1; padding-top:10px; margin-top:2px; border-top:1px dashed var(--gray-200); display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end; }
  .deduct-set .ts-title { grid-column: 1 / -1; font-size:12px; font-weight:800; color:var(--ink); }
  .deduct-set .ts-help { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:-4px; }
  .deduct-set .deduct-save-btn { padding:9px 14px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; border:1px solid var(--navy-900); background:#fff; color:var(--navy-900); white-space:nowrap; }
  .tag.ded { background:#DBEAFE; color:#1D4ED8; }
  .tag.bell { background:#DCFCE7; color:#15803D; }
  .notice-toggle {
    display:inline-flex; align-items:center; gap:4px; margin-left:6px; cursor:pointer;
    font-size:11.5px; font-weight:700; color:#15803D; vertical-align:middle;
  }
  .notice-toggle.off { color:#DC2626; text-decoration:line-through; }
  .notice-toggle input { width:13px; height:13px; margin:0; cursor:pointer; accent-color:#15803D; }
  .bulk-bar .bulk-bell-btn { flex:1; padding:10px; border-radius:9px; border:none; background:#15803D; color:#fff; font-weight:800; font-size:13px; cursor:pointer; }
  .bulk-bar .bulk-bell-btn:disabled { background:rgba(255,255,255,0.18); color:rgba(255,255,255,0.55); cursor:default; }
  .bulk-bar .bulk-unpaid-btn { flex:1; padding:10px; border-radius:9px; border:1px solid rgba(255,255,255,0.7); background:transparent; color:#fff; font-weight:800; font-size:13px; cursor:pointer; }
  .bulk-bar .bulk-unpaid-btn:disabled { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.45); cursor:default; }
  .tag.unpaidn { background:#F2F2F2; color:#5C5C5C; }
  .tuition-set .ts-title { grid-column: 1 / -1; font-size:12px; font-weight:800; color:var(--ink); }
  .tuition-set .ts-help { grid-column: 1 / -1; font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:-4px; }
  .tuition-set .tuition-save-btn { padding:9px 14px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; border:1px solid var(--navy-900); background:#fff; color:var(--navy-900); white-space:nowrap; }
  .hist-btn { padding:7px 10px; border-radius:9px; border:1px solid var(--gray-200); background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--muted); }
  .hist-overlay { position:fixed; inset:0; background:rgba(11,18,32,0.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .hist-box { background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:82vh; display:flex; flex-direction:column; }
  .hist-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--gray-200); font-weight:800; font-size:15px; }
  .hist-head button { border:none; background:none; font-size:20px; cursor:pointer; color:var(--muted); }
  .hist-body { overflow:auto; padding:6px 18px 18px; }
  .hist-item { padding:12px 0; border-bottom:1px solid var(--gray-200); font-size:13px; line-height:1.6; }
  .hist-item:last-child { border-bottom:none; }
  .hist-item .t { color:var(--muted); font-size:11.5px; }
  .hist-item .act { display:inline-block; font-weight:800; font-size:11.5px; padding:2px 8px; border-radius:999px; margin-right:6px; }
  .act-in { background:#DCFCE7; color:#15803D; } .act-mod { background:#FEF3C7; color:#92400E; }
  .act-del { background:#FEE2E2; color:#B91C1C; } .act-old { background:var(--gray-100,#F3F4F6); color:var(--muted); }
  .empty, .loading { color: var(--muted); font-size:13px; padding:16px 4px; text-align:center; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">결제 관리</span>
</header>

<main>
  <div>
    <h1>월별 납부 현황</h1>
    <p class="sub">재원생 전체의 이번 달 교육비 납부 여부예요. 미납 학생은 빨간색으로 표시돼요.</p>
  </div>

  <div class="panel">
    <div class="month-nav">
      <button type="button" id="prev-month-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="month-label" id="month-label">-</span>
      <button type="button" id="next-month-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="stats-row" style="margin-top:16px;">
      <div class="stat-box paid">
        <div class="num" id="stat-paid">-</div>
        <div class="lbl">납부완료</div>
      </div>
      <div class="stat-box unpaid">
        <div class="num" id="stat-unpaid">-</div>
        <div class="lbl">미납</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-total">-</div>
        <div class="lbl">이번 달 수납액</div>
      </div>
    </div>
    <div class="rate-toggle"><button type="button" id="rate-toggle-btn">교육비 요금표 보기/수정</button></div>
    <div id="rate-panel" style="display:none;"></div>
  </div>

  <div class="panel" id="list-panel">
    <div id="bulk-bar"></div>
    <div class="search-row" style="margin-bottom:10px;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="학생 이름 검색">
    </div>
    <div class="level-row" id="level-row"></div>
    <label class="wd-toggle"><input type="checkbox" id="wd-toggle"> 퇴원생도 보기 <span>(지난달 납부를 입력할 때 켜세요)</span></label>
    <div class="filter-row">
      <button type="button" class="filter-btn active" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="unpaid">미납</button>
      <button type="button" class="filter-btn" data-filter="paid">납부완료</button>
      <button type="button" class="hist-btn" id="hist-all-btn" style="margin-left:auto;">전체 변경 이력</button>
    </div>
    <div class="select-all-row" style="margin-top:10px;">
      <button type="button" id="select-all-btn">전체 선택</button>
      <span class="sel-count" id="sel-count"></span>
    </div>
    <div class="pay-list" id="pay-list"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<div class="hist-overlay" id="hist-overlay">
  <div class="hist-box">
    <div class="hist-head"><span id="hist-title">변경 이력</span><button type="button" id="hist-close">&times;</button></div>
    <div class="hist-body" id="hist-body"></div>
  </div>
</div>

<script src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  requireDirector();

  const monthLabelEl = document.getElementById('month-label');
  const payListEl = document.getElementById('pay-list');
  const ratePanelEl = document.getElementById('rate-panel');
  const rateToggleBtn = document.getElementById('rate-toggle-btn');

  let currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // 이번 달 1일
  let currentRows = [];
  let unpaidNotice = new Map();   // 미납 안내 기록: 학생코드 → { count, last }
  let currentRates = [];
  let currentFilter = 'all';
  let editingCode = null; // 지금 입력폼 열려있는 student_code
  let searchQuery = '';
  let selectedCodes = new Set(); // 일괄 저장용 선택된 student_code
  let amountOverrides = new Map(); // student_code -> 수정된 금액 (등원 첫달 등 기본금액과 다를 때)
  let bulkDate = '';
  let bulkMethod = '현금';
  let includeWithdrawn = false; // 퇴원생도 보기
  const countsAsUnpaid = (r) => !r.paid && !r.withdrawn; // 퇴원생의 미납은 통계에 넣지 않아요
  let currentLevel = '초등';  // 초등/중등/고등 탭 (결제선생처럼 교육비 구분 기준)
  function levelOf(r) {
    if (r.class_type === '초등' || r.class_type === '중등' || r.class_type === '고등') return r.class_type;
    const g = r.grade || '';
    if (g.startsWith('초')) return '초등';
    if (g.startsWith('중')) return '중등';
    if (g.startsWith('고')) return '고등';
    return '기타';
  }

  function monthStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  }
  function monthLabel(d) {
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
  }
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  // 알림톡 보낸 시각 (예: 11/02 14:30)
  function fmtSentAt(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtWon(n) {
    if (n === null || n === undefined || n === '') return '-';
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  document.getElementById('prev-month-btn').addEventListener('click', () => {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
    editingCode = null;
    loadPayments();
  });
  document.getElementById('next-month-btn').addEventListener('click', () => {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
    editingCode = null;
    loadPayments();
  });

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      editingCode = null;
      renderList();
    });
  });

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    editingCode = null;
    renderList();
  });

  document.getElementById('wd-toggle').addEventListener('change', (e) => {
    includeWithdrawn = e.target.checked;
    editingCode = null;
    loadPayments();
  });

  document.getElementById('select-all-btn').addEventListener('click', () => {
    const filtered = getFilteredRows().filter((r) => !r.withdrawn); // 전체 선택에는 퇴원생을 넣지 않아요
    const allSelected = filtered.length > 0 && filtered.every((r) => selectedCodes.has(r.student_code));
    if (allSelected) {
      filtered.forEach((r) => selectedCodes.delete(r.student_code));
    } else {
      filtered.forEach((r) => selectedCodes.add(r.student_code));
    }
    renderList();
  });

  // ===== 요금표 =====
  rateToggleBtn.addEventListener('click', async () => {
    const show = ratePanelEl.style.display === 'none';
    if (show && currentRates.length === 0) await loadRates();
    ratePanelEl.style.display = show ? 'block' : 'none';
    rateToggleBtn.textContent = show ? '교육비 요금표 닫기' : '교육비 요금표 보기/수정';
  });

  async function loadRates() {
    const { data, error } = await sb.rpc('rpc_admin_get_tuition_rates', { p_password: getAdminPassword() });
    if (error) { ratePanelEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>'; return; }
    currentRates = data || [];
    renderRates();
  }

  function renderRates() {
    ratePanelEl.innerHTML = `
      <div class="rate-grid">
        ${currentRates.map((r) => `
          <div class="rate-item">
            <label>${r.class_type}</label>
            <input type="number" class="rate-input" data-class-type="${r.class_type}" value="${r.amount}">
          </div>
        `).join('')}
      </div>
      <button type="button" class="rate-save-btn" id="rate-save-btn">요금표 저장</button>
    `;
    document.getElementById('rate-save-btn').addEventListener('click', async () => {
      const btn = document.getElementById('rate-save-btn');
      btn.disabled = true;
      const inputs = ratePanelEl.querySelectorAll('.rate-input');
      for (const input of inputs) {
        const { error } = await sb.rpc('rpc_admin_update_tuition_rate', {
          p_password: getAdminPassword(),
          p_class_type: input.dataset.classType,
          p_amount: Number(input.value),
        });
        if (error) { alert('저장 실패(' + input.dataset.classType + '): ' + error.message); btn.disabled = false; return; }
      }
      btn.disabled = false;
      alert('요금표가 저장됐어요.');
      loadPayments(); // 기본 금액이 바뀌었을 수 있으니 목록도 새로고침
    });
  }

  // ===== 납부 현황 =====
  async function loadPayments() {
    monthLabelEl.textContent = monthLabel(currentMonth);
    payListEl.innerHTML = '<div class="loading">불러오는 중...</div>';
    const { data, error } = await sb.rpc('rpc_admin_list_payment_status', {
      p_password: getAdminPassword(),
      p_billing_month: monthStr(currentMonth),
      p_include_withdrawn: includeWithdrawn,
    });
    if (error) {
      payListEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' + error.message + '</div>';
      return;
    }
    currentRows = data || [];
    selectedCodes = new Set();
    amountOverrides = new Map();
    // 미납 안내 기록 (불러오지 못해도 목록은 그대로 보여줘요)
    unpaidNotice = new Map();
    const un = await sb.rpc('rpc_admin_list_unpaid_notice', {
      p_password: getAdminPassword(),
      p_billing_month: monthStr(currentMonth),
    });
    if (!un.error) (un.data || []).forEach((x) => unpaidNotice.set(x.student_code, { count: x.sent_count, last: x.last_sent_at }));
    renderStats();
    renderList();
  }
  loadPayments();

  function getFilteredRows() {
    return currentRows.filter((r) => {
      if (currentFilter === 'paid' && !r.paid) return false;
      if (currentFilter === 'unpaid' && r.paid) return false;
      if (searchQuery) return (r.student_name || '').toLowerCase().includes(searchQuery); // 검색할 땐 모든 학년에서 찾아요
      if (levelOf(r) !== currentLevel) return false;
      return true;
    });
  }

  function renderLevelTabs() {
    const levelRowEl = document.getElementById('level-row');
    const levels = ['초등', '중등', '고등'];
    if (currentRows.some((r) => levelOf(r) === '기타')) levels.push('기타');
    if (!levels.includes(currentLevel)) currentLevel = levels[0];
    levelRowEl.classList.toggle('searching', !!searchQuery);
    levelRowEl.innerHTML = levels.map((lv) => {
      const rows = currentRows.filter((r) => levelOf(r) === lv && (r.paid || !r.withdrawn));
      const unpaid = rows.filter(countsAsUnpaid).length;
      return `<button type="button" class="level-btn ${lv === currentLevel ? 'active' : ''}" data-level="${lv}">${lv}<span class="lv-n ${unpaid ? 'has-unpaid' : ''}">${rows.length}명 · ${unpaid ? '미납 ' + unpaid : '모두 납부'}</span></button>`;
    }).join('');
    levelRowEl.querySelectorAll('.level-btn').forEach((b) => {
      b.addEventListener('click', () => {
        currentLevel = b.dataset.level;
        editingCode = null;
        selectedCodes = new Set(); // 다른 탭의 학생이 같이 저장되는 일을 막아요
        renderList();
      });
    });
  }

  function defaultAmountFor(r) {
    const base = r.default_amount !== null && r.default_amount !== undefined ? r.default_amount : '';
    return r.paid ? r.amount : base;
  }

  function renderBulkBar() {
    const bulkBarEl = document.getElementById('bulk-bar');
    const selCountEl = document.getElementById('sel-count');
    const n = selectedCodes.size;
    selCountEl.textContent = n > 0 ? `${n}명 선택됨` : '';

    const selectAllBtn = document.getElementById('select-all-btn');
    const filtered = getFilteredRows().filter((r) => !r.withdrawn);
    const allSelected = filtered.length > 0 && filtered.every((r) => selectedCodes.has(r.student_code));
    selectAllBtn.textContent = allSelected ? '전체 선택 해제' : '전체 선택';

    if (n === 0) { bulkBarEl.innerHTML = ''; return; }
    if (!bulkDate) bulkDate = todayStr();

    // 알림톡 대상: 선택한 학생 중 수납 확인이 저장돼 있고, 이 달에 아직 안 보낸 학생
    const bellTargets = currentRows.filter(
      (r) => selectedCodes.has(r.student_code) && r.paid && !r.notice_sent_at
    );
    // 미납 안내 대상: 선택한 학생 중 수납 확인이 안 된 재원생 (여러 번 보낼 수 있어요)
    const unpaidTargets = currentRows.filter(
      (r) => selectedCodes.has(r.student_code) && !r.paid && !r.withdrawn
    );

    bulkBarEl.innerHTML = `
      <div class="bulk-bar">
        <div class="bulk-count">선택한 ${n}명을 한 번에 납부 처리해요. 금액은 학생별로 아래 목록에서 따로 수정할 수 있어요.</div>
        <div class="bulk-field">
          <label>납부일</label>
          <input type="date" id="bulk-date-input" value="${bulkDate}">
        </div>
        <div class="bulk-field">
          <label>결제수단</label>
          <select id="bulk-method-input">
            <option value="현금" ${bulkMethod === '현금' ? 'selected' : ''}>현금(입금)</option>
            <option value="카드" ${bulkMethod === '카드' ? 'selected' : ''}>카드</option>
            <option value="현장납부(현금)" ${bulkMethod === '현장납부(현금)' ? 'selected' : ''}>현장납부(현금)</option>
            <option value="현장납부(카드)" ${bulkMethod === '현장납부(카드)' ? 'selected' : ''}>현장납부(카드)</option>
          </select>
        </div>
        <div class="bulk-actions">
          <button type="button" class="bulk-save-btn" id="bulk-save-btn">선택 ${n}명 일괄 저장</button>
          <button type="button" class="bulk-clear-btn" id="bulk-clear-btn">선택 해제</button>
        </div>
        <div class="bulk-actions">
          <button type="button" class="bulk-bell-btn" id="bulk-bell-btn" ${bellTargets.length === 0 ? 'disabled' : ''}>
            ${bellTargets.length === 0 ? '알림톡 보낼 학생 없음' : `선택 ${bellTargets.length}명 알림톡 발송`}
          </button>
        </div>
        <div class="bulk-actions">
          <button type="button" class="bulk-unpaid-btn" id="bulk-unpaid-btn" ${unpaidTargets.length === 0 ? 'disabled' : ''}>
            ${unpaidTargets.length === 0 ? '미납 안내 보낼 학생 없음' : `선택 ${unpaidTargets.length}명 미납 안내 발송`}
          </button>
        </div>
      </div>
    `;

    document.getElementById('bulk-date-input').addEventListener('change', (e) => { bulkDate = e.target.value; });
    document.getElementById('bulk-method-input').addEventListener('change', (e) => { bulkMethod = e.target.value; });
    document.getElementById('bulk-clear-btn').addEventListener('click', () => { selectedCodes.clear(); renderList(); });
    document.getElementById('bulk-save-btn').addEventListener('click', async () => {
      if (!bulkDate) { alert('납부일을 선택해주세요.'); return; }
      const targets = currentRows.filter((r) => selectedCodes.has(r.student_code));
      const missingAmount = targets.find((r) => {
        const amt = amountOverrides.has(r.student_code) ? amountOverrides.get(r.student_code) : defaultAmountFor(r);
        return amt === '' || amt === null || amt === undefined;
      });
      if (missingAmount) { alert(`${missingAmount.student_name} 학생은 금액이 없어요. 목록에서 금액을 먼저 입력해주세요.`); return; }
      if (!confirm(`선택한 ${targets.length}명을 ${bulkDate} / ${bulkMethod}(으)로 일괄 저장할까요?`)) return;

      const saveBtn = document.getElementById('bulk-save-btn');
      saveBtn.disabled = true;
      let failCount = 0;
      for (const r of targets) {
        const amt = amountOverrides.has(r.student_code) ? amountOverrides.get(r.student_code) : defaultAmountFor(r);
        const { error } = await sb.rpc('rpc_admin_save_payment', {
          p_password: getAdminPassword(),
          p_student_code: r.student_code,
          p_billing_month: monthStr(currentMonth),
          p_amount: Number(amt),
          p_paid_date: bulkDate,
          p_payment_method: bulkMethod,
          p_memo: r.memo || null,
        });
        if (error) failCount++;
      }
      saveBtn.disabled = false;
      if (failCount > 0) alert(`${failCount}명은 저장에 실패했어요. 다시 시도해주세요.`);
      else alert('일괄 저장이 완료됐어요.');
      loadPayments();
    });

    // 납부 확인 알림톡 일괄 발송 (이 버튼을 누를 때만 발송돼요)
    const bellBtn = document.getElementById('bulk-bell-btn');
    if (bellBtn && bellTargets.length > 0) {
      bellBtn.addEventListener('click', async () => {
        const codes = bellTargets.map((r) => r.student_code);
        bellBtn.disabled = true;
        bellBtn.textContent = '확인 중...';

        const pre = await sb.rpc('rpc_admin_preview_payment_confirm', {
          p_password: getAdminPassword(),
          p_billing_month: monthStr(currentMonth),
          p_student_codes: codes,
        });
        bellBtn.disabled = false;
        bellBtn.textContent = `선택 ${bellTargets.length}명 알림톡 발송`;
        if (pre.error) { alert('미리보기 실패: ' + pre.error.message); return; }

        const rows = pre.data || [];
        const ok = rows.filter((x) => x.sendable);
        const no = rows.filter((x) => !x.sendable);
        if (ok.length === 0) {
          alert('보낼 수 있는 학생이 없어요.\n' + no.map((x) => `· ${x.student_name}: ${x.reason}`).join('\n'));
          return;
        }

        const lines = ok.slice(0, 12).map((x) => `· ${x.student_name} ${x.month_label} ${fmtWon(x.amount)}`);
        if (ok.length > 12) lines.push(`· 외 ${ok.length - 12}명`);
        let msg = `학부모 ${ok.length}명에게 납부 확인 알림톡을 보냅니다.\n\n${lines.join('\n')}`;
        if (no.length > 0) msg += `\n\n제외 ${no.length}명\n` + no.map((x) => `· ${x.student_name}: ${x.reason}`).join('\n');
        msg += '\n\n보낼까요? (보내면 취소할 수 없어요)';
        if (!confirm(msg)) return;

        bellBtn.disabled = true;
        bellBtn.textContent = '발송 중...';
        const { data, error } = await sb.rpc('rpc_admin_send_payment_confirm', {
          p_password: getAdminPassword(),
          p_billing_month: monthStr(currentMonth),
          p_student_codes: ok.map((x) => x.student_code),
        });
        bellBtn.disabled = false;
        if (error) { alert('발송 실패: ' + error.message); return; }

        const skipped = (data && data.skipped) || [];
        let done = `알림톡 ${(data && data.sent) || 0}명에게 발송했어요.`;
        if (skipped.length > 0) done += `\n\n제외 ${skipped.length}명\n` + skipped.map((s) => `· ${s.name}: ${s.reason}`).join('\n');
        alert(done);
        selectedCodes.clear();
        loadPayments();
      });
    }

    // 미납 안내 알림톡 일괄 발송 (이 버튼을 누를 때만 발송돼요. 같은 달에 여러 번 보낼 수 있어요)
    const unpaidBtn = document.getElementById('bulk-unpaid-btn');
    if (unpaidBtn && unpaidTargets.length > 0) {
      unpaidBtn.addEventListener('click', async () => {
        const codes = unpaidTargets.map((r) => r.student_code);
        const label = `선택 ${unpaidTargets.length}명 미납 안내 발송`;
        const monthNum = currentMonth.getMonth() + 1;
        unpaidBtn.disabled = true;
        unpaidBtn.textContent = '확인 중...';

        const pre = await sb.rpc('rpc_admin_preview_unpaid_notice', {
          p_password: getAdminPassword(),
          p_billing_month: monthStr(currentMonth),
          p_student_codes: codes,
        });
        unpaidBtn.disabled = false;
        unpaidBtn.textContent = label;
        if (pre.error) { alert('미리보기 실패: ' + pre.error.message); return; }

        const rows = pre.data || [];
        const ok = rows.filter((x) => x.sendable);
        const no = rows.filter((x) => !x.sendable);
        if (ok.length === 0) {
          alert('보낼 수 있는 학생이 없어요.\n' + no.map((x) => `· ${x.student_name}: ${x.reason}`).join('\n'));
          return;
        }

        const lines = ok.slice(0, 15).map((x) => `· ${x.student_name}${x.sent_count > 0 ? ` (${x.sent_count + 1}회째)` : ''}`);
        if (ok.length > 15) lines.push(`· 외 ${ok.length - 15}명`);
        let msg = `학부모 ${ok.length}명에게 ${monthNum}월 미납 안내 알림톡을 보냅니다.\n\n${lines.join('\n')}`;
        if (no.length > 0) msg += `\n\n제외 ${no.length}명\n` + no.map((x) => `· ${x.student_name}: ${x.reason}`).join('\n');
        msg += '\n\n보낼까요? (보내면 취소할 수 없어요)';
        if (!confirm(msg)) return;

        unpaidBtn.disabled = true;
        unpaidBtn.textContent = '발송 중...';
        const { data, error } = await sb.rpc('rpc_admin_send_unpaid_notice', {
          p_password: getAdminPassword(),
          p_billing_month: monthStr(currentMonth),
          p_student_codes: ok.map((x) => x.student_code),
        });
        unpaidBtn.disabled = false;
        unpaidBtn.textContent = label;
        if (error) { alert('발송 실패: ' + error.message); return; }
        if (data && data.reason) { alert('발송하지 못했어요: ' + data.reason); return; }

        const skipped = (data && data.skipped) || [];
        let done = `미납 안내 ${(data && data.sent) || 0}명에게 발송했어요.`;
        if (skipped.length > 0) done += `\n\n제외 ${skipped.length}명\n` + skipped.map((s) => `· ${s.name}: ${s.reason}`).join('\n');
        alert(done);
        selectedCodes.clear();
        loadPayments();
      });
    }
  }

  function renderStats() {
    const paid = currentRows.filter((r) => r.paid);
    const unpaid = currentRows.filter(countsAsUnpaid);
    const total = paid.reduce((sum, r) => sum + Number(r.amount || 0), 0);
    document.getElementById('stat-paid').textContent = paid.length;
    document.getElementById('stat-unpaid').textContent = unpaid.length;
    document.getElementById('stat-total').textContent = total.toLocaleString('ko-KR') + '원';
  }

  function renderList() {
    renderLevelTabs();
    renderBulkBar();
    const filtered = getFilteredRows();

    if (filtered.length === 0) {
      payListEl.innerHTML = '<div class="empty">해당하는 학생이 없습니다.</div>';
      return;
    }

    const renderRow = (r) => {
      const isEditing = editingCode === r.student_code;
      const defaultAmount = defaultAmountFor(r);
      const prefillAmount = amountOverrides.has(r.student_code) ? amountOverrides.get(r.student_code) : defaultAmount;
      const prefillDate = r.paid_date || todayStr();
      const isChecked = selectedCodes.has(r.student_code);

      const form = isEditing ? `
        <div class="pay-form">
          <div>
            <label>금액</label>
            <input type="number" class="f-amount" value="${prefillAmount}">
          </div>
          <div>
            <label>납부일</label>
            <input type="date" class="f-date" value="${prefillDate}">
          </div>
          <div>
            <label>결제수단</label>
            <select class="f-method">
              <option value="현금" ${r.payment_method === '현금' || !r.payment_method ? 'selected' : ''}>현금(입금)</option>
              <option value="카드" ${r.payment_method === '카드' ? 'selected' : ''}>카드</option>
              <option value="현장납부(현금)" ${r.payment_method === '현장납부(현금)' ? 'selected' : ''}>현장납부(현금)</option>
              <option value="현장납부(카드)" ${r.payment_method === '현장납부(카드)' ? 'selected' : ''}>현장납부(카드)</option>
            </select>
          </div>
          <div class="full">
            <label>메모</label>
            <input type="text" class="f-memo" placeholder="예) 입금자명" value="${r.memo || ''}">
          </div>
          ${r.paid ? '' : `
          <div class="full prepay-box">
            <label>선납 (이번 달부터 몇 개월치를 한 번에 냈나요?)</label>
            <select class="f-prepay">
              <option value="1" selected>이번 달만 (선납 아님)</option>
              ${[2, 3, 4, 5, 6].map((n) => `<option value="${n}">${n}개월치 선납</option>`).join('')}
            </select>
            <div class="ts-help">선납을 고르면 각 달의 기본 금액(할인·차감 반영)으로 한 번에 기록돼요. 위의 금액 칸은 쓰이지 않아요. 알림톡은 한 건만 나가요. 금액을 직접 정해야 하면 선납을 쓰지 말고 달마다 입력하세요.</div>
          </div>`}
          <div class="deduct-set">
            <div class="ts-title">${monthLabel(currentMonth)}분 차감</div>
            ${r.discount_rate > 0 ? `
              <div class="ts-help" style="grid-column:1/-1;">할인율이 설정된 학생은 차감하지 않아요.</div>
            ` : `
              <div>
                <label>차감 주 수</label>
                <select class="f-deduct">
                  ${[0, 1, 2, 3, 4].map((w) => `<option value="${w}" ${(r.deduct_weeks || 0) === w ? 'selected' : ''}>${w === 0 ? '차감 없음' : w + '주 차감'}</option>`).join('')}
                </select>
              </div>
              <button type="button" class="deduct-save-btn" data-code="${r.student_code}">차감 저장</button>
              <div class="ts-help" style="grid-column:1/-1;">1주 차감 = 단가의 4분의 1이에요. 저장하면 이 달 기본 금액에 바로 반영돼요. 이미 납부 처리한 달은 낸 금액이 그대로 유지돼요.</div>
            `}
          </div>
          <div class="tuition-set">
            <div class="ts-title">교육비 설정 (이 학생 전용)</div>
            <div>
              <label>적용 구분</label>
              <select class="f-ctype">
                <option value="" ${!r.class_type_fixed ? 'selected' : ''}>자동 (학년 기준${!r.class_type_fixed && r.class_type ? ': ' + r.class_type : ''})</option>
                <option value="초등" ${r.class_type_fixed && r.class_type === '초등' ? 'selected' : ''}>초등 단가</option>
                <option value="중등" ${r.class_type_fixed && r.class_type === '중등' ? 'selected' : ''}>중등 단가</option>
                <option value="고등" ${r.class_type_fixed && r.class_type === '고등' ? 'selected' : ''}>고등 단가</option>
              </select>
            </div>
            <div>
              <label>할인율 (%)</label>
              <input type="number" class="f-disc" min="0" max="100" step="1" value="${r.discount_rate || 0}">
            </div>
            <button type="button" class="tuition-save-btn" data-code="${r.student_code}">설정 저장</button>
            <div class="ts-help">기본 금액 = 단가 × (100 − 할인율)%. 구분은 1월에 초6→중등, 중3→고등처럼 미리 옮길 때만 지정하고, 평소엔 자동으로 두세요. 저장하면 이 달 미납 금액에 바로 반영돼요.</div>
          </div>
          <div class="form-actions">
            <button type="button" class="save-btn" data-code="${r.student_code}">저장</button>
            ${r.paid ? `<button type="button" class="del-btn" data-code="${r.student_code}" data-id="${r.payment_id}">납부취소</button>` : ''}
            <button type="button" class="cancel-btn">취소</button>
          </div>
        </div>
      ` : '';

      return `
        <div class="pay-row" data-code="${r.student_code}">
          <div class="head">
            <div class="left">
              ${isEditing ? '' : `<input type="checkbox" class="row-check" data-code="${r.student_code}" ${isChecked ? 'checked' : ''}>`}
              <span class="badge ${r.paid ? 'paid' : 'unpaid'}">${r.paid ? '납부완료' : '미납'}</span>
              <span class="name">${r.student_name || ''}</span>
            </div>
            <div class="right">
              ${isEditing ? '' : `<input type="number" class="amount-input" data-code="${r.student_code}" value="${prefillAmount}" style="width:92px;">`}
              <button type="button" class="hist-btn" data-code="${r.student_code}" data-name="${r.student_name || ''}">이력</button>
              <button type="button" class="action-btn toggle-btn" data-code="${r.student_code}">${isEditing ? '닫기' : (r.paid ? '수정' : '납부 입력')}</button>
            </div>
          </div>
          <div class="meta">${r.grade || ''}${r.class_type ? ' · ' + r.class_type : ''}${r.withdrawn ? '<span class="tag wd">퇴원</span>' : ''}${r.class_type_fixed ? '<span class="tag">구분 지정</span>' : ''}${r.discount_rate > 0 ? `<span class="tag disc">할인 ${r.discount_rate}%</span>` : ''}${r.deduct_weeks > 0 ? `<span class="tag ded">차감 ${r.deduct_weeks}주</span>` : ''}${r.notice_sent_at ? `<span class="tag bell">알림톡 ${fmtSentAt(r.notice_sent_at)}</span>` : ''}${!r.paid && unpaidNotice.has(r.student_code) ? `<span class="tag unpaidn">미납 안내 ${fmtSentAt(unpaidNotice.get(r.student_code).last)} · ${unpaidNotice.get(r.student_code).count}회</span>` : ''}<label class="notice-toggle${r.tuition_notice_on === false ? ' off' : ''}" title="말일 수납 안내를 받을지 정해요"><input type="checkbox" class="notice-chk" data-code="${r.student_code}" ${r.tuition_notice_on === false ? '' : 'checked'}>수납 안내</label>${r.paid && r.paid_date ? ' · 납부일 ' + r.paid_date : ''}${r.paid && r.payment_method ? ' · ' + r.payment_method : ''}</div>
          ${r.paid && r.memo ? `<div class="memo-line">메모: ${r.memo}</div>` : ''}
          ${form}
        </div>
      `;
    };

    // 학년 묶음 없이, 이름 가나다순으로 쭉 보여줘요. 이름이 같으면 학년 순서예요.
    const sorted = filtered.slice().sort((a, b) =>
      (a.student_name || '').localeCompare(b.student_name || '', 'ko') ||
      (a.grade || '').localeCompare(b.grade || '', 'ko'));
    payListEl.innerHTML = sorted.map(renderRow).join('');

    payListEl.querySelectorAll('.pay-row .hist-btn').forEach((btn) => {
      btn.addEventListener('click', () => openHistory(btn.dataset.code, btn.dataset.name));
    });
    payListEl.querySelectorAll('.row-check').forEach((chk) => {
      chk.addEventListener('change', () => {
        const code = chk.dataset.code;
        if (chk.checked) selectedCodes.add(code); else selectedCodes.delete(code);
        renderList();
      });
    });
    // 말일 수납 안내를 받을지 (학생별). 끄면 자동 발송에서 빠져요. 알림톡은 나가지 않아요
    payListEl.querySelectorAll('.notice-chk').forEach((chk) => {
      chk.addEventListener('change', async () => {
        const code = chk.dataset.code;
        const want = chk.checked;
        chk.disabled = true;
        const { error } = await sb.rpc('rpc_admin_set_tuition_notice_on', {
          p_password: getAdminPassword(),
          p_student_code: code,
          p_on: want,
        });
        chk.disabled = false;
        if (error) {
          chk.checked = !want;
          alert('수납 안내 설정 저장 실패: ' + error.message);
          return;
        }
        const target = currentRows.find((r) => r.student_code === code);
        if (target) target.tuition_notice_on = want;
        chk.closest('.notice-toggle').classList.toggle('off', !want);
      });
    });
    payListEl.querySelectorAll('.amount-input').forEach((inp) => {
      inp.addEventListener('input', () => {
        amountOverrides.set(inp.dataset.code, inp.value.trim());
      });
    });
    payListEl.querySelectorAll('.toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.code;
        editingCode = editingCode === code ? null : code;
        renderList();
      });
    });
    payListEl.querySelectorAll('.cancel-btn').forEach((btn) => {
      btn.addEventListener('click', () => { editingCode = null; renderList(); });
    });
    payListEl.querySelectorAll('.save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const code = btn.dataset.code;
        const row = payListEl.querySelector(`.pay-row[data-code="${code}"]`);
        const amount = row.querySelector('.f-amount').value.trim();
        const paidDate = row.querySelector('.f-date').value;
        const method = row.querySelector('.f-method').value;
        const memo = row.querySelector('.f-memo').value.trim();

        const prepaySel = row.querySelector('.f-prepay');
        const prepayMonths = prepaySel ? Number(prepaySel.value) : 1;
        if (prepayMonths > 1) {
          if (!paidDate) { alert('납부일을 입력해주세요.'); return; }
          const last = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + prepayMonths - 1, 1);
          const rangeLabel = `${currentMonth.getMonth() + 1}월 ~ ${last.getMonth() + 1}월`;
          if (!confirm(`${row.querySelector('.name').textContent} 학생의 ${rangeLabel}(${prepayMonths}개월) 선납을 기록할까요?\n각 달의 기본 금액으로 들어가고, 납부 확인 알림톡은 한 번만 나가요.`)) return;
          btn.disabled = true;
          const { data: pre, error: preErr } = await sb.rpc('rpc_admin_save_prepaid', {
            p_password: getAdminPassword(),
            p_student_code: code,
            p_start_month: monthStr(currentMonth),
            p_months: prepayMonths,
            p_paid_date: paidDate,
            p_payment_method: method,
            p_memo: memo === '' ? null : memo,
          });
          btn.disabled = false;
          if (preErr) { alert('선납 저장 실패: ' + preErr.message); return; }
          const sent = pre && pre.notice && pre.notice.sent > 0;
          alert(`${pre.label} 선납 ${pre.months}건을 기록했어요. (합계 ${Number(pre.total).toLocaleString('ko-KR')}원)\n` +
                (sent ? '납부 확인 알림톡을 보냈어요.' : '알림톡은 나가지 않았어요. (' + ((pre.notice && pre.notice.reason) || '확인 필요') + ')'));
          editingCode = null;
          loadPayments();
          return;
        }

        if (amount === '' || !paidDate) { alert('금액과 납부일은 필수예요.'); return; }

        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_save_payment', {
          p_password: getAdminPassword(),
          p_student_code: code,
          p_billing_month: monthStr(currentMonth),
          p_amount: Number(amount),
          p_paid_date: paidDate,
          p_payment_method: method,
          p_memo: memo === '' ? null : memo,
        });
        btn.disabled = false;
        if (error) { alert('저장 실패: ' + error.message); return; }
        editingCode = null;
        loadPayments();
      });
    });
    payListEl.querySelectorAll('.deduct-save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const code = btn.dataset.code;
        const row = payListEl.querySelector(`.pay-row[data-code="${code}"]`);
        const weeks = Number(row.querySelector('.f-deduct').value);
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_save_deduction', {
          p_password: getAdminPassword(),
          p_student_code: code,
          p_billing_month: monthStr(currentMonth),
          p_weeks: weeks,
        });
        btn.disabled = false;
        if (error) { alert('차감 저장 실패: ' + error.message); return; }
        loadPayments(); // 입력창은 열어 둔 채로 새 기본 금액 반영
      });
    });
    payListEl.querySelectorAll('.tuition-save-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const code = btn.dataset.code;
        const row = payListEl.querySelector(`.pay-row[data-code="${code}"]`);
        const ctype = row.querySelector('.f-ctype').value;
        const discRaw = row.querySelector('.f-disc').value.trim();
        const disc = discRaw === '' ? 0 : Number(discRaw);
        if (!Number.isInteger(disc) || disc < 0 || disc > 100) { alert('할인율은 0~100 사이의 정수로 입력해주세요.'); return; }
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_save_student_tuition', {
          p_password: getAdminPassword(),
          p_student_code: code,
          p_class_type: ctype === '' ? null : ctype,
          p_discount_rate: disc,
        });
        btn.disabled = false;
        if (error) { alert('설정 저장 실패: ' + error.message); return; }
        loadPayments(); // 입력창은 열어 둔 채로 새 기본 금액 반영
      });
    });
    payListEl.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 달 납부 기록을 취소할까요? (미납 상태로 돌아가요)')) return;
        btn.disabled = true;
        const { error } = await sb.rpc('rpc_admin_delete_payment', {
          p_password: getAdminPassword(), p_id: btn.dataset.id,
        });
        btn.disabled = false;
        if (error) { alert('취소 실패: ' + error.message); return; }
        editingCode = null;
        loadPayments();
      });
    });
  }

  // ---- 결제 변경 이력 ----
  const HIST_LABELS = { amount: '금액', paid_date: '납부일', payment_method: '결제수단', memo: '메모' };
  function histEsc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function histVal(k, v) {
    if (v == null || v === '') return '(없음)';
    return k === 'amount' ? Number(v).toLocaleString('ko-KR') + '원' : histEsc(v);
  }
  function histSummary(h) {
    const o = h.old_data || {}, n = h.new_data || {};
    const keys = ['amount', 'paid_date', 'payment_method', 'memo'];
    if (h.action === '수정') {
      const diffs = keys.filter((k) => (o[k] ?? null) !== (n[k] ?? null))
        .map((k) => `${HIST_LABELS[k]}: ${histVal(k, o[k])} → <b>${histVal(k, n[k])}</b>`);
      return diffs.join('<br>') || '(내용 변경 없음)';
    }
    const src = h.action === '취소' ? o : n;
    const parts = keys.filter((k) => src[k] != null && src[k] !== '').map((k) => `${HIST_LABELS[k]} ${histVal(k, src[k])}`);
    return parts.join(' · ');
  }
  async function openHistory(code, name) {
    const overlay = document.getElementById('hist-overlay');
    const body = document.getElementById('hist-body');
    document.getElementById('hist-title').textContent = code ? `${name || code} 결제 변경 이력` : '전체 결제 변경 이력 (최근 300건)';
    body.innerHTML = '<div class="loading">불러오는 중...</div>';
    overlay.style.display = 'flex';
    const { data, error } = await sb.rpc('rpc_admin_list_payment_history', {
      p_password: getAdminPassword(), p_student_code: code || null, p_limit: 300,
    });
    if (error) {
      const missing = error.code === 'PGRST202' || /Could not find the function/i.test(error.message || '');
      body.innerHTML = `<div class="empty">${missing ? '이력 기능 SQL(53)이 아직 실행되지 않았어요.' : '불러오지 못했어요: ' + histEsc(error.message)}</div>`;
      return;
    }
    if (!data || !data.length) { body.innerHTML = '<div class="empty">기록된 이력이 없어요.</div>'; return; }
    const cls = { '입력': 'act-in', '수정': 'act-mod', '취소': 'act-del', '기존기록': 'act-old' };
    body.innerHTML = data.map((h) => {
      const when = new Date(h.changed_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: '2-digit', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const month = h.billing_month ? Number(String(h.billing_month).slice(5, 7)) + '월분' : '';
      return `<div class="hist-item">
        <div class="t">${histEsc(when)}</div>
        <div><span class="act ${cls[h.action] || ''}">${histEsc(h.action)}</span>${code ? '' : '<b>' + histEsc(h.student_name || h.student_code) + '</b> '}${month}</div>
        <div>${histSummary(h)}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('hist-close').addEventListener('click', () => { document.getElementById('hist-overlay').style.display = 'none'; });
  document.getElementById('hist-overlay').addEventListener('click', (e) => { if (e.target.id === 'hist-overlay') e.currentTarget.style.display = 'none'; });
  document.getElementById('hist-all-btn').addEventListener('click', () => openHistory(null, null));
</script>

</body>
