<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석체크 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 8px; }
  .toolbar { display:flex; align-items:center; gap: 10px; margin-bottom: 18px; }
  .toolbar input[type="date"] { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--gray-200); }
  .toolbar select { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--gray-200); background:#fff; font-family:inherit; }
  .toolbar input[type="text"] { flex:1; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--gray-200); }
  .summary { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .student-row {
    display:flex; align-items:center; justify-content:space-between; gap: 10px; background:#fff;
    border:1px solid var(--gray-200); border-radius:12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .student-row .name { font-weight: 800; font-size: 14px; }
  .student-row .meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .status-btns { display:flex; gap: 6px; }
  .status-btns button {
    border: 1px solid var(--gray-200); background:#fff; border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .status-btns button.active[data-status="출석"] { background:#E8F5E9; border-color:#A5D6A7; color:#2E7D32; }
  .status-btns button.active[data-status="지각"] { background:#FFF3E0; border-color:#FFCC80; color:#B5651D; }
  .status-btns button.active[data-status="결석"] { background:#FDECEC; border-color:#F5B7B1; color:#C0392B; }
  .status-btns button.active[data-status="조퇴"] { background:#EEF2FF; border-color:#C5CAE9; color:#364293; }
  .status-btns button.active[data-status="보강"] { background:#E0F7FA; border-color:#80DEEA; color:#00838F; }
  .student-row { flex-wrap: wrap; }
  .memo-wrap { flex-basis:100%; }
  .memo-wrap input { width:100%; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--gray-200); font-family:inherit; }
  .memo-wrap input:focus { outline:none; border-color: var(--navy-900); }
  .memo-state { font-size:11px; color: var(--muted); margin-top:3px; min-height:13px; }
  .notice { background:#FFF7E6; border:1px solid #FFD591; color:#8A5A00; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.5; }
  .loading { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">출석체크</span>
</header>

<main>
  <h1>출석체크</h1>
  <div class="toolbar">
    <input type="date" id="attendance-date">
    <select id="grade-filter"><option value="">전체 학년</option></select>
    <input type="text" id="search-box" placeholder="이름으로 찾기">
  </div>
  <div id="notice"></div>
  <div class="summary" id="summary"></div>
  <div id="student-list"><div class="loading">불러오는 중...</div></div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireAdminAuth();

  const dateInput = document.getElementById('attendance-date');
  dateInput.value = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date()); // 한국 날짜

  let allStudents = [];
  let statusMap = {}; // student_code -> status
  let memoMap = {};   // student_code -> 메모
  let memoReady = true; // 메모 기능 SQL(45)이 DB에 있는지

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isMissingFn(error) {
    return error && (error.code === 'PGRST202' || /Could not find the function/i.test(error.message || ''));
  }

  async function loadStudents() {
    const { data, error } = await sb.rpc('rpc_admin_list_students', { p_password: getAdminPassword(), p_classroom: getAdminClassroom() });
    if (error) { console.error(error); return []; }
    // 학년(초→중→고) → 이름 순으로 정렬
    return (data || []).slice().sort((a, b) => {
      const g = compareGrades(a.grade, b.grade);
      return g !== 0 ? g : (a.student_name || '').localeCompare(b.student_name || '');
    });
  }

  async function loadAttendanceForDate(dateStr) {
    statusMap = {}; memoMap = {};
    let res = await sb.rpc('rpc_admin_list_attendance_v2', {
      p_password: getAdminPassword(), p_attendance_date: dateStr,
    });
    if (isMissingFn(res.error)) {
      // 메모 SQL이 아직 없으면 예전 방식(메모 없이)으로 동작
      memoReady = false;
      res = await sb.rpc('rpc_admin_list_attendance', {
        p_password: getAdminPassword(), p_attendance_date: dateStr,
      });
    } else {
      memoReady = true;
    }
    if (res.error) { console.error(res.error); return; }
    (res.data || []).forEach((row) => {
      statusMap[row.student_code] = row.status;
      if (row.memo) memoMap[row.student_code] = row.memo;
    });
  }

  function saveRow(code, name, status, memo) {
    if (memoReady) {
      return sb.rpc('rpc_admin_mark_attendance_v2', {
        p_password: getAdminPassword(),
        p_student_code: code,
        p_student_name: name,
        p_attendance_date: dateInput.value,
        p_status: status,
        p_checked_by: getAdminClassroom(),
        p_memo: memo || '',
      });
    }
    return sb.rpc('rpc_admin_mark_attendance', {
      p_password: getAdminPassword(),
      p_student_code: code,
      p_student_name: name,
      p_attendance_date: dateInput.value,
      p_status: status,
      p_checked_by: getAdminClassroom(),
    });
  }

  function needsMemo(status) { return !!status; } // 어떤 상태든 메모 칸 표시
  const MEMO_HINT = {
    '출석': '메모 (선택)',
    '지각': '사유 메모 (예: 20분 늦음, 학교 행사)',
    '조퇴': '사유 메모 (예: 병원, 학원 일정)',
    '결석': '사유 메모 (예: 아파서, 가족 행사)',
    '보강': '보강 메모 (예: 10/3 결석분 보강)',
  };

  function renderList() {
    const q = document.getElementById('search-box').value.trim();
    const listEl = document.getElementById('student-list');
    const gradeSel = document.getElementById('grade-filter').value;
    const filtered = allStudents.filter((s) =>
      matchesGrade(s.grade, gradeSel) && (!q || (s.student_name && s.student_name.includes(q))));

    document.getElementById('notice').innerHTML = memoReady ? '' :
      '<div class="notice">메모 칸과 보강 버튼을 쓰려면 안내드린 SQL(45, 보강 수정분 포함)을 먼저 실행해 주세요. 지금은 출석/지각/조퇴/결석 버튼만 저장돼요.</div>';

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="loading">학생이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = filtered.map((s) => {
      const current = statusMap[s.student_code] || '';
      const statuses = ['출석', '지각', '조퇴', '결석', '보강'];
      const showMemo = memoReady && needsMemo(current);
      return `
        <div class="student-row" data-row="${esc(s.student_code)}">
          <div>
            <div class="name">${esc(s.student_name)}</div>
            <div class="meta">${esc(s.grade || '')} · ${esc(s.student_code)}</div>
          </div>
          <div class="status-btns" data-code="${esc(s.student_code)}" data-name="${esc(s.student_name)}">
            ${statuses.map((st) => `<button type="button" data-status="${st}" class="${current === st ? 'active' : ''}">${st}</button>`).join('')}
          </div>
          ${showMemo ? `<div class="memo-wrap">
            <input type="text" maxlength="200" data-memo="${esc(s.student_code)}" value="${esc(memoMap[s.student_code] || '')}" placeholder="${esc(MEMO_HINT[current] || '메모')}">
            <div class="memo-state" data-memo-state="${esc(s.student_code)}"></div>
          </div>` : ''}
        </div>
      `;
    }).join('');

    updateSummary();

    listEl.querySelectorAll('.status-btns').forEach((wrap) => {
      wrap.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const code = wrap.dataset.code;
          const name = wrap.dataset.name;
          const status = btn.dataset.status;
          const prevStatus = statusMap[code];

          statusMap[code] = status;
          updateSummary();

          const { error } = await saveRow(code, name, status, memoMap[code] || '');
          if (error) {
            if (prevStatus) statusMap[code] = prevStatus; else delete statusMap[code];
            alert('저장 실패: ' + error.message);
          }
          renderList();
          if (!error && memoReady && needsMemo(status)) {
            const inp = listEl.querySelector(`[data-memo="${CSS.escape(code)}"]`);
            if (inp && !inp.value) inp.focus();
          }
        });
      });
    });

    // 메모는 입력칸을 벗어나거나 Enter를 누르면 저장
    listEl.querySelectorAll('input[data-memo]').forEach((inp) => {
      inp.addEventListener('change', async () => {
        const code = inp.dataset.memo;
        const row = allStudents.find((s) => s.student_code === code);
        const stateEl = listEl.querySelector(`[data-memo-state="${CSS.escape(code)}"]`);
        memoMap[code] = inp.value.trim(); // 곧바로 반영 (바로 이어서 상태 버튼을 눌러도 메모가 유지되게)
        stateEl.textContent = '저장 중...';
        const { error } = await saveRow(code, row ? row.student_name : '', statusMap[code], inp.value);
        if (error) { stateEl.textContent = '저장 실패: ' + error.message; return; }
        stateEl.textContent = '저장됨';
      });
    });
  }

  function updateSummary() {
    const counts = { 출석: 0, 지각: 0, 조퇴: 0, 결석: 0, 보강: 0 };
    const mine = new Set(allStudents.map((s) => s.student_code)); // 내 강의실 학생만 센다
    const myCodes = Object.keys(statusMap).filter((c) => mine.has(c));
    myCodes.forEach((c) => { const st = statusMap[c]; if (counts[st] !== undefined) counts[st]++; });
    const total = allStudents.length;
    const checked = myCodes.length;
    document.getElementById('summary').textContent =
      `전체 ${total}명 중 ${checked}명 체크 · 출석 ${counts.출석} · 지각 ${counts.지각} · 조퇴 ${counts.조퇴} · 결석 ${counts.결석} · 보강 ${counts.보강}`;
  }

  async function refresh() {
    document.getElementById('student-list').innerHTML = '<div class="loading">불러오는 중...</div>';
    await loadAttendanceForDate(dateInput.value);
    renderList();
  }

  document.getElementById('search-box').addEventListener('input', renderList);
  document.getElementById('grade-filter').addEventListener('change', renderList);
  dateInput.addEventListener('change', refresh);

  (async function init() {
    allStudents = await loadStudents();
    fillGradeFilter(document.getElementById('grade-filter'), allStudents.map((s) => s.grade));
    await refresh();
  })();
</script>

</body>
</html>
