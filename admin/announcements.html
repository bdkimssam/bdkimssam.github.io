<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지 작성 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 20px; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:24px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom: 28px; }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input, textarea {
    width:100%; font-size:14.5px; padding:11px 13px; border-radius:10px; border:1px solid var(--gray-200);
    margin-bottom:16px; font-family:inherit; background:#fff;
  }
  textarea { resize: vertical; min-height: 110px; }
  select:focus, input:focus, textarea:focus { outline:none; border-color: var(--navy-900); }
  button.submit { width:100%; padding:12px; border-radius:10px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; }
  button.submit:hover { background:#000; }
  .list-title { font-size: 14px; font-weight: 800; margin: 0 0 12px; }
  .notice-row { display:flex; justify-content:space-between; align-items:flex-start; gap: 12px; padding: 14px 0; border-top: 1px solid var(--gray-200); }
  .notice-row:first-child { border-top:none; }
  .notice-row .tag { display:inline-block; font-size:11px; font-weight:800; color:#3D4FA0; background:#EEF2FF; padding:2px 8px; border-radius: 999px; margin-bottom: 4px; }
  .notice-row .t { font-weight:700; font-size: 14px; }
  .notice-row .c { font-size: 13px; color: #374151; margin-top: 8px; white-space: pre-wrap; line-height: 1.7; background: var(--gray-50); border-radius: 10px; padding: 12px 14px; }
  .notice-row details { flex: 1; min-width: 0; }
  .notice-row summary { cursor: pointer; list-style: none; }
  .notice-row summary::-webkit-details-marker { display: none; }
  .notice-row summary .t::after { content: '\25BE'; margin-left: 6px; color: #98A1B3; font-size: 11px; }
  .notice-row details[open] summary .t::after { content: '\25B4'; }
  .notice-row .d { font-size: 11.5px; color: #98A1B3; margin-top: 4px; }
  .del-btn { flex-shrink:0; background:none; border:none; color:#C0392B; font-size:13px; cursor:pointer; padding: 4px 6px; }
  .loading { color: var(--muted); font-size: 13px; }
  .att-list { margin: -6px 0 16px; display:flex; flex-direction:column; gap:6px; }
  .att-item { display:flex; align-items:center; gap:8px; font-size:13px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:10px; padding:7px 10px; }
  .att-item img { width:40px; height:40px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .att-item .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att-item .sz { color:#98A1B3; font-size:11.5px; flex-shrink:0; }
  .att-item button { background:none; border:none; color:#C0392B; cursor:pointer; font-size:13px; }
  .hint { font-size:11.5px; color:#98A1B3; margin:-12px 0 12px; }
  button.cancel { width:100%; padding:11px; border-radius:10px; border:1px solid var(--gray-200); background:#fff; color:var(--ink); font-weight:800; font-size:14px; cursor:pointer; margin-top:8px; display:none; }
  .edit-btn { flex-shrink:0; background:none; border:none; color:#3D4FA0; font-size:13px; cursor:pointer; padding: 4px 6px; }
  .c .atts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .c .atts img { max-width:140px; max-height:140px; border-radius:8px; border:1px solid var(--gray-200); }
  .c .atts a.file { font-size:12.5px; font-weight:700; color:#3D4FA0; background:#EEF2FF; padding:6px 10px; border-radius:8px; text-decoration:none; }
  .clip { color:#98A1B3; font-size:11.5px; margin-left:6px; }
  .bell-btn { flex-shrink:0; background:none; border:none; color:#B45309; font-size:13px; cursor:pointer; padding: 4px 6px; }
  .sent-tag { display:inline-block; margin-left:6px; font-size:11px; font-weight:800; color:#047857; background:#D1FAE5; padding:1px 7px; border-radius:999px; }
  .modal-bg { position:fixed; inset:0; background:rgba(7,12,22,0.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal-bg.show { display:flex; }
  .modal { background:#fff; border-radius:16px; width:100%; max-width:440px; max-height:90vh; overflow:auto; padding:22px; }
  .modal h2 { font-size:17px; font-weight:900; margin:0 0 14px; }
  .modal .box { background:var(--gray-50); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.7; margin-bottom:14px; }
  .modal .warn { color:#B45309; }
  .modal .btns { display:flex; gap:8px; }
  .modal .btns button { flex:1; padding:12px; border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; border:1px solid var(--gray-200); background:#fff; color:var(--ink); }
  .modal .btns button.go { background:var(--navy-900); color:#fff; border-color:var(--navy-900); }
  .modal .btns button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">공지 작성</span>
</header>

<main>
  <div class="panel">
    <h1 id="form-title">새 공지 등록</h1>
    <form id="notice-form">
      <label for="target-grade">대상 학년</label>
      <select id="target-grade">
        <option value="전체">전체</option>
        <option value="초등">초등 전체</option>
        <option value="중등">중등 전체</option>
        <option value="고등">고등 전체</option>
        <option value="중고등">중고등 전체</option>
        <option value="초1">초1</option><option value="초2">초2</option><option value="초3">초3</option>
        <option value="초4">초4</option><option value="초5">초5</option><option value="초6">초6</option>
        <option value="중1">중1</option><option value="중2">중2</option><option value="중3">중3</option>
        <option value="고1">고1</option><option value="고2">고2</option><option value="고3">고3</option>
      </select>

      <label for="title">제목</label>
      <input type="text" id="title" placeholder="예: 내신 대비 보강 안내" required>
      <div style="font-size:11.5px; color:#98A1B3; margin:-12px 0 16px;">학부모 화면 목록에는 "[대상학년] 제목" 형태로 자동 표시됩니다. 제목에 직접 [ ] 안 넣으셔도 돼요.</div>

      <label for="content">내용</label>
      <textarea id="content" placeholder="공지 내용을 입력하세요" required></textarea>

      <label for="posted-date">작성일</label>
      <input type="date" id="posted-date" required>

      <label for="files">첨부 (이미지·파일)</label>
      <input type="file" id="files" multiple accept="image/*,.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.txt" style="margin-bottom:8px">
      <div class="hint">공지당 최대 5개, 파일 하나당 10MB까지. 사진은 자동으로 줄여서 올려요.</div>
      <div class="att-list" id="att-list"></div>

      <button type="submit" class="submit">등록하기</button>
      <button type="button" class="cancel" id="cancel-edit">수정 취소</button>
    </form>
  </div>

  <div class="panel">
    <div class="list-title">등록된 공지 목록</div>
    <div id="notice-list"><div class="loading">불러오는 중...</div></div>
  </div>
</main>

<div class="modal-bg" id="bell-modal">
  <div class="modal">
    <h2>알림톡 발송</h2>
    <div class="box" id="bell-notice"></div>
    <label for="bell-kind">템플릿</label>
    <select id="bell-kind"></select>
    <label for="bell-title">알림톡에 들어갈 제목 <span id="bell-count" style="font-weight:400;"></span></label>
    <input type="text" id="bell-title" maxlength="40" placeholder="예: 11/3(월) 중3 수업 보강">
    <div class="hint" style="margin-top:-10px;">핵심(날짜, 대상)을 한 줄로 적어 주세요. 최대 40자예요.</div>
    <div class="box" id="bell-preview">불러오는 중...</div>
    <div class="btns">
      <button type="button" id="bell-cancel">닫기</button>
      <button type="button" class="go" id="bell-send" disabled>발송하기</button>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  requireDirector();

  document.getElementById('posted-date').valueAsDate = new Date();

  function gradeLabel(g) {
    if (!g || g === '전체') return '전체';
    return g;
  }

  const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const MAX_FILES = 5, MAX_BYTES = 10 * 1024 * 1024;
  let items = [];        // 공지 목록
  let editingId = null;  // 수정 중인 공지 id
  let kept = [];         // 이미 올라가 있는 첨부 (수정 시)
  let newFiles = [];     // 이번에 새로 고른 파일

  const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
  const isImg = (a) => /^image\//.test(a.type || '');
  const dlUrl = (a) => a.url + (a.url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(a.name || 'file');

  // 사진은 가로·세로 1600px 이내 JPEG로 줄여서 올림 (핸드폰 사진이 너무 커서)
  async function shrinkImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 300 * 1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (e) { return file; }
  }

  function renderAtt() {
    const box = document.getElementById('att-list');
    const rows = [
      ...kept.map((a, i) => ({ a, i, kind: 'kept' })),
      ...newFiles.map((f, i) => ({ a: { name: f.name, size: f.size, type: f.type, file: f }, i, kind: 'new' })),
    ];
    box.innerHTML = rows.map((r) => {
      const thumb = isImg(r.a) ? `<img src="${r.kind === 'kept' ? esc(r.a.url) : URL.createObjectURL(r.a.file)}" alt="">` : '<i class="fa-solid fa-file" style="width:40px;text-align:center;color:#98A1B3"></i>';
      return `<div class="att-item">${thumb}<span class="n">${esc(r.a.name)}</span><span class="sz">${r.a.size ? fmtSize(r.a.size) : ''}</span><button type="button" data-k="${r.kind}" data-i="${r.i}" title="빼기"><i class="fa-solid fa-xmark"></i></button></div>`;
    }).join('');
  }
  document.getElementById('att-list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    (b.dataset.k === 'kept' ? kept : newFiles).splice(+b.dataset.i, 1);
    renderAtt();
  });
  document.getElementById('files').addEventListener('change', async (e) => {
    const picked = Array.from(e.target.files || []); e.target.value = '';
    for (const f of picked) {
      if (kept.length + newFiles.length >= MAX_FILES) { alert(`첨부는 공지당 최대 ${MAX_FILES}개까지예요.`); break; }
      const g = await shrinkImage(f);
      if (g.size > MAX_BYTES) { alert(`"${f.name}" 은(는) 10MB가 넘어서 올릴 수 없어요.`); continue; }
      newFiles.push(g);
    }
    renderAtt();
  });

  function resetForm() {
    editingId = null; kept = []; newFiles = [];
    document.getElementById('notice-form').reset();
    document.getElementById('posted-date').valueAsDate = new Date();
    document.getElementById('form-title').textContent = '새 공지 등록';
    document.querySelector('#notice-form button.submit').textContent = '등록하기';
    document.getElementById('cancel-edit').style.display = 'none';
    renderAtt();
  }
  function startEdit(id) {
    const it = items.find((x) => x.id === id); if (!it) return;
    editingId = id; kept = (it.attachments || []).slice(); newFiles = [];
    document.getElementById('target-grade').value = it.target_grade || '전체';
    document.getElementById('title').value = it.title || '';
    document.getElementById('content').value = it.content || '';
    document.getElementById('posted-date').value = it.posted_date || '';
    document.getElementById('form-title').textContent = '공지 수정';
    document.querySelector('#notice-form button.submit').textContent = '수정 저장';
    document.getElementById('cancel-edit').style.display = 'block';
    renderAtt();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.getElementById('cancel-edit').addEventListener('click', resetForm);

  async function uploadAll() {
    const out = [];
    for (const f of newFiles) {
      const ext = ((f.name.match(/\.([A-Za-z0-9]{1,8})$/) || [])[1] || (f.type.split('/')[1] || 'bin')).toLowerCase();
      const path = `ann/${crypto.randomUUID()}.${ext}`;
      const { error } = await sb.storage.from('announcement-files').upload(path, f, { upsert: false, contentType: f.type || undefined });
      if (error) throw new Error(/bucket/i.test(error.message || '') ? '첨부 저장소가 아직 없어요. 안내드린 SQL(74번)을 먼저 실행해 주세요.' : '파일 올리기 실패: ' + error.message);
      const { data } = sb.storage.from('announcement-files').getPublicUrl(path);
      out.push({ name: f.name, url: data.publicUrl, type: f.type || '', size: f.size });
    }
    return out;
  }

  // ---- 알림톡 발송 ----
  let sentMap = {};
  let bellId = null;
  let bellTemplates = null;
  const fmtSent = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  function sentTag(id) {
    const s = sentMap[id];
    return s ? `<span class="sent-tag">알림톡 ${s.recipients}명 · ${fmtSent(s.created_at)}</span>` : '';
  }
  const bellErr = (error) => {
    const missing = error && (error.code === 'PGRST202' || /Could not find the function/i.test(error.message || ''));
    return missing ? '알림톡 SQL(90)이 아직 실행되지 않았어요.' : (error.message || '');
  };
  function closeBell() { document.getElementById('bell-modal').classList.remove('show'); bellId = null; }
  document.getElementById('bell-cancel').addEventListener('click', closeBell);
  document.getElementById('bell-modal').addEventListener('click', (e) => { if (e.target.id === 'bell-modal') closeBell(); });
  document.getElementById('bell-title').addEventListener('input', (e) => {
    document.getElementById('bell-count').textContent = `(${e.target.value.length}/40)`;
  });

  async function openBell(id) {
    const it = items.find((x) => x.id === id); if (!it) return;
    bellId = id;
    const previewEl = document.getElementById('bell-preview');
    const sendBtn = document.getElementById('bell-send');
    sendBtn.disabled = true;
    previewEl.textContent = '불러오는 중...';
    document.getElementById('bell-notice').innerHTML = `<b>[${esc(gradeLabel(it.target_grade))}]</b> ${esc(it.title)}`;
    const t = document.getElementById('bell-title');
    t.value = (it.title || '').slice(0, 40);
    document.getElementById('bell-count').textContent = `(${t.value.length}/40)`;
    document.getElementById('bell-modal').classList.add('show');

    if (!bellTemplates) {
      const tr = await sb.rpc('rpc_admin_notice_templates', { p_password: getAdminPassword() });
      if (tr.error) { previewEl.innerHTML = `<span class="warn">${esc(bellErr(tr.error))}</span>`; return; }
      bellTemplates = tr.data || [];
    }
    const kindSel = document.getElementById('bell-kind');
    kindSel.innerHTML = bellTemplates.map((x) => `<option value="${esc(x.kind)}" ${x.enabled ? '' : 'disabled'}>${esc(x.label)}${x.enabled ? '' : ' (승인 대기)'}</option>`).join('');
    const firstOk = bellTemplates.find((x) => x.enabled && x.kind !== 'special');
    if (firstOk) kindSel.value = firstOk.kind;

    const pr = await sb.rpc('rpc_admin_notice_preview', { p_password: getAdminPassword(), p_announcement_id: id });
    if (pr.error) { previewEl.innerHTML = `<span class="warn">${esc(bellErr(pr.error))}</span>`; return; }
    const p = pr.data || {};
    let html = `받는 사람: <b>[${esc(gradeLabel(p.target))}] 학부모 ${p.phones || 0}명</b> (학생 ${p.students || 0}명, 같은 번호는 한 번만 보내요)`;
    if ((p.no_phone || []).length) html += `<br><span class="warn">번호가 없어 못 받는 학생 ${p.no_phone.length}명: ${esc(p.no_phone.join(', '))}</span>`;
    if (p.last) html += `<br><span class="warn">이미 ${fmtSent(p.last.created_at)}에 ${p.last.recipients}명에게 발송했어요.</span>`;
    previewEl.innerHTML = html;
    sendBtn.disabled = !(p.phones > 0) || !firstOk;
  }

  document.getElementById('bell-send').addEventListener('click', async () => {
    if (!bellId) return;
    const kind = document.getElementById('bell-kind').value;
    const title = document.getElementById('bell-title').value.trim();
    if (!title) { alert('알림톡에 들어갈 제목을 입력해 주세요.'); return; }
    const phones = (document.getElementById('bell-preview').textContent.match(/학부모 (\d+)명/) || [])[1] || '?';
    if (!confirm(`학부모 ${phones}명에게 알림톡을 보냅니다.\n\n제목: ${title}\n\n보낼까요? (보내면 취소할 수 없어요)`)) return;
    const btn = document.getElementById('bell-send');
    btn.disabled = true; btn.textContent = '발송 중...';
    const { data, error } = await sb.rpc('rpc_admin_send_notice_alimtalk', {
      p_password: getAdminPassword(), p_announcement_id: bellId, p_kind: kind, p_title: title,
    });
    btn.textContent = '발송하기';
    if (error) { alert('발송 실패: ' + bellErr(error)); btn.disabled = false; return; }
    alert(`알림톡 ${data.sent}명에게 발송을 요청했어요.` + (data.no_phone ? `\n번호가 없는 학생 ${data.no_phone}명은 제외됐어요.` : ''));
    closeBell();
    loadList();
  });

  async function loadList() {
    const listEl = document.getElementById('notice-list');
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';

    const { data, error } = await sb.rpc('rpc_admin_list_announcements', { p_password: getAdminPassword() });
    if (error) {
      console.error(error);
      listEl.innerHTML = '<div class="loading">목록을 불러오지 못했습니다.</div>';
      return;
    }
    items = data || [];
    if (items.length === 0) {
      listEl.innerHTML = '<div class="loading">등록된 공지가 없습니다.</div>';
      return;
    }

    // 알림톡 발송 기록 (SQL 90 전에는 조용히 건너뜀)
    sentMap = {};
    const st = await sb.rpc('rpc_admin_notice_status', { p_password: getAdminPassword() });
    if (!st.error) (st.data || []).forEach((r) => { sentMap[r.announcement_id] = r; });

    listEl.innerHTML = items.map((item) => {
      const atts = item.attachments || [];
      const attHtml = atts.length ? `<div class="atts">${atts.map((a) => isImg(a)
        ? `<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="${esc(a.name)}"></a>`
        : `<a class="file" href="${esc(dlUrl(a))}">📎 ${esc(a.name)}</a>`).join('')}</div>` : '';
      return `
      <div class="notice-row">
        <details>
          <summary>
            <span class="tag">[${esc(gradeLabel(item.target_grade))}]</span>
            <div class="t">${esc(item.title)}${atts.length ? `<span class="clip"><i class="fa-solid fa-paperclip"></i> ${atts.length}</span>` : ''}</div>
            <div class="d">${esc(item.posted_date || '')}${sentTag(item.id)}</div>
          </summary>
          <div class="c">${esc(item.content || '(내용 없음)')}${attHtml}</div>
        </details>
        <button class="bell-btn" data-bell="${esc(item.id)}" title="알림톡 발송"><i class="fa-solid fa-bell"></i></button>
        <button class="edit-btn" data-edit="${esc(item.id)}" title="수정"><i class="fa-solid fa-pen"></i></button>
        <button class="del-btn" data-id="${esc(item.id)}"><i class="fa-solid fa-trash"></i></button>
      </div>`;
    }).join('');

    listEl.querySelectorAll('.edit-btn').forEach((btn) => btn.addEventListener('click', () => startEdit(btn.dataset.edit)));
    listEl.querySelectorAll('.bell-btn').forEach((btn) => btn.addEventListener('click', () => openBell(btn.dataset.bell)));
    listEl.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 공지를 삭제할까요?')) return;
        const { error: delErr } = await sb.rpc('rpc_admin_delete_announcement', {
          p_password: getAdminPassword(), p_id: btn.dataset.id,
        });
        if (delErr) { alert('삭제 실패: ' + delErr.message); return; }
        if (editingId === btn.dataset.id) resetForm();
        loadList();
      });
    });
  }

  document.getElementById('notice-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const label = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    try {
      const uploaded = await uploadAll();
      const attachments = kept.concat(uploaded);
      const common = {
        p_password: getAdminPassword(),
        p_title: document.getElementById('title').value.trim(),
        p_content: document.getElementById('content').value.trim(),
        p_target_grade: document.getElementById('target-grade').value,
        p_posted_date: document.getElementById('posted-date').value,
      };
      let res;
      if (editingId) res = await sb.rpc('rpc_admin_update_announcement', { ...common, p_id: editingId, p_attachments: attachments });
      else if (attachments.length) res = await sb.rpc('rpc_admin_add_announcement', { ...common, p_attachments: attachments });
      else res = await sb.rpc('rpc_admin_add_announcement', common);   // 첨부 없는 공지는 예전 방식 그대로
      if (res.error) {
        const missing = res.error.code === 'PGRST202' || /Could not find the function/i.test(res.error.message || '');
        throw new Error(missing ? '첨부·수정 기능 SQL(74번)이 DB에 아직 없어요. 안내드린 SQL을 먼저 실행해 주세요.' : res.error.message);
      }
      resetForm();
      loadList();
    } catch (err) {
      alert((editingId ? '수정 실패: ' : '등록 실패: ') + err.message);
      submitBtn.textContent = label;
    }
    submitBtn.disabled = false;
  });

  renderAtt();
  loadList();
</script>

</body>
</html>
