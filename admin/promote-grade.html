<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학년 일괄 진급 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 8px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:24px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); margin-bottom: 24px; }
  .warn-box {
    background:#FFF3E0; border:1px solid #FFCC80; color:#B5651D; border-radius:12px; padding:14px 16px;
    font-size:13px; line-height:1.6; margin-bottom:20px;
  }
  table { width:100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { text-align:left; padding: 9px 6px; font-size: 13.5px; border-top: 1px solid var(--gray-200); }
  th { color: var(--muted); font-weight:700; font-size:12px; border-top:none; }
  td.arrow { color: var(--muted); text-align:center; width: 30px; }
  td.count { text-align:right; font-weight:800; }
  button.preview-btn, button.confirm-btn {
    width:100%; padding:12px; border-radius:10px; border:none; font-weight:800; font-size:14.5px; cursor:pointer;
  }
  button.preview-btn { background:var(--navy-900); color:#fff; }
  button.preview-btn:hover { background:#000; }
  button.confirm-btn { background:#C0392B; color:#fff; margin-top:10px; }
  button.confirm-btn:hover { background:#A93226; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .loading { color: var(--muted); font-size: 13px; }
  .done-msg { background:#E8F5E9; border:1px solid #A5D6A7; color:#2E7D32; border-radius:12px; padding:14px 16px; font-size:13.5px; font-weight:700; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">학년 일괄 진급</span>
</header>

<main>
  <h1>전체 학생 학년 올리기</h1>
  <p class="sub">전체 학생의 학년을 한 단계씩 올립니다. 초6은 중1로, 중3은 고1로, 고3은 "졸업"으로 바뀝니다. <b>되돌릴 수 없으니</b> 먼저 미리보기로 확인한 다음 진행해주세요.</p>

  <div class="warn-box">
    <i class="fa-solid fa-triangle-exclamation"></i> 이 작업은 되돌릴 수 없습니다. 학기 시작 등 꼭 필요한 시점에만 실행해주세요.
  </div>

  <div class="panel">
    <button type="button" class="preview-btn" id="preview-btn">미리보기 불러오기</button>
    <div id="preview-area" style="margin-top:20px;"></div>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireDirector();

  document.getElementById('preview-btn').addEventListener('click', loadPreview);

  async function loadPreview() {
    const area = document.getElementById('preview-area');
    area.innerHTML = '<div class="loading">불러오는 중...</div>';

    const { data, error } = await sb.rpc('rpc_admin_grade_promotion_preview', { p_password: getAdminPassword() });
    if (error) {
      area.innerHTML = '<div class="loading">미리보기를 불러오지 못했습니다: ' + error.message + '</div>';
      return;
    }
    if (!data || data.length === 0) {
      area.innerHTML = '<div class="loading">진급 대상 학년 데이터가 없습니다.</div>';
      return;
    }

    const totalCount = data.reduce((sum, r) => sum + Number(r.student_count), 0);

    area.innerHTML = `
      <table>
        <tr><th>현재 학년</th><th></th><th>다음 학년</th><th style="text-align:right;">인원</th></tr>
        ${data.map((r) => `
          <tr>
            <td>${r.current_grade}</td>
            <td class="arrow"><i class="fa-solid fa-arrow-right"></i></td>
            <td>${r.next_grade}</td>
            <td class="count">${r.student_count}명</td>
          </tr>
        `).join('')}
      </table>
      <button type="button" class="confirm-btn" id="confirm-btn">총 ${totalCount}명 진급 확정하기</button>
    `;

    document.getElementById('confirm-btn').addEventListener('click', async () => {
      if (!confirm(`정말로 전체 ${totalCount}명의 학년을 올릴까요? 이 작업은 되돌릴 수 없습니다.`)) return;

      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;
      btn.textContent = '처리 중...';

      const { data: updated, error: promoteError } = await sb.rpc('rpc_admin_promote_all_grades', { p_password: getAdminPassword() });
      if (promoteError) {
        alert('진급 처리 실패: ' + promoteError.message);
        btn.disabled = false;
        btn.textContent = `총 ${totalCount}명 진급 확정하기`;
        return;
      }

      area.innerHTML = `<div class="done-msg"><i class="fa-solid fa-circle-check"></i> ${updated}명 진급 처리 완료되었습니다.</div>`;
    });
  }
</script>

</body>
</html>
