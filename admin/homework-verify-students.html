<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제인증 학생별 교재 배정 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 8px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; line-height:1.6; }
  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .toolbar label { font-size:13px; font-weight:700; color: var(--muted); }
  select.grade-filter {
    flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--gray-200); background:#fff;
    font-size:14px; font-family:inherit; color: var(--ink);
  }
  .count-badge { font-size:12px; color: var(--muted); font-weight:700; white-space:nowrap; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; overflow:hidden; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:center; padding: 10px 6px; font-size: 12.5px; border-top: 1px solid var(--gray-200); }
  th { color: var(--muted); font-weight:700; font-size:11.5px; border-top:none; background:var(--gray-50); }
  th.name-col, td.name-col { text-align:left; padding-left:14px; white-space:nowrap; }
  td.name-col .name { font-weight:700; }
  td.name-col .meta { font-size:10.5px; color:var(--muted); }
  input.assign-check { width:17px; height:17px; cursor:pointer; }
  input.assign-check.saving { opacity:0.4; }
  .loading, .empty { color: var(--muted); font-size: 13px; padding: 30px 6px; text-align:center; }
  .scroll-wrap { overflow-x:auto; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">숙제인증 학생별 교재 배정</span>
</header>

<main>
  <h1>학생별 교재 배정</h1>
  <p class="sub">학생마다 체크한 교재가 숙제 인증 대상이 됩니다. 한 학생이 교재 여러 권을 체크할 수 있어요. (교재/범위는 "숙제인증 교재/범위" 화면에서 먼저 등록해 주세요)</p>

  <div class="toolbar">
    <label for="grade-filter">학년</label>
    <select class="grade-filter" id="grade-filter">
      <option value="">전체</option>
      <option value="중3">중3</option>
      <option value="고1">고1</option>
      <option value="고2">고2</option>
      <option value="고3">고3</option>
    </select>
    <span class="count-badge" id="count-badge"></span>
  </div>

  <div class="panel scroll-wrap">
    <table id="assign-table" style="display:none;">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="loading" id="status-area">불러오는 중...</div>
  </div>
</main>

<script src="../assets/js/supabase-client.js?v=20261009a"></script>
<script>
  requireDirector();

  let allStudents = [];
  let allTextbooks = [];
  let assignedPairs = new Set(); // `${student_code}::${textbook_id}`

  async function loadAll() {
    const statusArea = document.getElementById('status-area');
    const [studentsRes, textbooksRes, pairsRes] = await Promise.all([
      sb.rpc('rpc_admin_list_all_students', { p_password: getAdminPassword(), p_include_withdrawn: false }),
      sb.rpc('rpc_admin_list_homework_textbooks', { p_password: getAdminPassword() }),
      sb.rpc('rpc_admin_list_student_textbooks', { p_password: getAdminPassword() }),
    ]);

    if (studentsRes.error) { statusArea.textContent = '학생 목록을 불러오지 못했습니다: ' + studentsRes.error.message; return; }
    if (textbooksRes.error) { statusArea.textContent = '교재 목록을 불러오지 못했습니다: ' + textbooksRes.error.message; return; }
    if (pairsRes.error) { statusArea.textContent = '배정 목록을 불러오지 못했습니다: ' + pairsRes.error.message; return; }

    allStudents = studentsRes.data || [];
    allTextbooks = textbooksRes.data || [];
    assignedPairs = new Set((pairsRes.data || []).map((p) => `${p.student_code}::${p.textbook_id}`));

    if (allTextbooks.length === 0) {
      statusArea.textContent = '등록된 교재가 없습니다. "숙제인증 교재/범위" 화면에서 먼저 교재를 등록해 주세요.';
      return;
    }

    render();
  }

  function render() {
    const grade = document.getElementById('grade-filter').value;
    const filtered = (grade ? allStudents.filter((s) => s.grade === grade) : allStudents.slice())
      .filter((s) => ['중3', '고1', '고2', '고3'].includes(s.grade))
      .sort((a, b) => {
        const cmp = compareGrades(a.grade, b.grade);
        if (cmp !== 0) return cmp;
        return (a.student_name || '').localeCompare(b.student_name || '', 'ko');
      });

    const table = document.getElementById('assign-table');
    const statusArea = document.getElementById('status-area');
    const assignedCount = filtered.filter((s) => [...assignedPairs].some((p) => p.startsWith(s.student_code + '::'))).length;
    document.getElementById('count-badge').textContent = filtered.length ? `${filtered.length}명 중 ${assignedCount}명 배정됨` : '';

    if (filtered.length === 0) {
      table.style.display = 'none';
      statusArea.style.display = 'block';
      statusArea.textContent = '해당하는 학생이 없습니다. (중3~고3만 표시됩니다)';
      return;
    }

    table.style.display = 'table';
    statusArea.style.display = 'none';

    document.getElementById('table-head').innerHTML =
      '<th class="name-col">학생</th>' + allTextbooks.map((t) => `<th>${t.textbook_name}</th>`).join('');

    document.getElementById('table-body').innerHTML = filtered.map((s) => `
      <tr>
        <td class="name-col">
          <div class="name">${s.student_name || ''}</div>
          <div class="meta">${s.grade || '-'} · ${s.student_code}</div>
        </td>
        ${allTextbooks.map((t) => `
          <td>
            <input type="checkbox" class="assign-check"
              data-code="${s.student_code}" data-name="${s.student_name || ''}" data-grade="${s.grade || ''}" data-textbook="${t.id}"
              ${assignedPairs.has(`${s.student_code}::${t.id}`) ? 'checked' : ''}>
          </td>
        `).join('')}
      </tr>
    `).join('');

    document.querySelectorAll('.assign-check').forEach((cb) => {
      cb.addEventListener('change', async () => {
        cb.disabled = true;
        cb.classList.add('saving');
        const { error } = await sb.rpc('rpc_admin_set_student_textbook', {
          p_password: getAdminPassword(),
          p_student_code: cb.dataset.code,
          p_student_name: cb.dataset.name,
          p_grade: cb.dataset.grade,
          p_textbook_id: cb.dataset.textbook,
          p_assigned: cb.checked,
        });
        cb.disabled = false;
        cb.classList.remove('saving');
        if (error) { alert('저장 실패: ' + error.message); cb.checked = !cb.checked; return; }
        const key = `${cb.dataset.code}::${cb.dataset.textbook}`;
        if (cb.checked) assignedPairs.add(key); else assignedPairs.delete(key);
        render();
      });
    });
  }

  document.getElementById('grade-filter').addEventListener('change', render);

  loadAll();
</script>

</body>
</html>
