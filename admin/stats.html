<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 | 관리자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://reuzxqlhncwrwswadbvn.supabase.co" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  :root { --navy-950:#0A0A0A; --navy-900:#161616; --ink:#161616; --muted:#5C5C5C; --gray-50:#F2F2F2; --gray-200:#E5E5E5; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; justify-content:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; display:flex; flex-direction:column; gap:18px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0; line-height:1.6; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:22px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  .panel h2 { font-size:15px; font-weight:900; margin:0 0 14px; }
  .panel h2 .hint { font-size:12px; font-weight:600; color:var(--muted); margin-left:7px; }

  /* 큰 숫자 카드 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
  .stat { background:var(--gray-50); border-radius:12px; padding:16px; text-align:center; }
  .stat .v { font-size:24px; font-weight:900; line-height:1.2; }
  .stat .v small { font-size:14px; font-weight:800; margin-left:1px; }
  .stat .k { font-size:12px; color:var(--muted); font-weight:700; margin-top:5px; }
  .stat.accent .v { color:#0A0A0A; }

  /* 가로 막대 */
  .bars { display:flex; flex-direction:column; gap:9px; }
  .bar-row { display:grid; grid-template-columns:92px 1fr 62px; align-items:center; gap:10px; font-size:13px; }
  .bar-row .lbl { font-weight:700; color:var(--ink); }
  .bar-track { display:block; background:var(--gray-200); border-radius:3px; height:14px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background:#161616; border-radius:3px; min-width:2px; }
  .bar-fill.green { background:#161616; }
  .bar-row .val { text-align:right; color:var(--muted); font-weight:700; font-size:12.5px; }
  .bar-row.share { grid-template-columns:150px 1fr 92px; }

  /* 월별 입회·퇴원 */
  /* 연도 표 + 클릭하면 월별 펼침 */
  table.yt { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.yt th { text-align:right; font-size:12px; color:var(--muted); font-weight:700; padding:0 0 8px; border-bottom:1px solid var(--gray-200); }
  table.yt th:first-child { text-align:left; }
  table.yt td { padding:11px 0; border-bottom:1px solid var(--gray-200); text-align:right; }
  table.yt td:first-child { text-align:left; font-weight:800; }
  table.yt tr.yrow { cursor:pointer; }
  table.yt tr.yrow:hover td { background:var(--gray-50); }
  table.yt tr.yrow.open td:first-child::after { content:' ▾'; color:var(--muted); font-weight:700; }
  table.yt tr.yrow td:first-child::after { content:' ▸'; color:var(--muted); font-weight:700; }
  table.yt .net { color:var(--muted); }
  table.yt tr.detail > td { padding:0; border-bottom:1px solid var(--gray-200); }
  .mgrid { display:grid; grid-template-columns:48px repeat(12, 1fr); font-size:12px; padding:12px 0 14px; }
  .mgrid div { text-align:center; padding:4px 0; }
  .mgrid .rh { text-align:left; color:var(--muted); font-weight:700; }
  .mgrid .mh { color:var(--muted); font-weight:700; }
  .mgrid .zero { color:#C9C9C9; }
  .mgrid .inn { font-weight:800; }
  .mgrid .out { font-weight:800; color:var(--muted); }

  .note { font-size:12.5px; color:var(--muted); background:var(--gray-50); border:1px solid var(--gray-200); border-radius:10px; padding:11px 13px; line-height:1.65; }
  .loading { text-align:center; color:var(--muted); font-size:13.5px; padding:30px 0; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← 관리자 홈</a>
  <div class="brand">통계</div>
</header>

<main>
  <div>
    <h1>학원 통계</h1>
    <p class="sub">재원 기간과 학생 구성이에요. 첫 등원일을 기준으로 계산해요.</p>
  </div>

  <div id="content"><div class="loading">불러오는 중...</div></div>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="../assets/js/supabase-client.js?v=20261009b"></script>
<script>
  const el = (id) => document.getElementById(id);

  // 개월 수를 "2년 3개월"로
  function monthsText(m) {
    if (m === null || m === undefined) return '-';
    const y = Math.floor(m / 12), mm = m % 12;
    if (m === 0) return '0개월';
    return y > 0 ? (mm > 0 ? `${y}년 ${mm}개월` : `${y}년`) : `${mm}개월`;
  }
  const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);

  // 비율 막대: 전체 대비 몇 %인지 함께 보여줘요
  function shareRows(items, labelKey, total, color = '') {
    if (!items || !items.length) return '<p class="sub">자료가 없어요.</p>';
    return `<div class="bars">${items.map((i) => `
      <div class="bar-row share">
        <span class="lbl">${i[labelKey]}</span>
        <span class="bar-track"><span class="bar-fill ${color}" style="width:${pct(i.n, total)}%"></span></span>
        <span class="val">${i.n}명 · ${pct(i.n, total)}%</span>
      </div>`).join('')}</div>`;
  }

  // 연도별 표. 연도를 누르면 그 해 월별이 펼쳐져요
  function monthChart(rows) {
    if (!rows || !rows.length) return '<p class="sub">자료가 없어요.</p>';

    const byYear = new Map();
    rows.forEach((r) => {
      const [y, m] = r.month.split('-');
      if (!byYear.has(y)) byYear.set(y, new Map());
      byYear.get(y).set(Number(m), r);
    });
    const years = [...byYear.keys()].sort((a, b) => b.localeCompare(a));   // 최근 연도부터
    const num = (n) => (n ? `${n}` : '<span class="zero">·</span>');

    return `
      <table class="yt">
        <thead><tr><th>연도</th><th>입회</th><th>퇴원</th><th>순증</th></tr></thead>
        <tbody>
          ${years.map((y) => {
            const mm = byYear.get(y);
            const sumIn = [...mm.values()].reduce((a, r) => a + r.joined, 0);
            const sumOut = [...mm.values()].reduce((a, r) => a + r.left, 0);
            const net = sumIn - sumOut;
            const months = Array.from({ length: 12 }, (_, i) => i + 1);
            return `
              <tr class="yrow" data-year="${y}"><td>${y}년</td><td>${sumIn}</td><td>${sumOut}</td>
                  <td class="net">${net > 0 ? '+' : ''}${net}</td></tr>
              <tr class="detail" data-year="${y}" hidden><td colspan="4">
                <div class="mgrid">
                  <div class="rh"></div>${months.map((m) => `<div class="mh">${m}</div>`).join('')}
                  <div class="rh">입회</div>${months.map((m) => `<div class="inn">${num(mm.get(m)?.joined || 0)}</div>`).join('')}
                  <div class="rh">퇴원</div>${months.map((m) => `<div class="out">${num(mm.get(m)?.left || 0)}</div>`).join('')}
                </div>
              </td></tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function render(d) {
    const c = d.counts, a = d.avg_months, l = d.loyalty;
    const missing = (c.active_no_date || 0) + (c.withdrawn_no_date || 0);

    el('content').innerHTML = `
      <div class="panel">
        <h2>한눈에 보기 <span class="hint">${d.as_of} 기준</span></h2>
        <div class="cards">
          <div class="stat"><div class="v">${c.active}<small>명</small></div><div class="k">재원생</div></div>
          <div class="stat accent"><div class="v">${monthsText(a.active)}</div><div class="k">평균 재원 기간</div></div>
          <div class="stat"><div class="v">${pct(l.over_1y, l.total)}<small>%</small></div><div class="k">1년 이상 (${l.over_1y}명)</div></div>
          <div class="stat"><div class="v">${pct(l.over_2y, l.total)}<small>%</small></div><div class="k">2년 이상 (${l.over_2y}명)</div></div>
          <div class="stat"><div class="v">${pct(l.over_3y, l.total)}<small>%</small></div><div class="k">3년 이상 (${l.over_3y}명)</div></div>
        </div>
        ${missing > 0 ? `<div class="note" style="margin-top:14px;">첫 등원일이 없는 ${missing}명은 기간 계산에서 빠졌어요.</div>` : ''}
      </div>

      <div class="panel">
        <h2>구분별 평균 재원 기간 <span class="hint">재원생</span></h2>
        ${d.avg_by_type.length
          ? `<div class="bars">${d.avg_by_type.map((t) => {
              const max = Math.max(1, ...d.avg_by_type.map((x) => x.avg_months));
              return `<div class="bar-row">
                <span class="lbl">${t.type} <span style="color:var(--muted);font-weight:600;">${t.n}명</span></span>
                <span class="bar-track"><span class="bar-fill" style="width:${Math.round((t.avg_months / max) * 100)}%"></span></span>
                <span class="val">${monthsText(t.avg_months)}</span>
              </div>`;
            }).join('')}</div>`
          : '<p class="sub">자료가 없어요.</p>'}
      </div>

      <div class="panel">
        <h2>초 · 중 · 고 비율 <span class="hint">재원생 ${c.active}명</span></h2>
        ${shareRows(d.by_type, 'type', c.active)}
      </div>

      <div class="panel">
        <h2>학교별 비율 <span class="hint">재원생 ${c.active}명</span></h2>
        ${shareRows(d.by_school, 'school', c.active)}
      </div>

      <div class="panel">
        <h2>재원 기간 분포 <span class="hint">재원생 ${l.total}명</span></h2>
        ${shareRows(d.buckets, 'label', l.total)}
      </div>

      <div class="panel">
        <h2>월별 입회 · 퇴원 <span class="hint">연도별</span></h2>
        ${monthChart(d.monthly_all || d.monthly)}
      </div>

      <div class="panel">
        <h2>학년별 인원 <span class="hint">재원생</span></h2>
        ${shareRows(d.by_grade, 'grade', c.active, 'green')}
      </div>

      <div class="panel">
        <h2>강의실별 인원 <span class="hint">재원생</span></h2>
        ${shareRows(d.by_room, 'room', c.active, 'green')}
      </div>

      <div class="panel">
        <h2>퇴원생 <span class="hint">참고</span></h2>
        <div class="cards">
          <div class="stat"><div class="v">${c.withdrawn}<small>명</small></div><div class="k">지금까지 퇴원</div></div>
          <div class="stat"><div class="v">${a.withdrawn != null ? monthsText(a.withdrawn) : '-'}</div><div class="k">평균 재원 기간 (${a.withdrawn_n}명 기준)</div></div>
        </div>
      </div>
    `;

    // 연도 줄을 누르면 그 해 월별이 펼쳐져요
    document.querySelectorAll('tr.yrow').forEach((tr) => {
      tr.addEventListener('click', () => {
        const y = tr.dataset.year;
        const detail = document.querySelector(`tr.detail[data-year="${y}"]`);
        const open = !detail.hidden;
        detail.hidden = open;
        tr.classList.toggle('open', !open);
      });
    });
  }

  // supabase 라이브러리는 아래쪽에서 defer 로 받아오니까, 다 준비된 뒤에 시작해요
  document.addEventListener('DOMContentLoaded', async () => {
    requireDirector();
    const pw = getAdminPassword();
    const [main, months] = await Promise.all([
      sb.rpc('rpc_admin_stats_enrollment', { p_password: pw }),
      sb.rpc('rpc_admin_stats_monthly', { p_password: pw }),
    ]);
    if (main.error) {
      el('content').innerHTML = `<div class="panel"><p class="sub">불러오지 못했어요: ${main.error.message}</p></div>`;
      return;
    }
    const data = main.data;
    if (!months.error) data.monthly_all = months.data;
    render(data);
  });
</script>
</body>
</html>
