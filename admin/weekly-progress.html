<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간진도표 입력 | 관리자</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background: var(--navy-950); color:#fff; padding: 18px 20px; display:flex; align-items:center; gap:14px; }
  a.back { color: rgba(255,255,255,0.7); font-size:13px; text-decoration:none; }
  .brand { font-weight:800; font-size:15px; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 19px; font-weight: 900; margin: 0 0 20px; }
  .panel { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:24px; box-shadow: 0 8px 24px rgba(11,18,32,0.05); }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  select, input, textarea {
    width:100%; font-size:14.5px; padding:11px 13px; border-radius:10px; border:1px solid var(--gray-200);
    margin-bottom:16px; font-family:inherit; background:#fff;
  }
  textarea { resize: vertical; min-height: 90px; }
  select:focus, input:focus, textarea:focus { outline:none; border-color: var(--navy-900); }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.submit { width:100%; padding:12px; border-radius:10px; border:none; background:var(--navy-900); color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; }
  button.submit:hover { background:#000; }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 11.5px; color: #98A1B3; margin: -12px 0 16px; }
  .book-block { border:1px solid var(--gray-200); border-radius:12px; padding:14px 14px 2px; margin-bottom:16px; }
  .book-block .book-title { font-size:13px; font-weight:800; margin-bottom:10px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> 관리자 홈</a>
  <span class="brand">주간진도표 입력</span>
</header>

<main>
  <div class="panel">
    <h1>학생 진도 기록</h1>

    <label for="student-select">학생 선택</label>
    <select id="student-select">
      <option value="">학생을 선택하세요</option>
    </select>

    <form id="progress-form">
      <input type="hidden" id="selected-code">
      <input type="hidden" id="selected-name">
      <input type="hidden" id="selected-grade">

      <div class="row2">
        <div>
          <label for="classroom">강의실</label>
          <select id="classroom"></select>
        </div>
        <div>
          <label for="recorded-date">작성일</label>
          <input type="date" id="recorded-date" required>
        </div>
      </div>

      <div class="book-block">
        <div class="book-title">진도책</div>
        <div class="row2">
          <div>
            <label for="progress-grade-semester">학년학기</label>
            <select id="progress-grade-semester"><option value="">교재 목록 불러오는 중...</option></select>
          </div>
          <div>
            <label for="progress-textbook-name">교재명</label>
            <select id="progress-textbook-name" disabled><option value="">학년학기 먼저 선택</option></select>
          </div>
        </div>
        <label for="progress-range">진도 범위 (단원)</label>
        <select id="progress-range" disabled><option value="">교재를 먼저 선택하세요</option></select>
      </div>

      <div class="book-block">
        <div class="book-title">숙제책</div>
        <div class="row2">
          <div>
            <label for="homework-grade-semester">학년학기</label>
            <select id="homework-grade-semester"><option value="">교재 목록 불러오는 중...</option></select>
          </div>
          <div>
            <label for="homework-textbook-name">교재명</label>
            <select id="homework-textbook-name" disabled><option value="">학년학기 먼저 선택</option></select>
          </div>
        </div>
        <label for="homework-range">진도 범위 (단원)</label>
        <select id="homework-range" disabled><option value="">교재를 먼저 선택하세요</option></select>
      </div>

      <div class="row2">
        <div>
          <label for="homework-completion">과제 수행</label>
          <select id="homework-completion">
            <option value="★★★★★">★★★★★</option>
            <option value="★★★★">★★★★</option>
            <option value="★★★">★★★</option>
            <option value="★★">★★</option>
            <option value="★">★</option>
          </select>
        </div>
        <div>
          <label for="attitude">수업태도</label>
          <select id="attitude">
            <option value="☆☆☆☆☆">☆☆☆☆☆</option>
            <option value="☆☆☆☆">☆☆☆☆</option>
            <option value="☆☆☆">☆☆☆</option>
            <option value="☆☆">☆☆</option>
            <option value="☆">☆</option>
          </select>
        </div>
      </div>

      <label for="teacher-comment">담당선생님 코멘트</label>
      <textarea id="teacher-comment" placeholder="학부모님께 전달할 코멘트를 입력하세요"></textarea>

      <button type="submit" class="submit" id="submit-btn" disabled>학생을 먼저 선택하세요</button>
    </form>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script>
  requireAdminAuth();

  document.getElementById('recorded-date').valueAsDate = new Date();

  // 강의실 셀렉트 채우기 (로그인 시 고른 강의실을 기본값으로)
  const classroomSelect = document.getElementById('classroom');
  CLASSROOMS.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    classroomSelect.appendChild(opt);
  });
  classroomSelect.value = getAdminClassroom() || CLASSROOMS[0];

  let allStudents = [];
  const studentSelect = document.getElementById('student-select');
  const submitBtn = document.getElementById('submit-btn');

  async function loadStudents() {
    const { data, error } = await sb.rpc('rpc_admin_list_students', { p_password: getAdminPassword(), p_classroom: getAdminClassroom() });
    if (error) { console.error(error); return; }
    allStudents = (data || []).slice().sort((a, b) => {
      const g = compareGrades(a.grade, b.grade);
      if (g !== 0) return g;
      return (a.student_name || '').localeCompare(b.student_name || '');
    });
    const groups = {};
    allStudents.forEach((s) => {
      const g = s.grade || '학년 미지정';
      if (!groups[g]) groups[g] = [];
      groups[g].push(s);
    });
    const optgroups = Object.keys(groups).map((g) => `
      <optgroup label="${g}">
        ${groups[g].map((s) => `<option value="${s.student_code}" data-name="${s.student_name}" data-grade="${s.grade || ''}">${s.student_name} (${s.student_code})</option>`).join('')}
      </optgroup>
    `).join('');
    studentSelect.innerHTML = '<option value="">학생을 선택하세요</option>' + optgroups;
  }
  loadStudents();

  studentSelect.addEventListener('change', () => {
    const code = studentSelect.value;
    if (!code) {
      document.getElementById('selected-code').value = '';
      submitBtn.disabled = true;
      submitBtn.textContent = '학생을 먼저 선택하세요';
      return;
    }
    const opt = studentSelect.selectedOptions[0];
    document.getElementById('selected-code').value = code;
    document.getElementById('selected-name').value = opt.dataset.name;
    document.getElementById('selected-grade').value = opt.dataset.grade;
    submitBtn.disabled = false;
    submitBtn.textContent = '진도 기록 저장';
  });

  // ---- 진도책/숙제책 선택 (학년학기 → 교재명 2단계, 교재 커리큘럼 공통 사용) ----
  let gradeSemesterGroups = {}; // key: "초3-1" -> [textbook rows]

  async function loadTextbookOptions() {
    const { data, error } = await sb.rpc('rpc_admin_list_textbooks', { p_password: getAdminPassword() });
    if (error) {
      console.error(error);
      ['progress-grade-semester', 'homework-grade-semester'].forEach((id) => {
        document.getElementById(id).innerHTML = '<option value="">교재 목록을 불러오지 못했습니다</option>';
      });
      return;
    }
    gradeSemesterGroups = {};
    (data || []).forEach((t) => {
      const key = t.grade + (t.semester ? '-' + t.semester : '');
      if (!gradeSemesterGroups[key]) gradeSemesterGroups[key] = [];
      gradeSemesterGroups[key].push(t);
    });
    const keys = Object.keys(gradeSemesterGroups);
    const optionsHtml = '<option value="">학년학기 선택</option>' + keys.map((k) => `<option value="${k}">${k}</option>`).join('');
    document.getElementById('progress-grade-semester').innerHTML = optionsHtml;
    document.getElementById('homework-grade-semester').innerHTML = optionsHtml;
  }
  loadTextbookOptions();

  function wireBookSelector(gsId, nameId, rangeId) {
    const gsSelect = document.getElementById(gsId);
    const nameSelect = document.getElementById(nameId);
    const rangeSelect = document.getElementById(rangeId);
    gsSelect.addEventListener('change', () => {
      const key = gsSelect.value;
      resetRangeSelect(rangeId, '교재를 먼저 선택하세요');
      if (!key) {
        nameSelect.innerHTML = '<option value="">학년학기 먼저 선택</option>';
        nameSelect.disabled = true;
        return;
      }
      const books = gradeSemesterGroups[key] || [];
      nameSelect.innerHTML = '<option value="">교재명 선택</option>' +
        books.map((t) => `<option value="${t.textbook_code}" data-name="${t.textbook_name}" data-category="${t.category || ''}">[${t.category || '-'}] ${t.textbook_name}</option>`).join('');
      nameSelect.disabled = false;
    });
    nameSelect.addEventListener('change', async () => {
      const code = nameSelect.value;
      if (!code) { resetRangeSelect(rangeId, '교재를 먼저 선택하세요'); return; }
      rangeSelect.innerHTML = '<option value="">단원 불러오는 중...</option>';
      rangeSelect.disabled = true;
      const { data, error } = await sb.rpc('rpc_admin_list_curriculum_units', { p_password: getAdminPassword(), p_textbook_code: code });
      if (error) { console.error(error); resetRangeSelect(rangeId, '단원을 불러오지 못했습니다'); return; }
      const units = data || [];
      if (units.length === 0) { resetRangeSelect(rangeId, '등록된 단원이 없습니다'); return; }
      const total = units.length;
      rangeSelect.innerHTML = '<option value="">단원 선택</option>' +
        units.map((u) => {
          const name = u.minor_unit ? `${u.major_unit} - ${u.minor_unit}` : u.major_unit;
          const label = `${u.unit_order}단원 ${name}`;
          return `<option value="${label}" data-order="${u.unit_order}" data-total="${total}">${label}</option>`;
        }).join('');
      rangeSelect.disabled = false;
    });
  }
  wireBookSelector('progress-grade-semester', 'progress-textbook-name', 'progress-range');
  wireBookSelector('homework-grade-semester', 'homework-textbook-name', 'homework-range');

  function resetRangeSelect(rangeId, placeholder) {
    const sel = document.getElementById(rangeId);
    sel.innerHTML = `<option value="">${placeholder}</option>`;
    sel.disabled = true;
  }

  function composeBookText(gsId, nameId, rangeId) {
    const gs = document.getElementById(gsId).value;
    const nameSelect = document.getElementById(nameId);
    const name = nameSelect.value ? nameSelect.selectedOptions[0].dataset.name : '';
    const range = document.getElementById(rangeId).value;
    if (!gs || !name) return '';
    return `[${gs}] ${name}${range ? ' ' + range : ''}`;
  }

  // 선택한 단원의 순서 / 전체 단원수 * 100 으로 진도율(%) 계산
  function getProgressPercent(rangeId) {
    const rangeSelect = document.getElementById(rangeId);
    if (!rangeSelect.value) return null;
    const opt = rangeSelect.selectedOptions[0];
    const order = parseInt(opt.dataset.order, 10);
    const total = parseInt(opt.dataset.total, 10);
    if (!order || !total) return null;
    return Math.round((order / total) * 100);
  }

  function resetBookSelector(gsId, nameId, rangeId) {
    document.getElementById(gsId).value = '';
    const nameSelect = document.getElementById(nameId);
    nameSelect.innerHTML = '<option value="">학년학기 먼저 선택</option>';
    nameSelect.disabled = true;
    resetRangeSelect(rangeId, '교재를 먼저 선택하세요');
  }

  document.getElementById('progress-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('selected-code').value;
    if (!code) { alert('학생을 먼저 검색해서 선택해 주세요.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    const { error } = await sb.rpc('rpc_admin_add_weekly_progress', {
      p_password: getAdminPassword(),
      p_student_code: code,
      p_student_name: document.getElementById('selected-name').value,
      p_grade: document.getElementById('selected-grade').value,
      p_classroom: classroomSelect.value,
      p_textbook_progress: composeBookText('progress-grade-semester', 'progress-textbook-name', 'progress-range'),
      p_homework_progress: composeBookText('homework-grade-semester', 'homework-textbook-name', 'homework-range'),
      p_textbook_progress_percent: getProgressPercent('progress-range'),
      p_homework_progress_percent: getProgressPercent('homework-range'),
      p_homework_completion: document.getElementById('homework-completion').value,
      p_attitude: document.getElementById('attitude').value,
      p_teacher_comment: document.getElementById('teacher-comment').value.trim(),
      p_recorded_date: document.getElementById('recorded-date').value,
    });

    if (error) {
      alert('저장 실패: ' + error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = '진도 기록 저장';
      return;
    }

    alert('저장되었습니다.');
    // 같은 반 여러 명 연속 입력하기 편하도록, 학생 선택만 초기화하고 나머지는 유지
    studentSelect.value = '';
    document.getElementById('selected-code').value = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '학생을 먼저 선택하세요';
    resetBookSelector('progress-grade-semester', 'progress-textbook-name', 'progress-range');
    resetBookSelector('homework-grade-semester', 'homework-textbook-name', 'homework-range');
    document.getElementById('homework-completion').value = '';
    document.getElementById('attitude').value = '';
    document.getElementById('teacher-comment').value = '';
  });
</script>

</body>
</html>
