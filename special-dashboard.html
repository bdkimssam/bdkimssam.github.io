<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특강 대시보드 | 김쌤 수학</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; --green:#16A34A; --orange:#D97706; --red:#B91C1C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background:var(--navy-950); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header a { color:#fff; text-decoration:none; font-weight:800; font-size:14px; }
  main { max-width:680px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:21px; font-weight:900; margin:0 0 4px; }
  .sub { font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.6; }
  .lec { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:18px; margin-bottom:18px; }
  .lec > h2 { font-size:17px; font-weight:900; margin:0 0 6px; }
  .info { font-size:13px; line-height:1.8; color:var(--ink); padding-bottom:12px; border-bottom:1px solid var(--gray-200); margin-bottom:14px; }
  .info b { color:var(--muted); font-weight:700; margin-right:4px; }
  h3 { font-size:14.5px; font-weight:900; margin:16px 0 8px; display:flex; align-items:center; gap:8px; }
  h3 small { font-weight:700; color:var(--muted); font-size:12.5px; }
  .bar { height:12px; background:#E5E7EB; border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#2563EB,#16A34A); border-radius:999px; }
  .pct { font-size:13px; margin-top:6px; font-weight:800; }
  .units { margin-top:10px; font-size:13px; line-height:1.55; }
  .units div { display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--gray-200); }
  .units .ck { flex:0 0 18px; color:#9CA3AF; font-weight:900; }
  .units .on .ck { color:var(--green); }
  .units .on { color:var(--ink); } .units .off { color:#6B7280; }
  .units .dt { margin-left:auto; flex:0 0 auto; color:var(--muted); font-size:11.5px; }
  .sum { display:flex; gap:8px; margin-bottom:10px; }
  .sum span { flex:1; text-align:center; background:var(--gray-50); border-radius:10px; padding:9px 4px; font-size:12px; color:var(--muted); font-weight:700; }
  .sum b { display:block; font-size:19px; color:var(--ink); font-weight:900; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12.5px; font-weight:800; padding:6px 10px; border-radius:999px; background:#F3F4F6; color:var(--muted); }
  .chip.s출석 { background:#DCFCE7; color:#15803D; } .chip.s지각 { background:#FEF3C7; color:#B45309; } .chip.s결석 { background:#FEE2E2; color:var(--red); }
  .memo { font-size:12.5px; color:#4B5563; margin-top:6px; line-height:1.55; }
  .fb { margin-top:6px; font-size:13.5px; line-height:1.7; padding:10px 0; border-bottom:1px dashed var(--gray-200); }
  .fb .d { color:var(--muted); font-size:11.5px; display:block; }
  .fb span.t { white-space:pre-line; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:36px 10px; line-height:1.7; }
  .none { color:var(--muted); font-size:13px; }
  .btn { display:inline-block; margin-top:12px; padding:11px 16px; border-radius:10px; background:var(--navy-900); color:#fff; text-decoration:none; font-weight:800; font-size:14px; }
</style>
</head>
<body>
<header><a href="index.html">김쌤 수학</a><a id="back" href="dashboard.html">← 대시보드</a></header>
<main>
  <h1>특강 대시보드</h1>
  <p class="sub" id="sub">진도, 출결, 선생님 피드백을 확인하세요.</p>
  <div id="view"><div class="empty">불러오는 중...</div></div>
</main>
<script src="assets/js/supabase-client.js?v=20261009b"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (d) => { if (!d) return ''; const [, m, dd] = String(d).slice(0, 10).split('-'); return `${+m}/${+dd}`; };
const hm = (t) => (t ? String(t).slice(0, 5) : '');
const ST_MARK = { 출석: '○', 지각: '△', 결석: '×' };

function lectureHtml(l) {
  const units = l.units || [], att = l.attendance || [], fb = l.feedback || [];
  const done = units.filter((u) => u.done_date).length;
  const pct = units.length ? Math.round((done / units.length) * 100) : 0;
  const cnt = { 출석: 0, 지각: 0, 결석: 0 };
  att.forEach((a) => { if (cnt[a.status] != null) cnt[a.status]++; });
  const time = l.start_time && l.end_time ? `${hm(l.start_time)}~${hm(l.end_time)}` : '';
  const when = [l.days ? l.days.split('').join('·') : '', time].filter(Boolean).join(' ') || l.schedule_text || '';
  const reasons = att.filter((a) => (a.status === '지각' || a.status === '결석') && a.memo);
  return `<section class="lec">
    <h2>${esc(l.title)}</h2>
    <div class="info">
      <div><b>학생</b>${esc(l.student_name)}</div>
      ${l.start_date ? `<div><b>기간</b>${esc(md(l.start_date))} ~ ${esc(md(l.end_date))}</div>` : ''}
      ${when ? `<div><b>시간</b>${esc(when)}</div>` : ''}
      ${l.classroom ? `<div><b>강의실</b>${esc(l.classroom)}</div>` : ''}
      ${l.teacher ? `<div><b>담당</b>${esc(l.teacher)}</div>` : ''}
    </div>

    <h3>📘 진도 <small>${units.length ? `${done} / ${units.length}` : ''}</small></h3>
    ${units.length ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${pct}% 진행</div>
      <div class="units">${units.map((u) => `<div class="${u.done_date ? 'on' : 'off'}"><span class="ck">${u.done_date ? '✓' : '○'}</span><span>${esc(u.title)}</span>${u.done_date ? `<span class="dt">${esc(md(u.done_date))}</span>` : ''}</div>`).join('')}</div>`
      : '<div class="none">진도 목록이 아직 등록되지 않았어요.</div>'}

    <h3>🗓️ 출결</h3>
    ${att.length ? `<div class="sum"><span><b>${cnt.출석}</b>출석</span><span><b>${cnt.지각}</b>지각</span><span><b>${cnt.결석}</b>결석</span></div>
      <div class="chips">${att.map((a) => `<span class="chip s${esc(a.status)}">${esc(md(a.date))} ${esc(ST_MARK[a.status] || '')} ${esc(a.status)}</span>`).join('')}</div>
      ${reasons.map((a) => `<div class="memo">${esc(md(a.date))} ${esc(a.status)} · ${esc(a.memo)}</div>`).join('')}`
      : '<div class="none">아직 출결 기록이 없어요.</div>'}

    <h3>📝 선생님 피드백</h3>
    ${fb.length ? fb.map((f) => `<div class="fb"><span class="d">${esc(md(f.date))}</span><span class="t">${esc(f.content)}</span></div>`).join('') : '<div class="none">아직 등록된 피드백이 없어요.</div>'}
  </section>`;
}

async function init() {
  let args = null;
  let backHref = 'dashboard.html';
  let name = '', phone = '';
  try { name = sessionStorage.getItem('sd_name') || ''; phone = sessionStorage.getItem('sd_phone') || ''; } catch (e) {}
  if (name && phone) {
    args = { p_student_name: name, p_parent_phone: phone };
    backHref = 'special-apply.html';
    $('back').textContent = '← 내 신청 조회';
  } else {
    let code = '';
    try { code = localStorage.getItem('student_code') || ''; } catch (e) {}
    if (code) args = { p_student_code: code };
  }
  $('back').href = backHref;
  if (!args) {
    $('view').innerHTML = '<div class="empty">조회 정보가 없어요.<br>재원생은 학부모 대시보드에서, 외부 학생은 방학특강 신청 페이지의 "내 신청 조회"에서 들어와 주세요.<br><a class="btn" href="special-apply.html">내 신청 조회로 가기</a></div>';
    return;
  }
  const { data, error } = await sb.rpc('rpc_special_dashboard', args);
  if (error) {
    const missing = error.code === 'PGRST202' || /Could not find the function/i.test(error.message || '');
    $('view').innerHTML = `<div class="empty">${missing ? '아직 준비 중이에요. 학원으로 문의해 주세요.' : '불러오지 못했어요. 잠시 후 다시 시도해 주세요.'}</div>`;
    return;
  }
  if (!data || !data.length) {
    $('view').innerHTML = '<div class="empty">지금 볼 수 있는 특강이 없어요.<br>수강이 확정된 특강은 시작일부터 종료 후 1주일까지 볼 수 있어요.</div>';
    return;
  }
  $('view').innerHTML = data.map(lectureHtml).join('');
}
init();
</script>
</body>
</html>
