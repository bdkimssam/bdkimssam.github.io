<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 마이페이지 | 봉덕김쌤수학학원</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
  :root {
    --navy-950: #070C16;
    --navy-900: #0B1220;
    --navy-800: #121B31;
    --navy-700: #16233B;
    --navy-500: #2A3E64;
    --white: #FFFFFF;
    --gray-50: #F5F6F8;
    --gray-100: #EDEFF3;
    --gray-200: #E4E7EC;
    --ink: #12172B;
    --muted: #6B7280;
    --faint: #98A1B3;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--gray-50);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* 메인 사이트와 동일한 모눈종이(그래프 용지) 텍스처 - 같은 브랜드 시그니처 재사용 */
  .grid-paper {
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* ===== 상단 헤더 ===== */
  .topbar {
    background: var(--navy-950);
    color: var(--white);
  }
  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 15px;
  }
  .brand .mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--white);
    color: var(--navy-950);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
  }
  .brand .sub {
    color: rgba(255,255,255,0.45);
    font-weight: 600;
    font-size: 12px;
  }
  .logout-btn {
    appearance: none;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s, background 0.15s;
  }
  .logout-btn:hover {
    border-color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
  }

  /* ===== 웰컴 배너 ===== */
  .welcome {
    background: var(--navy-900);
    color: var(--white);
    position: relative;
    overflow: hidden;
  }
  .welcome-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 20px 52px;
    position: relative;
    z-index: 1;
  }
  .welcome-eyebrow {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin: 0 0 10px;
  }
  .welcome-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    line-height: 1.35;
  }
  .welcome-title .name {
    display: inline-block;
    padding: 0 4px;
  }
  .welcome-sub {
    font-size: 13.5px;
    color: rgba(255,255,255,0.55);
    margin: 0;
  }
  .welcome-code {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* ===== 메인 컨텐츠 ===== */
  .main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: -36px;
    position: relative;
    z-index: 2;
  }

  @media (max-width: 700px) {
    .card-grid { grid-template-columns: 1fr; margin-top: -24px; }
  }

  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 16px;
    padding: 22px 22px 20px;
    box-shadow: 0 12px 32px rgba(11,18,32,0.06);
    display: flex;
    flex-direction: column;
    height: 300px;
  }

  .card-head {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--navy-900);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .card-title {
    font-size: 15.5px;
    font-weight: 800;
    color: var(--ink);
  }
  .card-tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: var(--gray-100);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .card-body {
    flex: 1;
    min-height: 0; /* flex 자식이 부모 높이를 넘어가지 않도록 */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow-y: auto;
  }
  .card-body[data-state="loading"],
  .card-body[data-state="empty"] {
    justify-content: center;
  }

  .state-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--faint);
    font-size: 13.5px;
    font-weight: 600;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--gray-200);
    border-top-color: var(--navy-500);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-empty {
    color: var(--faint);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .state-empty .big {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 4px;
    display: block;
  }

  .data-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid var(--gray-100);
    font-size: 13.5px;
  }
  .data-row:first-child { border-top: none; }
  .data-row .k { color: var(--muted); font-weight: 600; }
  .data-row .v { color: var(--ink); font-weight: 800; }

  .notice-item {
    padding: 10px 0;
    border-top: 1px solid var(--gray-100);
  }
  .notice-item:first-child { border-top: none; }
  .notice-item .t { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .notice-item .d { font-size: 12px; color: var(--faint); margin-top: 2px; }

  .progress-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--gray-100);
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--navy-900);
  }
  .progress-percent {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 6px;
    text-align: right;
  }

  .feedback-item {
    padding: 10px 0;
    border-top: 1px solid var(--gray-100);
  }
  .feedback-item:first-child { border-top: none; }
  .feedback-item .teacher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy-700);
  }
  .feedback-item .date { font-size: 11.5px; color: var(--faint); font-weight: 600; }
  .feedback-item .comment {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.55;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .feedback-item .comment.expanded {
    -webkit-line-clamp: unset;
    overflow: visible;
  }
  .feedback-more-btn {
    appearance: none;
    background: transparent;
    border: none;
    padding: 4px 0 0;
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--navy-500);
    cursor: pointer;
  }

  /* ---- 상점(포인트/스탬프) & 경고 카드 공용 스타일 ---- */
  .stat-chip-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-chip {
    flex: 1;
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
  }
  .stat-chip .num { font-size: 20px; font-weight: 900; line-height: 1.2; }
  .stat-chip .lbl { font-size: 11.5px; font-weight: 700; margin-top: 2px; }
  .stat-chip.point { background: #FFF7E0; }
  .stat-chip.point .num, .stat-chip.point .lbl { color: #9A6B00; }
  .stat-chip.stamp { background: #EEF2FF; }
  .stat-chip.stamp .num, .stat-chip.stamp .lbl { color: #3D4FA0; }
  .stat-chip.warning { background: #FFF3E0; }
  .stat-chip.warning .num, .stat-chip.warning .lbl { color: #B5651D; }

  .log-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 0;
    border-top: 1px solid var(--gray-100);
  }
  .log-item:first-child { border-top: none; }
  .log-badge {
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 6px;
    margin-top: 1px;
    white-space: nowrap;
  }
  .log-badge.point { background: #FFF1C2; color: #8A5D00; }
  .log-badge.stamp { background: #E0E7FF; color: #364293; }
  .log-badge.warning { background: #FDECC8; color: #8A5400; }
  .log-item .reason { font-size: 13px; color: var(--ink); font-weight: 600; line-height: 1.5; }
  .log-item .date { font-size: 11px; color: var(--faint); margin-top: 1px; }

  .footnote {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 40px;
    font-size: 12px;
    color: var(--faint);
    line-height: 1.6;
  }
</style>
</head>
<body>

<!-- ============================================================
  인증 가드: localStorage에 student_code가 없으면 즉시 로그인 페이지로 이동
  (본문이 렌더링되기 전, body 최상단에서 바로 실행되도록 배치)
============================================================= -->
<script>
  if (!localStorage.getItem('student_code')) {
    window.location.href = 'index.html';
  }
</script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">봉</span>
      <span>
        봉덕김쌤수학학원
        <span class="sub">학부모 마이페이지</span>
      </span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="logout-btn" id="switch-child-btn">
        <i class="fa-solid fa-user-group"></i> 다른 자녀 선택
      </button>
      <button type="button" class="logout-btn" id="logout-btn">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
      </button>
    </div>
  </div>
</header>

<section class="welcome grid-paper">
  <div class="welcome-inner">
    <p class="welcome-eyebrow">Parent Dashboard</p>
    <h1 class="welcome-title"><span class="name" id="welcome-name">학생</span>님의 대시보드입니다</h1>
    <p class="welcome-sub">공지사항, 성적, 진도, 선생님 피드백을 이곳에서 한눈에 확인하세요.</p>
    <span class="welcome-code"><i class="fa-solid fa-id-badge"></i> 학생코드 <span id="welcome-code-value">-</span></span>
  </div>
</section>

<main class="main">
  <div class="card-grid">

    <!-- 공지사항 -->
    <div class="card" id="card-notices">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon"><i class="fa-solid fa-bullhorn"></i></span>
          <span class="card-title">공지사항</span>
        </div>
        <span class="card-tag">최근 소식</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

    <!-- 월간평가 성적 -->
    <div class="card" id="card-grades">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon"><i class="fa-solid fa-chart-line"></i></span>
          <span class="card-title">월간평가 성적</span>
        </div>
        <span class="card-tag">이번 달</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

    <!-- 현재 진도 -->
    <div class="card" id="card-progress">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon"><i class="fa-solid fa-route"></i></span>
          <span class="card-title">현재 진도</span>
        </div>
        <span class="card-tag">진행 중</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

    <!-- 담당 선생님 피드백 -->
    <div class="card" id="card-feedback">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon"><i class="fa-solid fa-comment-dots"></i></span>
          <span class="card-title">담당 선생님 피드백</span>
        </div>
        <span class="card-tag">최근 코멘트</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

    <!-- 상점 (포인트 · 스탬프) -->
    <div class="card" id="card-rewards">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon"><i class="fa-solid fa-star"></i></span>
          <span class="card-title">상점</span>
        </div>
        <span class="card-tag">포인트 · 스탬프</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

    <!-- 학습 태도 관리 -->
    <div class="card" id="card-warnings">
      <div class="card-head">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="card-icon" style="background: #D97706;"><i class="fa-solid fa-circle-info"></i></span>
          <span class="card-title">학습 태도 관리</span>
        </div>
        <span class="card-tag">관리 안내</span>
      </div>
      <div class="card-body" data-state="loading">
        <div class="state-loading"><span class="spinner"></span> 불러오는 중...</div>
      </div>
    </div>

  </div>
</main>

<script>
  // =====================================================================
  // 1) 로그인 정보 바인딩 (localStorage → 화면)
  // =====================================================================
  const studentCode = localStorage.getItem('student_code');
  const studentName = localStorage.getItem('student_name');

  // 위쪽 인증 가드에서 이미 리다이렉트 처리하지만, 혹시 모를 상황에 대비해 한 번 더 체크
  if (!studentCode) {
    window.location.href = 'index.html';
  }

  document.getElementById('welcome-name').textContent = studentName || '학생';
  document.getElementById('welcome-code-value').textContent = studentCode || '-';

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('student_name');
    localStorage.removeItem('student_code');
    localStorage.removeItem('kakao_email');
    localStorage.removeItem('family_students');
    window.location.href = 'index.html';
  });

  // ---- 다른 자녀 선택 ----
  document.getElementById('switch-child-btn').addEventListener('click', () => {
    let students = [];
    try {
      students = JSON.parse(localStorage.getItem('family_students') || '[]');
    } catch (e) {
      students = [];
    }

    if (!Array.isArray(students) || students.length < 2) {
      alert('등록된 다른 자녀 정보가 없습니다.');
      return;
    }

    openChildSelectModal(students);
  });

  // 다자녀 학부모용 '조회할 자녀를 선택해 주세요' 모달을 동적으로 생성해서 띄움
  function openChildSelectModal(students) {
    const overlay = document.createElement('div');
    overlay.id = 'child-select-modal';
    overlay.style.cssText =
      'position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;';
    overlay.innerHTML = `
      <div style="position:absolute; inset:0; background:rgba(7,12,22,0.7); backdrop-filter:blur(2px);"></div>
      <div style="position:relative; width:100%; max-width:380px; background:#fff; border-radius:16px; border:1px solid var(--gray-200); box-shadow:0 20px 60px rgba(11,18,32,0.35); padding:26px;">
        <div style="width:42px; height:42px; border-radius:10px; background:var(--navy-900); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:14px;">
          <i class="fa-solid fa-user-group"></i>
        </div>
        <h2 style="font-size:17px; font-weight:900; color:var(--ink); margin:0 0 6px;">조회할 자녀를 선택해 주세요</h2>
        <p style="font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 18px;">등록된 자녀 중 확인하실 자녀를 선택해 주세요.</p>
        <div id="child-select-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button type="button" id="child-select-cancel" style="margin-top:16px; width:100%; text-align:center; background:var(--gray-50); border:1px solid var(--gray-200); color:var(--muted); font-weight:700; font-size:13px; padding:10px; border-radius:10px; cursor:pointer;">취소</button>
      </div>
    `;
    document.body.appendChild(overlay);

    const list = overlay.querySelector('#child-select-list');
    students.forEach((student) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.style.cssText =
        'display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--gray-200); border-radius:10px; padding:12px 14px; background:#fff; text-align:left; cursor:pointer;';
      btn.innerHTML = `
        <span>
          <span style="display:block; font-weight:800; font-size:14.5px; color:var(--ink);">${student.student_name || '이름 미확인'}</span>
          <span style="display:block; font-size:12px; color:var(--faint); margin-top:2px;">학생코드 ${student.student_code}</span>
        </span>
        <i class="fa-solid fa-chevron-right" style="color:var(--gray-200); font-size:12px;"></i>
      `;
      btn.addEventListener('mouseenter', () => (btn.style.borderColor = 'var(--navy-900)'));
      btn.addEventListener('mouseleave', () => (btn.style.borderColor = 'var(--gray-200)'));
      btn.addEventListener('click', () => {
        localStorage.setItem('student_name', student.student_name || '');
        localStorage.setItem('student_code', student.student_code);
        overlay.remove();
        window.location.reload();
      });
      list.appendChild(btn);
    });

    overlay.querySelector('#child-select-cancel').addEventListener('click', () => overlay.remove());
  }

  // =====================================================================
  // 2) Notion 데이터 fetch 모듈 (공지/성적/진도/피드백 등 모든 카드가 공용으로 사용)
  //    각 웹훅 URL은 아래 API_ENDPOINTS에 나중에 채워 넣으면 됩니다.
  // =====================================================================
  const API_ENDPOINTS = {
    notices: 'https://hook.eu2.make.com/yn01m7knj857129x9y226e49en1d5jof', // 공지사항
    grades: 'https://hook.eu2.make.com/ndbxil34gcwhp9hwp3iqzxotrk09bvaw', // 월간평가 성적
    progressAndFeedback: 'https://hook.eu2.make.com/vequ7ixpqxlc77eyr3z4ytx3r6eytskn', // 현재 진도·담당 선생님 피드백
    rewardsAndWarnings: 'https://hook.eu2.make.com/fhhql59e27um0qtwteuh9fn9wckh8wtm', // 상점(포인트/스탬프)·경고
  };

  /**
   * student_code를 파라미터로 담아 Make 웹훅(API)에서 데이터를 가져오는 공용 함수.
   * @param {string} endpointUrl - 호출할 Make 웹훅 주소
   * @param {string} code - 조회할 학생 코드
   * @returns {Promise<any|null>} 성공 시 JSON 데이터, 실패/미설정 시 null
   */
  async function fetchStudentData(endpointUrl, code) {
    if (!endpointUrl) {
      console.warn('[fetchStudentData] 웹훅 URL이 아직 설정되지 않았습니다.');
      return null;
    }

    try {
      const url = new URL(endpointUrl);
      url.searchParams.set('student_code', code);

      const res = await fetch(url.toString(), { method: 'GET' });

      if (!res.ok) {
        throw new Error(`요청 실패 (status: ${res.status})`);
      }

      return await res.json();
    } catch (error) {
      console.error('[fetchStudentData] 데이터 조회 실패:', error);
      return null;
    }
  }

  // 노션 속성값을 안전하게 일반 값(문자열)으로 풀어내는 공용 함수.
  // - rich_text/title: [{ plain_text: '...' }, ...] 배열
  // - date: { start: '2026-08-20', end: null, ... }
  // - email/number 등 단순 타입: 그냥 값 그대로
  function extractNotionValue(value) {
    if (value == null) return '';
    if (typeof value === 'string' || typeof value === 'number') return value;
    if (Array.isArray(value)) {
      return value.map((segment) => segment?.plain_text ?? '').join('');
    }
    if (typeof value === 'object') {
      if ('plain_text' in value) return value.plain_text ?? '';
      if ('start' in value) return value.start ?? ''; // Notion 날짜 속성
      if ('name' in value) return value.name ?? ''; // Notion 단일 선택(select) 속성 (예: 별점)
    }
    return String(value);
  }

  // Make가 { items: [...] } 형태로 주든, 아니면 배열([...])을 그대로 주든 항상 배열로 통일
  function toRawItemArray(data) {
    if (Array.isArray(data)) return data;
    if (Array.isArray(data?.items)) return data.items;
    return [];
  }

  // 노션 원본 구조(properties_value로 감싸진 형태)에서 실제 컬럼값만 뽑아내는 함수.
  // fieldMap 예: { title: '공지사항 내용', date: '작성일' }
  function normalizeNotionItem(raw, fieldMap) {
    const props = raw?.properties_value ?? raw ?? {};
    const result = {};
    for (const [key, notionColumn] of Object.entries(fieldMap)) {
      result[key] = extractNotionValue(props[notionColumn]);
    }
    return result;
  }

  // =====================================================================
  // 3) 카드별 렌더링 함수 (각 카드의 data-state를 loading → data/empty로 전환)
  // =====================================================================
  function setCardState(cardId, html, state = 'loaded') {
    const card = document.getElementById(cardId);
    const body = card.querySelector('.card-body');
    body.innerHTML = html;
    body.setAttribute('data-state', state);
  }

  function renderEmptyState(cardId, message) {
    setCardState(
      cardId,
      `<div class="state-empty"><span class="big">아직 표시할 데이터가 없어요</span>${message}</div>`,
      'empty'
    );
  }

  // ---- 공지사항 ----
  async function loadNotices() {
    const data = await fetchStudentData(API_ENDPOINTS.notices, studentCode);
    const rawItems = toRawItemArray(data);

    if (rawItems.length === 0) {
      renderEmptyState('card-notices', '새로운 공지사항이 등록되면 이곳에 표시됩니다.');
      return;
    }

    // 노션 원본(properties_value) 구조를 { title, date }로 정리
    const items = rawItems.map((raw) =>
      normalizeNotionItem(raw, { title: '공지사항 내용', date: '작성일' })
    );

    setCardState(
      'card-notices',
      items
        .slice(0, 3)
        .map(
          (item) => `
          <div class="notice-item">
            <div class="t">${item.title || '(제목 없음)'}</div>
            <div class="d">${item.date || ''}</div>
          </div>
        `
        )
        .join('')
    );
  }

  // ---- 월간평가 성적 ----
  async function loadGrades() {
    const data = await fetchStudentData(API_ENDPOINTS.grades, studentCode);
    const rawItems = toRawItemArray(data);

    if (rawItems.length === 0) {
      renderEmptyState('card-grades', '월간평가 결과가 등록되면 이곳에 표시됩니다.');
      return;
    }

    // 노션 원본(properties_value) 구조를 { year, month, score }로 정리
    // (Make에서 이미 연도→월 내림차순으로 정렬해서 최신순으로 보내줌)
    const items = rawItems.map((raw) =>
      normalizeNotionItem(raw, { year: '연도', month: '월', score: '점수' })
    );

    setCardState(
      'card-grades',
      items
        .slice(0, 6)
        .map(
          (item) => `
          <div class="data-row">
            <span class="k">${item.year}년 ${item.month}월</span>
            <span class="v">${item.score || '-'}점</span>
          </div>
        `
        )
        .join('')
    );
  }

  // ---- 현재 진도 ----
  // ---- 현재 진도 & 담당 선생님 피드백: 같은 DB 테이블에서 한 번에 조회해서 두 카드에 나눠 표시 ----
  async function loadProgressAndFeedback() {
    const data = await fetchStudentData(API_ENDPOINTS.progressAndFeedback, studentCode);
    const rawItems = toRawItemArray(data);

    if (rawItems.length === 0) {
      renderEmptyState('card-progress', '진도 정보가 등록되면 이곳에 표시됩니다.');
      renderEmptyState('card-feedback', '선생님 피드백이 등록되면 이곳에 표시됩니다.');
      return;
    }

    // 노션 원본(properties_value) 구조를 정리 (일부 필드가 비어있어도 안전하게 '' 처리됨)
    const items = rawItems.map((raw) =>
      normalizeNotionItem(raw, {
        bookProgress: '진도책 진도',
        homeworkProgress: '숙제책 진도',
        comment: '담당선생님 코멘트',
        homeworkScore: '과제 수행',
        attitude: '수업태도',
        date: '작성일자',
        progressPercent: '진도율', // 선택 항목: 노션에 0~100 숫자 컬럼을 추가하면 진행률 바가 자동으로 표시됨
      })
    );

    // ---- 현재 진도: 가장 최근 기록(맨 앞) 기준 ----
    const latest = items[0];
    const rawPercent = Number(latest.progressPercent);
    const hasPercent = Number.isFinite(rawPercent) && latest.progressPercent !== '';
    const percent = hasPercent ? Math.max(0, Math.min(100, rawPercent)) : null;

    setCardState(
      'card-progress',
      `
      <div class="data-row"><span class="k">진도책 진도</span><span class="v">${latest.bookProgress || '기록 없음'}</span></div>
      <div class="data-row"><span class="k">숙제책 진도</span><span class="v">${latest.homeworkProgress || '기록 없음'}</span></div>
      <div class="data-row"><span class="k">최근 업데이트</span><span class="v">${latest.date || '-'}</span></div>
      ${
        percent !== null
          ? `
        <div class="progress-track"><div class="progress-fill" style="width:${percent}%;"></div></div>
        <div class="progress-percent">${percent}% 진행</div>
      `
          : ''
      }
      `
    );

    // ---- 담당 선생님 피드백: 최근 3건 ----
    setCardState(
      'card-feedback',
      items
        .slice(0, 3)
        .map((item) => {
          const commentText = item.comment || '코멘트가 없습니다.';
          // 대략 3줄(약 60자) 넘는 긴 코멘트만 '더보기' 버튼 표시
          const needsMoreBtn = commentText.length > 60;
          return `
          <div class="feedback-item">
            <div class="teacher">
              <span>과제수행 ${item.homeworkScore || '-'} · 수업태도 ${item.attitude || '-'}</span>
              <span class="date">${item.date || ''}</span>
            </div>
            <div class="comment">${commentText}</div>
            ${
              needsMoreBtn
                ? `<button type="button" class="feedback-more-btn" onclick="
                    const c = this.previousElementSibling;
                    const isOpen = c.classList.toggle('expanded');
                    this.textContent = isOpen ? '접기' : '더보기';
                  ">더보기</button>`
                : ''
            }
          </div>
        `;
        })
        .join('')
    );
  }

  // ---- 상점(포인트·스탬프) & 경고: 같은 DB 테이블에서 한 번에 조회해서 두 카드에 나눠 표시 ----
  async function loadRewardsAndWarnings() {
    const data = await fetchStudentData(API_ENDPOINTS.rewardsAndWarnings, studentCode);
    const rawItems = toRawItemArray(data);

    if (rawItems.length === 0) {
      renderEmptyState('card-rewards', '상점 내역이 등록되면 이곳에 표시됩니다.');
      renderEmptyState('card-warnings', '아직 안내 사항이 없습니다. 지금처럼 잘하고 있어요!');
      return;
    }

    // 노션 테이블 구조: 한 행이 상점(상점 종류/상점 이유) 또는 경고(경고/경고이유) 중 하나만 채워짐
    const parsed = rawItems.map((raw) =>
      normalizeNotionItem(raw, {
        rewardType: '상점 종류', // '포인트' | '스탬프' | ''
        rewardReason: '상점 이유',
        warningFlag: '경고', // '경고' | ''
        warningReason: '경고이유',
        date: '작성일',
      })
    );

    // 채워진 쪽을 보고 상점/경고로 분류
    const items = parsed
      .map((row) => {
        if (row.rewardType) {
          return {
            type: row.rewardType === '스탬프' ? 'stamp' : 'point',
            reason: row.rewardReason,
            date: row.date,
          };
        }
        if (row.warningFlag) {
          return { type: 'warning', reason: row.warningReason, date: row.date };
        }
        return null;
      })
      .filter(Boolean);

    const pointItems = items.filter((i) => i.type === 'point');
    const stampItems = items.filter((i) => i.type === 'stamp');
    const warningItems = items.filter((i) => i.type === 'warning');

    // ---- 상점 카드 렌더링 ----
    const rewardLogs = [...pointItems, ...stampItems].slice(0, 3);
    const rewardLogsHtml = rewardLogs.length
      ? rewardLogs
          .map((item) => {
            const isStamp = item.type === 'stamp';
            const badgeClass = isStamp ? 'stamp' : 'point';
            const badgeLabel = isStamp ? '스탬프' : '포인트';
            return `
              <div class="log-item">
                <span class="log-badge ${badgeClass}">${badgeLabel}</span>
                <div>
                  <div class="reason">${item.reason || ''}</div>
                  <div class="date">${item.date || ''}</div>
                </div>
              </div>
            `;
          })
          .join('')
      : `<p class="state-empty" style="margin-top:2px;">아직 지급된 상점 내역이 없습니다.</p>`;

    setCardState(
      'card-rewards',
      `
      <div class="stat-chip-row">
        <div class="stat-chip point">
          <div class="num">${pointItems.length}</div>
          <div class="lbl">포인트</div>
        </div>
        <div class="stat-chip stamp">
          <div class="num">${stampItems.length}</div>
          <div class="lbl">스탬프</div>
        </div>
      </div>
      ${rewardLogsHtml}
      `
    );

    // ---- 학습 태도 관리 카드 렌더링 ----
    const warningLogsHtml = warningItems.length
      ? warningItems
          .slice(0, 3)
          .map(
            (item) => `
            <div class="log-item">
              <span class="log-badge warning">안내</span>
              <div>
                <div class="reason">${item.reason || ''}</div>
                <div class="date">${item.date || ''}</div>
              </div>
            </div>
          `
          )
          .join('')
      : `<p class="state-empty" style="margin-top:2px;">아직 안내 사항이 없습니다. 지금처럼 잘하고 있어요!</p>`;

    setCardState(
      'card-warnings',
      `
      <div class="stat-chip-row">
        <div class="stat-chip warning" style="flex:none; width:100%;">
          <div class="num">${warningItems.length}<span style="font-size:13px; font-weight:700;"> / 3회</span></div>
          <div class="lbl">누적 안내 횟수 · 3회 누적 시 학부모님과 상담을 진행해요</div>
        </div>
      </div>
      ${warningLogsHtml}
      `
    );
  }

  // =====================================================================
  // 4) 페이지 로드 시 모든 카드 데이터 동시 요청
  // =====================================================================
  loadNotices();
  loadGrades();
  loadProgressAndFeedback();
  loadRewardsAndWarnings();
</script>

</body>
</html>
