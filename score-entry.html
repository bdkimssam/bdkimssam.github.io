<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 성적 입력 | 김쌤 수학</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --navy-950:#070C16; --navy-900:#0B1220; --ink:#12172B; --muted:#6B7280; --gray-50:#F5F6F8; --gray-200:#E4E7EC; --red:#B91C1C; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--gray-50); color:var(--ink); }
  header { background:var(--navy-950); color:#fff; padding:16px 20px; text-align:center; }
  header a { color:#fff; text-decoration:none; font-weight:800; font-size:15px; }
  main { max-width:520px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:20px; font-weight:900; margin:0 0 6px; }
  .sub { font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 16px; }
  .card { background:#fff; border:1px solid var(--gray-200); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  label.f { display:block; font-size:13px; font-weight:700; margin-top:13px; }
  label.f small { color:var(--muted); font-weight:500; }
  input[type=text], input[type=number], select { width:100%; margin-top:5px; padding:11px 12px; border:1px solid var(--gray-200); border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--ink); }
  input[readonly] { background:var(--gray-50); color:#374151; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  .card > label.f:first-child { margin-top:0; }
  .btn { appearance:none; border:1px solid var(--gray-200); background:#fff; border-radius:10px; padding:12px 16px; font:inherit; font-size:15px; font-weight:800; cursor:pointer; color:var(--ink); }
  .btn.primary { background:var(--navy-900); border-color:var(--navy-900); color:#fff; }
  .btn.block { width:100%; margin-top:14px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .err { margin-top:12px; font-size:13px; color:var(--red); font-weight:700; line-height:1.5; }
  .total { margin-top:14px; padding:12px 14px; background:var(--gray-50); border-radius:10px; font-size:14px; font-weight:800; display:flex; justify-content:space-between; }
  .note { font-size:12.5px; color:var(--muted); line-height:1.6; }
  .hello { font-weight:900; font-size:16px; margin-bottom:2px; }
  .done { text-align:center; padding:26px 8px; }
  .done .ic { font-size:40px; }
  .done h2 { font-size:18px; margin:10px 0 6px; }
  .hist { width:100%; border-collapse:collapse; font-size:13px; }
  .hist th, .hist td { padding:8px 4px; border-bottom:1px solid var(--gray-200); text-align:center; }
  .hist th { color:var(--muted); font-weight:700; font-size:12px; }
  .hist td:first-child, .hist th:first-child { text-align:left; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><a href="index.html">김쌤 수학</a></header>
<main>
  <h1>시험 성적 입력</h1>
  <p class="sub">학교 시험·모의고사 성적을 직접 입력해요. 학년과 내 이름을 고르고 점수만 넣으면 돼요. 입력한 성적은 선생님만 볼 수 있어요.</p>

  <form id="form" class="card" autocomplete="off">
    <div class="row2">
      <label class="f">학년
        <select id="sel-grade"><option value="">불러오는 중...</option></select></label>
      <label class="f">내 이름
        <select id="sel-name" disabled><option value="">학년 먼저</option></select></label>
    </div>
    <label class="f" id="school-wrap" hidden>학교
      <select id="school">
        <option value="">선택</option><option>경일여중</option><option>경일여고</option><option>협성경복중</option><option>협성고</option><option>대구고</option><option value="__etc">기타 (직접 입력)</option>
      </select>
      <input type="text" id="school-etc" maxlength="40" placeholder="학교 이름" hidden style="margin-top:8px"></label>
    <label class="f" id="subj-wrap" hidden>과목
      <select id="subject"><option value="">선택</option><option>대수</option><option>미적분1</option><option>확률과 통계</option><option>미적분2</option><option>기하</option></select></label>
    <label class="f">시험 종류
      <select id="etype">
        <option value="">선택</option>
        <option>1학기중간</option><option>1학기기말</option><option>2학기중간</option><option>2학기기말</option>
        <option>3월모의고사</option><option>6월모의고사</option><option>9월모의고사</option><option>10월모의고사</option>
      </select></label>
    <div class="row2">
      <label class="f">객관식 점수
        <input type="number" id="obj" inputmode="decimal" min="0" max="100" step="0.1"></label>
      <label class="f">주관식 점수 <small>(없으면 0)</small>
        <input type="number" id="subj" inputmode="decimal" min="0" max="100" step="0.1"></label>
    </div>
    <div class="total"><span>총점</span><span id="total">-</span></div>
    <div class="note" style="margin-top:8px">같은 시험은 한 번만 입력할 수 있어요. 잘못 입력했다면 선생님께 말씀해 주세요.</div>
    <div class="err" id="err2" hidden></div>
    <button class="btn primary block" id="go2" type="submit">저장하기</button>
  </form>

  <!-- 완료 -->
  <div id="step3" class="card done" hidden>
    <div class="ic">✅</div>
    <h2>성적이 저장되었어요</h2>
    <p class="note" id="done-msg"></p>
    <button class="btn primary" id="again" type="button">같은 학생, 다른 시험 입력</button>
    <button class="btn" id="home" type="button" style="margin-top:8px">다른 학생이 입력하기</button>
  </div>
</main>

<script src="assets/js/supabase-client.js?v=20261009b"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const v = Number(n); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
function showErr(id, msg) { const e = $(id); e.textContent = msg || ''; e.hidden = !msg; }
function friendly(error) {
  const m = (error && error.message) || '';
  if (error && (error.code === 'PGRST202' || /Could not find the function/i.test(m))) return '아직 성적 입력 기능이 준비 중이에요. 선생님께 문의해 주세요.';
  return m || '잠시 후 다시 시도해 주세요.';
}
let who = null, people = [];

async function loadPeople() {
  const { data, error } = await sb.rpc('rpc_public_exam_students');
  $('sel-grade').innerHTML = '<option value="">선택</option>' + ['중1','중2','중3','고1','고2','고3'].map(g => `<option>${g}</option>`).join('');
  if (error) return showErr('err2', friendly(error));
  people = data || [];
}
function applyWho() {
  const p = who;
  $('school-wrap').hidden = !p || !!p.has_school;
  $('subj-wrap').hidden = !p || !(p.grade === '고2' || p.grade === '고3');
  $('school').value = ''; $('school-etc').value = ''; $('school-etc').hidden = true; $('subject').value = '';
}
$('sel-grade').addEventListener('change', () => {
  const g = $('sel-grade').value; showErr('err2', ''); who = null;
  const list = people.filter(p => p.grade === g);
  $('sel-name').disabled = !g;
  $('sel-name').innerHTML = !g ? '<option value="">학년 먼저</option>'
    : !list.length ? '<option value="">학생 없음</option>'
    : '<option value="">선택</option>' + list.map(p => `<option value="${esc(p.ref)}">${esc(p.student_name)}${p.school ? ' (' + esc(p.school) + ')' : ''}</option>`).join('');
  applyWho();
});
$('sel-name').addEventListener('change', () => { who = people.find(p => p.ref === $('sel-name').value) || null; applyWho(); });
$('school').addEventListener('change', () => { $('school-etc').hidden = $('school').value !== '__etc'; });

function calc() {
  const o = parseFloat($('obj').value), s = parseFloat($('subj').value);
  $('total').textContent = (isNaN(o) && isNaN(s)) ? '-' : fmt((isNaN(o) ? 0 : o) + (isNaN(s) ? 0 : s)) + '점';
}
$('obj').addEventListener('input', calc); $('subj').addEventListener('input', calc);

$('form').addEventListener('submit', async e => {
  e.preventDefault(); showErr('err2', '');
  if (!$('sel-grade').value) return showErr('err2', '학년을 선택해 주세요.');
  if (!who) return showErr('err2', '내 이름을 선택해 주세요.');
  const needSubj = who.grade === '고2' || who.grade === '고3';
  let school = '';
  if (!who.has_school) {
    school = $('school').value === '__etc' ? $('school-etc').value.trim() : $('school').value;
    if (!school) return showErr('err2', '학교를 선택해 주세요.');
  }
  if (needSubj && !$('subject').value) return showErr('err2', '과목을 선택해 주세요.');
  const etype = $('etype').value, o = parseFloat($('obj').value), s = parseFloat($('subj').value);
  if (!etype) return showErr('err2', '시험 종류를 선택해 주세요.');
  if (isNaN(o) || isNaN(s)) return showErr('err2', '객관식·주관식 점수를 모두 입력해 주세요. (없으면 0)');
  if (o < 0 || s < 0 || o > 100 || s > 100) return showErr('err2', '점수는 0~100 사이로 입력해 주세요.');
  if (o + s > 100) return showErr('err2', '객관식과 주관식의 합이 100점을 넘을 수 없어요.');
  if (!confirm(`${who.grade} ${who.student_name}\n${etype}${needSubj ? ' · ' + $('subject').value : ''}  객관식 ${fmt(o)} + 주관식 ${fmt(s)} = ${fmt(o + s)}점\n이대로 저장할까요? (저장 후에는 선생님만 고칠 수 있어요)`)) return;
  $('go2').disabled = true;
  const { data, error } = await sb.rpc('rpc_public_submit_exam_score', {
    p_ref: who.ref, p_exam_type: etype, p_objective: o, p_subjective: s, p_school: school, p_subject: needSubj ? $('subject').value : null });
  $('go2').disabled = false;
  if (error) return showErr('err2', friendly(error));
  $('form').hidden = true; $('step3').hidden = false;
  $('done-msg').textContent = `${data.student_name} · ${data.exam_year}학년도 ${data.exam_type}${needSubj ? ' (' + data.subject + ')' : ''} · 총점 ${fmt(data.total_score)}점`;
});

// 같은 학생, 다른 시험: 학생·학교·과목은 그대로 두고 시험·점수만 비움
$('again').onclick = () => { $('form').hidden = false; $('step3').hidden = true; $('etype').value = ''; $('obj').value = ''; $('subj').value = ''; calc(); showErr('err2', ''); window.scrollTo(0, 0); };
$('home').onclick = () => { $('form').hidden = false; $('step3').hidden = true; $('sel-grade').value = ''; $('sel-grade').dispatchEvent(new Event('change')); $('etype').value = ''; $('obj').value = ''; $('subj').value = ''; calc(); window.scrollTo(0, 0); };
loadPeople();
</script>
</body>
</html>
